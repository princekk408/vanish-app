async function adminParents(){const {data:parents}=await sb.from('rs_parent_profiles').select('*').order('created_at',{ascending:false});const {data:links}=await sb.from('rs_parent_students').select('*');const students=await fetchStudents(AState.classId||'');adminShell('<div class="card"><div class="sectionKicker">Family Access</div><h2>Parent Portal Management</h2><p class="muted">Create secure parent accounts and link them to children. Parents only see released results for linked students.</p><div class="grid2" style="margin-top:10px"><div class="field"><label>Parent email</label><input id="parentNewEmail" type="email"></div><div class="field"><label>Temporary password</label><input id="parentNewPass" type="password"></div><div class="field"><label>Parent full name</label><input id="parentNewName"></div><div class="field"><label>Link student</label><select id="parentNewStudent"><option value="">— select student —</option>'+students.map(s=>'<option value="'+s.id+'">'+esc(s.name)+'</option>').join('')+'</select></div></div><button class="btn" onclick="createParentAccount()">+ Create Parent Account</button><div id="parentCreateMsg"></div></div><div class="card"><h3>Parent directory</h3><div class="tableWrap" style="margin-top:10px"><table><thead><tr><th>Parent</th><th>Email</th><th>Status</th><th>Children</th></tr></thead><tbody>'+((parents||[]).map(p=>'<tr><td><strong>'+esc(p.full_name||'—')+'</strong></td><td>'+esc(p.email||'—')+'</td><td>'+esc(p.status||'active')+'</td><td>'+((links||[]).filter(x=>x.parent_id===p.id).map(x=>students.find(s=>s.id===x.student_id)?.name||x.student_id).map(esc).join(', ')||'—')+'</td></tr>').join('')||'<tr><td colspan="4" class="muted">No parent accounts yet.</td></tr>')+'</tbody></table></div></div>','parents')}
async function createParentAccount(){const email=$('parentNewEmail').value.trim(),pass=$('parentNewPass').value,name=$('parentNewName').value.trim(),student=$('parentNewStudent').value;if(!email||!pass||!name||!student)return toast('Fill all parent fields','error');const c=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:false,autoRefreshToken:false,storageKey:'rs_parent_creation'}});const {data,error}=await c.auth.signUp({email,password:pass});if(error)return toast(error.message,'error');if(!data.user)return toast('Account created; email confirmation may be required.','info');const {error:pe}=await sb.from('rs_parent_profiles').insert({id:data.user.id,email,full_name:name,status:'active'});if(pe)return toast(pe.message,'error');const {error:le}=await sb.from('rs_parent_students').insert({parent_id:data.user.id,student_id:student});if(le)return toast(le.message,'error');toast('Parent account created and child linked','success');adminParents()}
async function parentHome(){const u=(await sb.auth.getUser()).data.user;if(!u)return loginScreen();const {data:links}=await sb.from('rs_parent_students').select('student_id').eq('parent_id',u.id);const ids=(links||[]).map(x=>x.student_id);const {data:students}=ids.length?await sb.from('rs_students').select('*,rs_classes(*)').in('id',ids):{data:[]};app.innerHTML='<div class="topbar"><span class="brand">👨‍👩‍👧 Parent Portal</span><button class="btn sm outline" style="color:#fff;border-color:rgba(255,255,255,.4)" onclick="logout()">Logout</button></div><div class="content"><div class="card"><div class="sectionKicker">Family Dashboard</div><h2>Welcome</h2><p class="muted">View your children’s released academic results and key school information.</p></div>'+((students||[]).map(s=>'<div class="card"><div class="top"><div><h2>'+esc(s.name)+'</h2><p class="muted">'+esc(s.rs_classes?.name||'')+'</p></div><span class="pill gold">Student</span></div><button class="btn" onclick="parentResults(\''+s.id+'\',\''+s.class_id+'\')">📄 View Released Results</button></div>').join('')||'<div class="card"><p class="muted">No linked students yet. Ask the school administrator to link your account.</p></div>')+'</div>'}
async function parentResults(studentId,classId){const {data:pub}=await sb.from('rs_publish').select('*,rs_terms(*,rs_sessions(*))').eq('class_id',classId).eq('published',true);app.innerHTML='<div class="topbar"><span class="brand">📄 Released Results</span><button class="btn sm outline" style="color:#fff;border-color:rgba(255,255,255,.4)" onclick="parentHome()">Back</button></div><div class="content"><div class="card">'+((pub||[]).map(p=>'<div class="list-item"><span><strong>'+esc(p.rs_terms?.name||'')+'</strong> · '+esc(p.rs_terms?.rs_sessions?.name||'')+'</span><button class="btn sm" onclick="showPrintPage(\''+studentId+'\',\''+classId+'\',\''+p.term_id+'\',\'parentHome\')">View / Save PDF</button></div>').join('')||'<p class="muted">No released results yet.</p>')+'</div></div>'}

async function adminBackups(){adminShell('<div class="card"><div class="sectionKicker">Data Protection</div><h2>Automatic Backup Centre</h2><p class="muted">Create a complete JSON snapshot of your school data. The supplied SQL migration also creates the server-side backup function/table; scheduled backups can be enabled with Supabase pg_cron.</p><div class="flex" style="margin-top:12px"><button class="btn" onclick="createBackupDownload()">☁️ Backup Now</button><button class="btn outline" onclick="runServerBackup()">🔐 Create Server Snapshot</button></div><div id="backupMsg"></div><div class="banner info" style="margin-top:12px">Browser downloads are a safety copy. For true unattended backups, enable the included database scheduler/backup job in Supabase.</div></div>','backups')}
async function getRows(table){const {data,error}=await sb.from(table).select('*');if(error)throw error;return data||[]}
async function createBackupDownload(){const tables=['rs_sessions','rs_terms','rs_classes','rs_subjects','rs_components','rs_students','rs_scores','rs_remarks','rs_mocks','rs_mock_attempts','rs_publish','rs_settings','rs_grading_scale','rs_staff_profiles','rs_staff_assignments','rs_attendance','rs_fees','rs_approvals','rs_parent_profiles','rs_parent_students'];const out={backup_version:1,created_at:new Date().toISOString(),tables:{}};for(const tname of tables){try{out.tables[tname]=await getRows(tname)}catch(e){out.tables[tname]=[]}}const blob=new Blob([JSON.stringify(out,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='de-trinity-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(url);toast('Backup downloaded','success')}
async function runServerBackup(){const {data,error}=await sb.rpc('rs_create_backup');if(error)return toast(error.message,'error');toast('Server snapshot created','success');$('backupMsg').innerHTML='<div class="banner success">Server backup snapshot created at '+fmtDateTime(new Date())+'.</div>'}

/* Principal approval gate for publishing. */
async function togglePublish(pub){if(!AState.classId||!AState.termId)return;if(actorIs('teacher','staff')){const u=(await sb.auth.getUser()).data.user;const {error}=await sb.from('rs_approvals').upsert({class_id:AState.classId,term_id:AState.termId,submitted_by:u.id,status:'pending'},{onConflict:'class_id,term_id'});if(error)return toast(error.message,'error');toast('Submitted for principal/admin approval.','success');adminApprovals();return}const payload={class_id:AState.classId,term_id:AState.termId,published:pub,published_at:pub?new Date().toISOString():null};const {error}=await sb.from('rs_publish').upsert(payload,{onConflict:'class_id,term_id'});if(error)return toast(error.message,'error');toast(pub?'Result published!':'Result unpublished','success');adminPublish()}

async function resetStudentPassword(id){const np=prompt('Enter new password for this student:');if(!np)return;try{await setStudentPassword(id,np);toast('Password reset securely','success');adminStudents()}catch(e){toast(e.message,'error')}}
/* Auto snapshot while an authorised admin session is open. */
setInterval(()=>{if(currentActor&&actorIs('admin','principal')){runServerBackup().catch(()=>{})}},30*60*1000);

/* Boot/session upgrade. */
(async function upgradeBoot(){try{const s=loadSession();if(s?.role==='parent'&&s.actor){currentActor=s.actor;return parentHome()}if(s?.role==='staff'&&s.actor){try{await loadStaffActor();return adminHome()}catch(e){clearSession()}}}catch(e){console.warn(e)}})();
</script>

<style>
/* DE-TRINITY V2: professional responsive layer */
.v2-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.v2-grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.v2-stat{padding:16px;border:1px solid var(--border);border-radius:14px;background:var(--surface);box-shadow:var(--shadow-sm)}.v2-stat b{display:block;font-size:25px;color:var(--primary)}.v2-stat span{font-size:11px;text-transform:uppercase;font-weight:800;color:var(--muted)}.v2-toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.v2-muted{color:var(--muted);font-size:12px}.v2-photo{width:52px;height:64px;object-fit:cover;border-radius:7px;border:1px solid var(--border);display:block}.v2-no-photo{width:52px;height:64px;border:1px dashed var(--border);border-radius:7px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:9px;text-align:center}.v2-mini{font-size:10px}.v2-actions{display:flex;gap:5px;flex-wrap:wrap}.v2-sticky{position:sticky;top:0;z-index:4;background:var(--surface);padding:8px 0}.v2-ok{color:var(--success);font-weight:800}.v2-warn{color:#a56a00;font-weight:800}.v2-bad{color:var(--danger);font-weight:800}.v2-hidden{display:none!important}
@media(max-width:900px){.v2-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.v2-grid2{grid-template-columns:1fr}}
@media(max-width:560px){.v2-grid{grid-template-columns:1fr 1fr}.v2-stat{padding:11px}.v2-stat b{font-size:20px}.v2-toolbar .btn{flex:1 1 auto}.v2-photo,.v2-no-photo{width:44px;height:54px}}
</style>

<script>
/* ================================================================
   DE-TRINITY RESULT PORTAL — V2 HARDENED FEATURE LAYER
   Keeps the original academic/result engine intact and restores every
   requested professional feature without removing the photo workflow.
   ================================================================ */
(function(){
  const V2_TABS=[
    ['dashboard','📊 Dashboard'],['setup','🏗️ Setup'],['students','🧑‍🎓 Students'],['subjects','📚 Subjects'],
    ['scores','✍️ Score Entry'],['broadsheet','📈 Broadsheet'],['attendance','🗓️ Attendance'],['fees','💳 Fees'],
    ['staff','👥 Staff'],['approvals','✅ Approvals'],['analytics','📊 Analytics'],['parents','👨‍👩‍👧 Parents'],
    ['remarks','📋 Remarks'],['mocks','📝 Mocks'],['publish','📢 Publish'],['lifetime','📁 Lifetime'],['backups','☁️ Backups'],['settings','⚙️ Settings']
  ];
  window.v2Actor=null; window.v2ClassIds=new Set(); window.v2SubjectIds=new Set();
  const esc2=x=>typeof esc==='function'?esc(x):String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const money=x=>'₦'+Number(x||0).toLocaleString('en-NG',{maximumFractionDigits:2});
  const today=()=>new Date().toISOString().slice(0,10);
  const actor=()=>window.v2Actor||loadSession()?.actor||null;
  const roles=(...r)=>r.includes(actor()?.role);
  const privileged=()=>roles('admin','principal');
  const teacher=()=>roles('teacher','staff');
  const can2=tab=>{const a=actor();if(!a)return false;if(privileged())return true;if(a.role==='parent')return false;const p=a.permissions||{};return p[tab]!==false && !!p[tab]};
  const errText=e=>esc2(e?.message||e?.error_description||e||'Unknown error');
  function v2Shell(body,active){
    const a=actor()||{full_name:'Administrator',role:'admin'};
    const tabs=V2_TABS.filter(([id])=>privileged()||can2(id)).map(([id,l])=>`<button class="${active===id?'active':''}" onclick="adminNav('${id}')">${l}</button>`).join('');
    app.innerHTML=`<div class="topbar"><span class="brand">🏫 De-Trinity Result Portal</span><span style="margin-left:auto;display:flex;align-items:center;gap:8px"><span class="roleBadge">${esc2(a.role)}</span><span class="v2-mini">${esc2(a.full_name||'')}</span><button class="btn sm outline" style="color:#fff;border-color:rgba(255,255,255,.4)" onclick="logout()">Logout</button></span></div><div class="navrow">${tabs}</div><div class="content" id="content">${body}</div>`;
  }
  window.adminShell=v2Shell;
  window.adminNav=function(id){if(!(privileged()||can2(id)))return toast('You do not have permission for this section','error');const f={dashboard:adminDashboard,setup:adminSetup,students:adminStudents,subjects:adminSubjects,scores:adminScores,broadsheet:adminBroadsheet,attendance:v2Attendance,fees:v2Fees,staff:v2Staff,approvals:v2Approvals,analytics:v2Analytics,parents:v2Parents,remarks:adminRemarks,mocks:adminMocks,publish:adminPublish,lifetime:adminLifetime,backups:v2Backups,settings:adminSettings};return (f[id]||adminDashboard)()};
  window.adminHome=()=>adminDashboard();

  window.fetchClasses=async function(termId){const {data,error}=await sb.from('rs_classes').select('*').eq('term_id',termId).order('name');if(error)throw error;let a=data||[];if(teacher())a=a.filter(x=>window.v2ClassIds.has(x.id));return a};
  window.fetchSubjects=async function(classId){const {data,error}=await sb.from('rs_subjects').select('*').eq('class_id',classId).order('name');if(error)throw error;let a=data||[];if(teacher())a=a.filter(x=>window.v2SubjectIds.has(x.id));return a};
  window.fetchStudents=async function(classId){const {data,error}=await sb.from('rs_students').select('*').eq('class_id',classId).order('name');if(error)throw error;return data||[]};

  window.loadStaffActor=async function(){
    const {data:{user}}=await sb.auth.getUser();if(!user)throw new Error('No signed-in staff session.');
    const {data,error}=await sb.from('rs_staff_profiles').select('*').eq('id',user.id).maybeSingle();
    if(error)throw error;if(!data)throw new Error('Staff account exists in Authentication, but its staff profile is missing. Open Staff in Admin and use Sync Profile.');
    if(data.status!=='active')throw new Error('This staff account is disabled. Contact the administrator.');
    if(data.approved!==true)throw new Error('Staff account created successfully but is awaiting Admin/Principal approval.');
    const {data:as,error:ae}=await sb.from('rs_staff_assignments').select('class_id,subject_id').eq('staff_id',user.id);if(ae)throw ae;
    window.v2ClassIds=new Set((as||[]).map(x=>x.class_id).filter(Boolean));window.v2SubjectIds=new Set((as||[]).map(x=>x.subject_id).filter(Boolean));
    window.v2Actor={...data,role:data.role,permissions:data.permissions||{}};saveSession({role:'staff',actor:window.v2Actor});return window.v2Actor;
  };
  window.doStaffLogin=async function(){const email=$('staffEmail')?.value.trim().toLowerCase(),pass=$('staffPass')?.value||'',msg=$('loginMsg');if(!email||!pass)return msg.innerHTML='<div class="banner error">Enter staff email and password.</div>';msg.innerHTML='<div class="banner info">Signing in…</div>';const {error}=await sb.auth.signInWithPassword({email,password:pass});if(error){msg.innerHTML='<div class="banner error">'+errText(error)+'</div>';return}try{await loadStaffActor();adminHome()}catch(e){await sb.auth.signOut();clearSession();msg.innerHTML='<div class="banner error">'+errText(e)+'</div>'}};

  /* ---------- STUDENTS: full registry + photo upload + secure password ---------- */
  window.adminStudents=async function(){
    if(!AState.classId){v2Shell('<div class="card"><div class="banner info">Select a class in Setup first.</div></div>','students');return}
    const [students,cls]=await Promise.all([fetchStudents(AState.classId),sb.from('rs_classes').select('*').eq('id',AState.classId).maybeSingle().then(x=>x.data)]);
    const body=`<div class="card"><div class="top"><div><div class="sectionKicker">Student Registry</div><h2>${esc2(cls?.name||'')} — Students</h2></div><span class="pill gold">${students.length} student(s)</span></div><div class="v2-grid2"><div class="field"><label>Full name</label><input id="stName"></div><div class="field"><label>Sex</label><select id="stSex"><option>Male</option><option>Female</option></select></div><div class="field"><label>Age</label><input id="stAge" type="number" min="1"></div><div class="field"><label>House</label><input id="stHouse"></div><div class="field"><label>Parent / Guardian</label><input id="stParent"></div><div class="field"><label>Temporary password</label><input id="stPass" type="password" placeholder="Minimum 6 characters"></div></div><div class="v2-toolbar" style="margin-top:12px"><button class="btn" onclick="createStudent()">+ Add Student</button><button class="btn outline" onclick="showBulkStudentImport()">📥 Bulk Import</button><button class="btn outline" onclick="v2ExportStudents()">📤 Export CSV</button></div></div><div id="bulkStudentArea"></div><div class="card"><div class="top"><h3>Student directory</h3><span class="v2-muted">Photos can be uploaded/replaced individually</span></div><div class="tableWrap"><table><thead><tr><th>Photo</th><th>Name</th><th>Sex</th><th>Age</th><th>House</th><th>Parent</th><th>Profile Code</th><th>Actions</th></tr></thead><tbody>${students.map(s=>`<tr><td>${s.photo_url?`<img class="v2-photo" src="${esc2(s.photo_url)}" alt="${esc2(s.name)}">`:`<div class="v2-no-photo">No photo</div>`}<input type="file" accept="image/jpeg,image/png,image/webp" id="v2photo_${s.id}" style="width:115px;margin-top:5px"><button class="btn sm outline" onclick="v2UploadPhoto('${s.id}')">Upload photo</button></td><td><strong>${esc2(s.name)}</strong></td><td>${esc2(s.sex||'—')}</td><td>${esc2(s.age||'—')}</td><td>${esc2(s.house||'—')}</td><td>${esc2(s.parent_name||'—')}</td><td><span class="pill">${esc2(s.profile_code||'—')}</span><button class="btn sm outline" onclick="regenProfileCode('${s.id}')">New</button></td><td><div class="v2-actions"><button class="btn sm outline" onclick="v2ResetStudentPassword('${s.id}')">Reset password</button><button class="btn sm danger" onclick="deleteStudent('${s.id}')">Delete</button></div></td></tr>`).join('')||'<tr><td colspan="8" class="v2-muted">No students yet.</td></tr>'}</tbody></table></div></div>`;
    v2Shell(body,'students');
  };
  window.v2UploadPhoto=async function(id){if(!privileged()&&!teacher())return toast('Not authorised','error');const input=$('v2photo_'+id),file=input?.files?.[0];if(!file)return toast('Choose a photo first','error');if(file.size>2*1024*1024)return toast('Photo must be 2MB or smaller','error');if(!/^image\/(jpeg|png|webp)$/.test(file.type))return toast('Use JPG, PNG or WebP','error');toast('Uploading photo…','info');const {data:old}=await sb.from('rs_students').select('photo_url').eq('id',id).maybeSingle();if(old?.photo_url){const marker='/student-photos/';const i=old.photo_url.indexOf(marker);if(i>=0)await sb.storage.from('student-photos').remove([decodeURIComponent(old.photo_url.slice(i+marker.length))])}const ext=file.type==='image/png'?'png':file.type==='image/webp'?'webp':'jpg';const path=id+'/'+Date.now()+'.'+ext;const {error}=await sb.storage.from('student-photos').upload(path,file,{upsert:true,contentType:file.type});if(error)return toast('Photo upload failed: '+error.message,'error');const {data:pub}=sb.storage.from('student-photos').getPublicUrl(path);const {error:ue}=await sb.from('rs_students').update({photo_url:pub.publicUrl}).eq('id',id);if(ue)return toast('Photo uploaded but profile update failed: '+ue.message,'error');toast('Student photo uploaded successfully','success');adminStudents()};
  window.createStudent=async function(){if(!AState.classId)return toast('Select a class first','error');const name=$('stName')?.value.trim(),pass=$('stPass')?.value.trim()||Math.random().toString(36).slice(2,10);if(!name)return toast('Enter student name','error');if(pass.length<6)return toast('Student password must be at least 6 characters','error');const payload={class_id:AState.classId,name,sex:$('stSex').value,age:$('stAge').value?parseInt($('stAge').value):null,house:$('stHouse').value.trim()||null,parent_name:$('stParent').value.trim()||null,profile_code:genProfileCode()};const {data,error}=await sb.from('rs_students').insert(payload).select('id').single();if(error)return toast(error.message,'error');try{await sb.rpc('rs_set_student_password',{p_student_id:data.id,p_password:pass})}catch(e){await sb.from('rs_students').delete().eq('id',data.id);return toast(e.message,'error')}toast('Student added securely','success');adminStudents()};
  window.v2ResetStudentPassword=async id=>{const np=prompt('Enter the new student password (minimum 6 characters):');if(!np)return;if(np.length<6)return toast('Password must be at least 6 characters','error');const {error}=await sb.rpc('rs_set_student_password',{p_student_id:id,p_password:np});if(error)return toast(error.message,'error');toast('Password changed securely','success')};
  window.v2ExportStudents=async()=>{const s=await fetchStudents(AState.classId);const rows=[['Name','Sex','Age','House','Parent','Profile Code'],...s.map(x=>[x.name,x.sex||'',x.age||'',x.house||'',x.parent_name||'',x.profile_code||''])];const csv=rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='de-trinity-students.csv';a.click()};

  /* ---------- BULK STUDENTS: preview, validation, import ---------- */
  window.showBulkStudentImport=function(){const area=$('bulkStudentArea');if(!area)return;area.innerHTML=`<div class="card"><div class="sectionKicker">Bulk Student Import</div><h3>Paste CSV / spreadsheet rows</h3><p class="v2-muted">Columns: Name, Sex, Age, House, Parent/Guardian, Password. Header row is optional. Use commas or tabs.</p><textarea id="v2BulkText" rows="9" placeholder="John Okafor, Male, 12, Red, Mrs Okafor, secret123"></textarea><div class="v2-toolbar" style="margin-top:8px"><button class="btn outline" onclick="v2PreviewBulk()">Preview</button><button class="btn" onclick="v2ImportBulk()">Import Students</button></div><div id="v2BulkPreview" style="margin-top:10px"></div></div>`};
  function parseBulk(){const text=$('v2BulkText')?.value.trim()||'';return text.split(/\r?\n/).map((line,i)=>({line:i+1,p:line.split(/\t|,(?=(?:[^\"]*\"[^\"]*\")*[^\"]*$)/).map(x=>x.trim().replace(/^"|"$/g,''))})).filter(x=>x.p.some(Boolean)).filter(x=>!/^name$/i.test(x.p[0]));}
  window.v2PreviewBulk=function(){const rows=parseBulk(),bad=rows.filter(x=>x.p.length<6);$('v2BulkPreview').innerHTML=`<div class="banner ${bad.length?'error':'success'}">${rows.length} row(s) detected; ${bad.length} invalid row(s).</div><div class="tableWrap" style="margin-top:8px"><table><thead><tr><th>#</th><th>Name</th><th>Sex</th><th>Age</th><th>House</th><th>Parent</th><th>Password</th></tr></thead><tbody>${rows.slice(0,30).map(x=>`<tr><td>${x.line}</td>${[0,1,2,3,4,5].map(i=>`<td>${esc2(x.p[i]||'')}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`};
  window.v2ImportBulk=async function(){const rows=parseBulk();if(!rows.length)return toast('Paste student rows first','error');const valid=rows.filter(x=>x.p.length>=6);if(valid.length!==rows.length)toast(`${rows.length-valid.length} invalid row(s) skipped`,'info');let ok=0,failed=[];for(const r of valid){const [name,sex,age,house,parent,pass]=r.p;if(!name||String(pass||'').length<6){failed.push(`Line ${r.line}: name/password invalid`);continue}const {data,error}=await sb.from('rs_students').insert({class_id:AState.classId,name,sex:sex||null,age:age?parseInt(age):null,house:house||null,parent_name:parent||null,profile_code:genProfileCode()}).select('id').single();if(error){failed.push(`Line ${r.line}: ${error.message}`);continue}const {error:pe}=await sb.rpc('rs_set_student_password',{p_student_id:data.id,p_password:pass});if(pe){await sb.from('rs_students').delete().eq('id',data.id);failed.push(`Line ${r.line}: password setup failed`);continue}ok++}toast(`Imported ${ok} student(s)${failed.length?`; ${failed.length} failed`:''}`,'success');adminStudents()};

  /* ---------- STAFF: auth account + profile + approval + assignments ---------- */
  window.v2Staff=async function(){if(!privileged())return v2Shell('<div class="card"><div class="banner error">Only Admin/Principal can manage staff.</div></div>','staff');const {data:staff,error}=await sb.from('rs_staff_profiles').select('*').order('created_at',{ascending:false});if(error)return v2Shell('<div class="card"><div class="banner error">'+errText(error)+'</div></div>','staff');const classes=AState.termId?await fetchClasses(AState.termId):[];v2Shell(`<div class="card"><div class="sectionKicker">Access Control</div><h2>Staff Accounts & Permissions</h2><p class="v2-muted">Staff accounts use Supabase Authentication. New accounts start pending and must be approved.</p><div class="v2-grid2"><div class="field"><label>Full name</label><input id="v2StaffName"></div><div class="field"><label>Email</label><input id="v2StaffEmail" type="email"></div><div class="field"><label>Temporary password</label><input id="v2StaffPass" type="password" minlength="6"></div><div class="field"><label>Role</label><select id="v2StaffRole"><option value="teacher">Teacher</option><option value="principal">Principal</option><option value="bursar">Bursar</option><option value="admin">Admin</option></select></div></div><button class="btn" onclick="v2CreateStaff()">+ Create Staff Account</button><div id="v2StaffMsg"></div></div><div class="card"><h3>Staff Directory</h3><div class="tableWrap"><table><thead><tr><th>Name / Email</th><th>Role</th><th>Status</th><th>Approval</th><th>Assignments</th><th>Actions</th></tr></thead><tbody>${(staff||[]).map(x=>`<tr><td><strong>${esc2(x.full_name)}</strong><br><span class="v2-muted">${esc2(x.email)}</span></td><td><span class="roleBadge">${esc2(x.role)}</span></td><td>${x.status==='active'?'<span class="v2-ok">Active</span>':'<span class="v2-bad">Disabled</span>'}</td><td>${x.approved?'<span class="v2-ok">Approved</span>':'<span class="v2-warn">Pending</span>'}</td><td><button class="btn sm outline" onclick="v2Assignments('${x.id}')">Manage</button></td><td>${x.approved?'<button class="btn sm outline" onclick="v2RevokeStaff(\''+x.id+'\')">Revoke</button>':'<button class="btn sm gold" onclick="v2ApproveStaff(\''+x.id+'\')">Approve</button>'} <button class="btn sm danger" onclick="v2DisableStaff(\''+x.id+'\')">${x.status==='disabled'?'Enable':'Disable'}</button></td></tr>`).join('')||'<tr><td colspan="6">No staff accounts.</td></tr>'}</tbody></table></div></div><div id="v2StaffAssign"></div>`,'staff')};
  window.v2CreateStaff=async function(){const email=$('v2StaffEmail')?.value.trim().toLowerCase(),pass=$('v2StaffPass')?.value,name=$('v2StaffName')?.value.trim(),role=$('v2StaffRole')?.value;if(!email||!pass||!name)return toast('Fill all staff fields','error');if(pass.length<6)return toast('Password must be at least 6 characters','error');const c=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:false,autoRefreshToken:false,storageKey:'de-trinity-staff-create-'+Date.now()}});const {data,error}=await c.auth.signUp({email,password:pass,options:{data:{full_name:name,rs_role:role,account_type:'staff'}}});if(error)return toast(error.message,'error');if(!data.user)return toast('Supabase did not return the new account. Check Authentication settings.','error');let {data:p,error:pe}=await sb.from('rs_staff_profiles').upsert({id:data.user.id,email,full_name:name,role,status:'active',approved:false,permissions:{dashboard:true,setup:false,students:true,subjects:true,scores:true,broadsheet:true,attendance:true,fees:false,staff:false,approvals:false,analytics:true,parents:false,remarks:true,mocks:true,publish:false,lifetime:true,backups:false,settings:false}},{onConflict:'id'});if(pe)return toast('Auth account was created, but profile creation failed: '+pe.message,'error');toast(data.session?'Staff created — approve the account before login.':'Staff created. If email confirmation is enabled, the staff member must confirm the email first, then wait for approval.','success');v2Staff()};
  window.v2ApproveStaff=async id=>{const u=(await sb.auth.getUser()).data.user;if(!u)return;if(!confirm('Approve this staff account?'))return;const {error}=await sb.from('rs_staff_profiles').update({approved:true,status:'active',approved_by:u.id,approved_at:new Date().toISOString()}).eq('id',id);if(error)return toast(error.message,'error');toast('Staff approved. They can now log in.','success');v2Staff()};
  window.v2RevokeStaff=async id=>{if(!confirm('Revoke approval for this staff account?'))return;const {error}=await sb.from('rs_staff_profiles').update({approved:false}).eq('id',id);if(error)return toast(error.message,'error');toast('Approval revoked','success');v2Staff()};
  window.v2DisableStaff=async id=>{const row=(await sb.from('rs_staff_profiles').select('status').eq('id',id).maybeSingle()).data;if(!row)return;if(!confirm(row.status==='disabled'?'Enable this staff account?':'Disable this staff account?'))return;const {error}=await sb.from('rs_staff_profiles').update({status:row.status==='disabled'?'active':'disabled'}).eq('id',id);if(error)return toast(error.message,'error');v2Staff()};
  window.v2Assignments=async id=>{const staff=(await sb.from('rs_staff_profiles').select('*').eq('id',id).maybeSingle()).data;const {data:as}=await sb.from('rs_staff_assignments').select('*').eq('staff_id',id);const {data:sessions}=await sb.from('rs_sessions').select('*').order('created_at',{ascending:false});const session=AState.sessionId||(sessions||[])[0]?.id;const terms=session?(await sb.from('rs_terms').select('*').eq('session_id',session).order('created_at')).data||[]:[];const classes= AState.termId?await sb.from('rs_classes').select('*').eq('term_id',AState.termId).order('name').then(x=>x.data||[]):[];const subjects=AState.classId?await sb.from('rs_subjects').select('*').eq('class_id',AState.classId).order('name').then(x=>x.data||[]):[];$('v2StaffAssign').innerHTML=`<div class="card"><div class="top"><div><div class="sectionKicker">Assignments</div><h3>${esc2(staff?.full_name||'Staff')}</h3><p class="v2-muted">Current setup context: select a term/class in Setup before assigning.</p></div></div><div class="v2-grid2"><div><label>Classes for current term</label><div class="permGrid">${classes.map(c=>`<label><input type="checkbox" class="v2class" value="${c.id}" ${(as||[]).some(x=>x.class_id===c.id)?'checked':''}> ${esc2(c.name)}</label>`).join('')||'<span class="v2-muted">Select a term first.</span>'}</div></div><div><label>Subjects for current class</label><div class="permGrid">${subjects.map(s=>`<label><input type="checkbox" class="v2sub" value="${s.id}" ${(as||[]).some(x=>x.subject_id===s.id)?'checked':''}> ${esc2(s.name)}</label>`).join('')||'<span class="v2-muted">Select a class first.</span>'}</div></div></div><button class="btn" style="margin-top:12px" onclick="v2SaveAssignments('${id}')">Save Assignments</button></div>`};
  window.v2SaveAssignments=async id=>{await sb.from('rs_staff_assignments').delete().eq('staff_id',id);const rows=[...document.querySelectorAll('.v2class:checked')].map(x=>({staff_id:id,class_id:x.value})).concat([...document.querySelectorAll('.v2sub:checked')].map(x=>({staff_id:id,subject_id:x.value})));if(rows.length){const {error}=await sb.from('rs_staff_assignments').insert(rows);if(error)return toast(error.message,'error')}toast('Assignments saved','success');v2Staff()};

  /* ---------- ATTENDANCE ---------- */
  window.v2Attendance=async function(){if(!AState.classId||!AState.termId)return v2Shell('<div class="card"><div class="banner info">Select class and term first.</div></div>','attendance');const date=window.v2AttDate||today(),students=await fetchStudents(AState.classId),{data:rows}=await sb.from('rs_attendance').select('*').eq('term_id',AState.termId).eq('date',date).in('student_id',students.map(s=>s.id));const m={};(rows||[]).forEach(x=>m[x.student_id]=x.status);v2Shell(`<div class="card"><div class="top"><div><div class="sectionKicker">Daily Attendance</div><h2>${esc2((await sb.from('rs_classes').select('name').eq('id',AState.classId).maybeSingle()).data?.name||'Class')}</h2></div><input type="date" value="${date}" onchange="v2SetAttDate(this.value)" style="max-width:170px"></div><p class="v2-muted">Present and Late count as attendance for the term summary. Excused is tracked separately.</p><div class="tableWrap"><table><thead><tr><th>Student</th><th>Status</th></tr></thead><tbody>${students.map(s=>`<tr><td><strong>${esc2(s.name)}</strong></td><td><select class="v2att" data-sid="${s.id}"><option value="present" ${m[s.id]==='present'?'selected':''}>Present</option><option value="absent" ${m[s.id]==='absent'?'selected':''}>Absent</option><option value="late" ${m[s.id]==='late'?'selected':''}>Late</option><option value="excused" ${m[s.id]==='excused'?'selected':''}>Excused</option></select></td></tr>`).join('')}</tbody></table></div><button class="btn" style="margin-top:12px" onclick="v2SaveAttendance()">💾 Save Attendance</button></div>`,'attendance')};
  window.v2SetAttDate=d=>{window.v2AttDate=d;v2Attendance()};
  window.v2SaveAttendance=async function(){const uid=(await sb.auth.getUser()).data.user?.id;const rows=[...document.querySelectorAll('.v2att')].map(x=>({student_id:x.dataset.sid,term_id:AState.termId,date:window.v2AttDate||today(),status:x.value,marked_by:uid}));const {error}=await sb.from('rs_attendance').upsert(rows,{onConflict:'student_id,term_id,date'});if(error)return toast(error.message,'error');for(const r of rows){const {data:all}=await sb.from('rs_attendance').select('status').eq('student_id',r.student_id).eq('term_id',AState.termId);const total=(all||[]).length,present=(all||[]).filter(x=>x.status==='present'||x.status==='late').length;await sb.from('rs_remarks').upsert({student_id:r.student_id,term_id:AState.termId,total_days:total,days_present:present},{onConflict:'student_id,term_id'})}toast('Attendance saved and result summary updated','success')};

  /* ---------- FEES + PAYMENTS ---------- */
  window.v2Fees=async function(){if(!AState.classId||!AState.termId)return v2Shell('<div class="card"><div class="banner info">Select class and term first.</div></div>','fees');const students=await fetchStudents(AState.classId),{data:fees}=await sb.from('rs_fees').select('*').eq('term_id',AState.termId).in('student_id',students.map(s=>s.id)).order('created_at',{ascending:false});const billed=(fees||[]).reduce((a,x)=>a+Number(x.amount||0),0),paid=(fees||[]).reduce((a,x)=>a+Number(x.paid_amount||0),0);v2Shell(`<div class="card"><div class="sectionKicker">Finance</div><h2>Fees & Payment Management</h2><div class="v2-grid"><div class="v2-stat"><b>${money(billed)}</b><span>Total billed</span></div><div class="v2-stat"><b>${money(paid)}</b><span>Total collected</span></div><div class="v2-stat"><b>${money(Math.max(0,billed-paid))}</b><span>Outstanding</span></div><div class="v2-stat"><b>${fees?.length||0}</b><span>Fee records</span></div></div><div class="v2-grid2" style="margin-top:14px"><div class="field"><label>Student</label><select id="v2FeeStudent">${students.map(s=>`<option value="${s.id}">${esc2(s.name)}</option>`).join('')}</select></div><div class="field"><label>Fee item</label><input id="v2FeeItem" placeholder="Tuition / Transport / Uniform"></div><div class="field"><label>Amount billed</label><input id="v2FeeAmount" type="number" min="0"></div><div class="field"><label>Amount paid now</label><input id="v2FeePaid" type="number" min="0" value="0"></div><div class="field"><label>Due date</label><input id="v2FeeDue" type="date"></div><div class="field"><label>Receipt / reference</label><input id="v2FeeRef"></div></div><button class="btn" style="margin-top:10px" onclick="v2SaveFee()">💾 Save Fee & Payment</button></div><div class="card"><h3>Payment ledger</h3><div class="tableWrap"><table><thead><tr><th>Student</th><th>Item</th><th>Billed</th><th>Paid</th><th>Balance</th><th>Status</th><th>Reference</th></tr></thead><tbody>${(fees||[]).map(f=>`<tr><td>${esc2(students.find(s=>s.id===f.student_id)?.name||'—')}</td><td>${esc2(f.item||'—')}</td><td>${money(f.amount)}</td><td>${money(f.paid_amount)}</td><td>${money(Math.max(0,Number(f.amount||0)-Number(f.paid_amount||0)))}</td><td>${esc2(f.status||'—')}</td><td>${esc2(f.reference||'—')}</td></tr>`).join('')||'<tr><td colspan="7">No fee records.</td></tr>'}</tbody></table></div></div>`,'fees')};
  window.v2SaveFee=async function(){const amount=Number($('v2FeeAmount')?.value||0),paid=Number($('v2FeePaid')?.value||0);if(amount<=0||paid<0||paid>amount)return toast('Check billed and paid amounts','error');const status=paid>=amount?'paid':paid>0?'partial':'unpaid';const {error}=await sb.from('rs_fees').insert({student_id:$('v2FeeStudent').value,term_id:AState.termId,item:$('v2FeeItem').value.trim()||'School fees',amount,paid_amount:paid,due_date:$('v2FeeDue').value||null,reference:$('v2FeeRef').value.trim()||null,status});if(error)return toast(error.message,'error');toast('Fee record saved','success');v2Fees()};

  /* ---------- APPROVAL / PUBLISH ---------- */
  window.v2Approvals=async function(){if(!privileged())return v2Shell('<div class="card"><div class="banner error">Only Admin/Principal can approve results.</div></div>','approvals');const [{data,error},{data:staff,error:se}]=await Promise.all([sb.from('rs_approvals').select('*').order('created_at',{ascending:false}),sb.from('rs_staff_profiles').select('*').order('created_at',{ascending:false})]);if(error)return v2Shell('<div class="card"><div class="banner error">'+errText(error)+'</div></div>','approvals');if(se)return v2Shell('<div class="card"><div class="banner error">'+errText(se)+'</div></div>','approvals');const [classes,terms]=await Promise.all([sb.from('rs_classes').select('id,name'),sb.from('rs_terms').select('id,name')]);const cm=Object.fromEntries((classes.data||[]).map(x=>[x.id,x.name])),tm=Object.fromEntries((terms.data||[]).map(x=>[x.id,x.name]));const pendingStaff=(staff||[]).filter(x=>x.approved!==true&&x.status!=='disabled');v2Shell(`<div class="card"><div class="sectionKicker">Staff Access</div><h2>Pending Staff Approvals</h2><p class="v2-muted">New teachers and other staff accounts appear here. Approving an account allows the staff member to log in.</p><div class="tableWrap"><table><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th>Action</th></tr></thead><tbody>${pendingStaff.map(x=>`<tr><td><strong>${esc2(x.full_name||'')}</strong></td><td>${esc2(x.email||'')}</td><td><span class="roleBadge">${esc2(x.role||'')}</span></td><td><span class="v2-warn">Pending</span></td><td><button class="btn sm gold" onclick="v2ApproveStaff('${x.id}')">Approve Staff</button></td></tr>`).join('')||'<tr><td colspan="5" class="v2-muted">No pending staff accounts.</td></tr>'}</tbody></table></div><p class="v2-muted" style="margin-top:10px">Already approved staff can still be managed from <strong>Staff & Permissions</strong>.</p></div><div class="card"><div class="sectionKicker">Result Governance</div><h2>Result Approval</h2><p class="v2-muted">A teacher can prepare scores but cannot publish a result until approved.</p><div class="tableWrap"><table><thead><tr><th>Class</th><th>Term</th><th>Status</th><th>Submitted</th><th>Action</th></tr></thead><tbody>${(data||[]).map(x=>`<tr><td>${esc2(cm[x.class_id]||x.class_id)}</td><td>${esc2(tm[x.term_id]||x.term_id)}</td><td>${x.status==='approved'?'<span class="v2-ok">Approved</span>':'<span class="v2-warn">Pending</span>'}</td><td>${esc2(typeof fmtDateTime==='function'?fmtDateTime(x.created_at):x.created_at)}</td><td>${x.status==='pending'?`<button class="btn sm gold" onclick="v2ApproveRequest('${x.id}')">Approve</button>`:'—'}</td></tr>`).join('')||'<tr><td colspan="5">No result approval requests.</td></tr>'}</tbody></table></div></div>`,'approvals')};
  window.v2ApproveRequest=async id=>{const u=(await sb.auth.getUser()).data.user?.id;const {data:r}=await sb.from('rs_approvals').select('*').eq('id',id).maybeSingle();if(!r)return toast('Approval request not found','error');const {error}=await sb.from('rs_approvals').update({status:'approved',approved_by:u,approved_at:new Date().toISOString()}).eq('id',id);if(error)return toast(error.message,'error');toast('Result approved for publication','success');v2Approvals()};
  window.togglePublish=async function(pub){if(!AState.classId||!AState.termId)return toast('Select class and term first','error');if(teacher()){const u=(await sb.auth.getUser()).data.user?.id;const {error}=await sb.from('rs_approvals').upsert({class_id:AState.classId,term_id:AState.termId,submitted_by:u,status:'pending'},{onConflict:'class_id,term_id'});if(error)return toast(error.message,'error');return toast('Submitted to Admin/Principal for approval','success')}if(!privileged())return toast('Not authorised','error');const {data:a}=await sb.from('rs_approvals').select('status').eq('class_id',AState.classId).eq('term_id',AState.termId).eq('status','approved').maybeSingle();if(pub&&!a)return toast('This result has not been approved yet','error');const {error}=await sb.from('rs_publish').upsert({class_id:AState.classId,term_id:AState.termId,published:pub,published_at:pub?new Date().toISOString():null},{onConflict:'class_id,term_id'});if(error)return toast(error.message,'error');toast(pub?'Result published':'Result unpublished','success');adminPublish()};

  /* ---------- ANALYTICS ---------- */
  window.v2Analytics=async function(){let students=AState.classId?await fetchStudents(AState.classId):[],avg=0,complete=0,subjectRows=[];if(AState.classId&&AState.termId){try{const b=await computeBroadsheet(AState.classId,AState.termId);const vals=b.perStudent.map(x=>x.average).filter(x=>x!=null);avg=vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:0;complete=b.perStudent.filter(x=>x.complete).length;subjectRows=b.subjects.map((s,i)=>({name:s.name,avg:(b.perStudent.map(p=>p.subjectTotals[i]?.total).filter(x=>x!=null).reduce((a,x)=>a+x,0)/(b.perStudent.map(p=>p.subjectTotals[i]?.total).filter(x=>x!=null).length||1))}))}catch(e){}}const att=students.length&&AState.termId?(await sb.from('rs_attendance').select('status').eq('term_id',AState.termId).in('student_id',students.map(s=>s.id))).data||[]:[];const present=att.filter(x=>x.status==='present'||x.status==='late').length;v2Shell(`<div class="card"><div class="sectionKicker">Management Intelligence</div><h2>Report Analytics</h2><p class="v2-muted">Performance, completion and attendance for the selected class/term.</p></div><div class="v2-grid"><div class="v2-stat"><b>${avg.toFixed(1)}%</b><span>Class average</span></div><div class="v2-stat"><b>${complete}/${students.length}</b><span>Complete results</span></div><div class="v2-stat"><b>${att.length?Math.round(present/att.length*100):0}%</b><span>Attendance</span></div><div class="v2-stat"><b>${students.length}</b><span>Students</span></div></div><div class="card"><h3>Subject averages</h3><div class="tableWrap"><table><thead><tr><th>Subject</th><th>Average</th></tr></thead><tbody>${subjectRows.map(x=>`<tr><td>${esc2(x.name)}</td><td><strong>${x.avg.toFixed(1)}%</strong></td></tr>`).join('')||'<tr><td colspan="2">No score data yet.</td></tr>'}</tbody></table></div></div>`,'analytics')};

  /* ---------- PARENTS ---------- */
  window.v2Parents=async function(){if(!privileged())return v2Shell('<div class="card"><div class="banner error">Only Admin/Principal can manage parent accounts.</div></div>','parents');const {data:parents}=await sb.from('rs_parent_profiles').select('*').order('created_at',{ascending:false});const {data:links}=await sb.from('rs_parent_students').select('*');const students=AState.classId?await fetchStudents(AState.classId):[];v2Shell(`<div class="card"><div class="sectionKicker">Family Access</div><h2>Parent Portal</h2><p class="v2-muted">Create parent login accounts and link one or more children.</p><div class="v2-grid2"><div class="field"><label>Parent full name</label><input id="v2ParentName"></div><div class="field"><label>Email</label><input id="v2ParentEmail" type="email"></div><div class="field"><label>Temporary password</label><input id="v2ParentPass" type="password"></div><div class="field"><label>Child</label><select id="v2ParentStudent"><option value="">Select child</option>${students.map(s=>`<option value="${s.id}">${esc2(s.name)}</option>`).join('')}</select></div></div><button class="btn" onclick="v2CreateParent()">+ Create Parent</button></div><div class="card"><h3>Parent directory</h3><div class="tableWrap"><table><thead><tr><th>Parent</th><th>Email</th><th>Status</th><th>Children</th></tr></thead><tbody>${(parents||[]).map(p=>`<tr><td>${esc2(p.full_name)}</td><td>${esc2(p.email)}</td><td>${esc2(p.status)}</td><td>${(links||[]).filter(x=>x.parent_id===p.id).map(x=>{const s=students.find(y=>y.id===x.student_id);return s?.name||x.student_id}).map(esc2).join(', ')||'—'}</td></tr>`).join('')||'<tr><td colspan="4">No parents yet.</td></tr>'}</tbody></table></div></div>`,'parents')};
  window.v2CreateParent=async function(){const name=$('v2ParentName')?.value.trim(),email=$('v2ParentEmail')?.value.trim().toLowerCase(),pass=$('v2ParentPass')?.value,student=$('v2ParentStudent')?.value;if(!name||!email||!pass||!student)return toast('Fill all parent fields','error');if(pass.length<6)return toast('Password must be at least 6 characters','error');const c=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:false,autoRefreshToken:false,storageKey:'de-trinity-parent-create-'+Date.now()}});const {data,error}=await c.auth.signUp({email,password:pass,options:{data:{full_name:name,account_type:'parent'}}});if(error)return toast(error.message,'error');if(!data.user)return toast('Parent Auth account was not returned','error');const {error:pe}=await sb.from('rs_parent_profiles').upsert({id:data.user.id,email,full_name:name,status:'active'},{onConflict:'id'});if(pe)return toast(pe.message,'error');const {error:le}=await sb.from('rs_parent_students').upsert({parent_id:data.user.id,student_id:student},{onConflict:'parent_id,student_id'});if(le)return toast(le.message,'error');toast(data.session?'Parent created successfully':'Parent created; email confirmation may be required','success');v2Parents()};
  window.loadParentActor=async function(){const {data:{user}}=await sb.auth.getUser();if(!user)throw new Error('No parent session.');const {data,error}=await sb.from('rs_parent_profiles').select('*').eq('id',user.id).maybeSingle();if(error)throw error;if(!data)throw new Error('Parent profile not found.');if(data.status!=='active')throw new Error('Parent account is disabled.');window.v2Actor={...data,role:'parent'};saveSession({role:'parent',actor:window.v2Actor});return window.v2Actor};
  window.doParentLogin=async function(){const email=$('parentEmail')?.value.trim().toLowerCase(),pass=$('parentPass')?.value||'',msg=$('loginMsg');if(!email||!pass)return msg.innerHTML='<div class="banner error">Enter parent email and password.</div>';msg.innerHTML='<div class="banner info">Signing in…</div>';const {error}=await sb.auth.signInWithPassword({email,password:pass});if(error)return msg.innerHTML='<div class="banner error">'+errText(error)+'</div>';try{await loadParentActor();parentHome()}catch(e){await sb.auth.signOut();clearSession();msg.innerHTML='<div class="banner error">'+errText(e)+'</div>'}};

  /* ---------- BACKUPS ---------- */
  window.v2Backups=async function(){if(!privileged())return v2Shell('<div class="card"><div class="banner error">Only Admin/Principal can manage backups.</div></div>','backups');v2Shell(`<div class="card"><div class="sectionKicker">Data Protection</div><h2>Backup Centre</h2><p class="v2-muted">Download a complete JSON safety copy or create a server-side snapshot.</p><div class="v2-toolbar"><button class="btn" onclick="v2DownloadBackup()">⬇️ Download Backup</button><button class="btn outline" onclick="v2ServerBackup()">☁️ Server Snapshot</button></div><div id="v2BackupMsg"></div></div>`,'backups')};
  window.v2DownloadBackup=async function(){const tables=['rs_sessions','rs_terms','rs_classes','rs_subjects','rs_components','rs_students','rs_scores','rs_remarks','rs_mocks','rs_mock_attempts','rs_publish','rs_settings','rs_grading_scale','rs_staff_profiles','rs_staff_assignments','rs_attendance','rs_fees','rs_approvals','rs_parent_profiles','rs_parent_students'];const out={version:2,created_at:new Date().toISOString(),tables:{}};for(const t of tables){const {data}=await sb.from(t).select('*');out.tables[t]=data||[]}const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(out,null,2)],{type:'application/json'}));a.download='de-trinity-backup-'+today()+'.json';a.click();toast('Backup downloaded','success')};
  window.v2ServerBackup=async function(){const {error}=await sb.rpc('rs_create_backup');if(error)return toast(error.message,'error');toast('Server snapshot created','success');if($('v2BackupMsg'))$('v2BackupMsg').innerHTML='<div class="banner success">Server snapshot created successfully.</div>'};

  /* ---------- LOGIN / LOGOUT / BOOT ---------- */
  const oldLogout=window.logout;
  window.logout=async function(){try{await sb.auth.signOut()}catch(e){}window.v2Actor=null;window.v2ClassIds=new Set();window.v2SubjectIds=new Set();clearSession();loginScreen()};
  window.switchLoginTab=function(tab){$('tabAdmin')?.classList.toggle('active',tab==='admin');$('tabStaff')?.classList.toggle('active',tab==='staff');$('tabParent')?.classList.toggle('active',tab==='parent');$('tabStudent')?.classList.toggle('active',tab==='student');const area=$('loginFormArea');if(!area)return;if(tab==='admin')area.innerHTML='<div class="field"><label>Admin email</label><input type="email" id="adminEmail"></div><div class="field"><label>Password</label><input type="password" id="adminPass"></div><button class="btn" style="width:100%" onclick="doAdminLogin()">Login as Admin</button><div id="loginMsg"></div>';else if(tab==='staff')area.innerHTML='<div class="field"><label>Staff email</label><input type="email" id="staffEmail"></div><div class="field"><label>Password</label><input type="password" id="staffPass"></div><button class="btn" style="width:100%" onclick="doStaffLogin()">Login as Staff</button><div id="loginMsg"></div><p class="v2-muted">Staff must have an active, approved account.</p>';else if(tab==='parent')area.innerHTML='<div class="field"><label>Parent email</label><input type="email" id="parentEmail"></div><div class="field"><label>Password</label><input type="password" id="parentPass"></div><button class="btn" style="width:100%" onclick="doParentLogin()">Login as Parent</button><div id="loginMsg"></div>';else{area.innerHTML='<div class="navrow" style="position:static;padding:0;border:none;margin-bottom:12px;justify-content:center"><button id="stuMethodPass" class="active" onclick="switchStudentMethod(\'pass\')">Name & Password</button><button id="stuMethodCode" onclick="switchStudentMethod(\'code\')">Profile Code</button></div><div id="stuLoginFields"></div><button class="btn" style="width:100%;margin-top:10px" onclick="doStudentLogin()">Login as Student</button><div id="loginMsg"></div>';switchStudentMethod('pass')}};
  window.doStudentLogin=async function(){const msg=$('loginMsg');msg.innerHTML='<div class="banner info">Checking…</div>';if(window._stuLoginMethod==='code'){const code=$('stuCode')?.value.trim();if(!code)return msg.innerHTML='<div class="banner error">Enter your profile code.</div>';const {data,error}=await sb.from('rs_students').select('id,name,class_id,profile_code,photo_url,sex,age,house,parent_name,rs_classes(name)').eq('profile_code',code).maybeSingle();if(error)return msg.innerHTML='<div class="banner error">'+errText(error)+'</div>';if(!data)return msg.innerHTML='<div class="banner error">Invalid profile code.</div>';saveSession({role:'student',id:data.id,name:data.name,classId:data.class_id,className:data.rs_classes?.name});return studentHome()}const name=$('stuName')?.value.trim(),pass=$('stuPass')?.value||'';if(!name||!pass)return msg.innerHTML='<div class="banner error">Enter your name and password.</div>';try{const {data,error}=await sb.rpc('rs_verify_student_login',{p_name:name,p_password:pass});if(error)throw error;if(!data)return msg.innerHTML='<div class="banner error">Invalid student name or password.</div>';saveSession({role:'student',id:data.id,name:data.name,classId:data.class_id,className:data.class_name});studentHome()}catch(e){msg.innerHTML='<div class="banner error">'+errText(e)+'</div>'}};
  window.doAdminLogin=async function(){const email=$('adminEmail')?.value.trim(),pass=$('adminPass')?.value,msg=$('loginMsg');if(!email||!pass)return msg.innerHTML='<div class="banner error">Enter email and password.</div>';msg.innerHTML='<div class="banner info">Signing in…</div>';const {data,error}=await sb.auth.signInWithPassword({email,password:pass});if(error)return msg.innerHTML='<div class="banner error">'+errText(error)+'</div>';const u=data.user;let prof=(await sb.from('rs_staff_profiles').select('*').eq('id',u.id).maybeSingle()).data;if(prof){if(prof.status!=='active'||prof.approved!==true)return msg.innerHTML='<div class="banner error">Admin account is not active/approved.</div>';window.v2Actor={...prof,role:prof.role};saveSession({role:'staff',actor:window.v2Actor})}else{window.v2Actor={id:u.id,email:u.email,full_name:u.email,role:'admin',approved:true,status:'active',permissions:{}};saveSession({role:'admin',actor:window.v2Actor})}adminHome()};
  window.loginScreen=function(){app.innerHTML=`<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px"><div class="card" style="width:100%;max-width:460px"><div class="sectionKicker">Professional School Management</div><h1 style="text-align:center;font-size:22px">🏫 De-Trinity Result Portal</h1><p class="v2-muted" style="text-align:center;margin-bottom:16px">Results • Attendance • Fees • Staff • Parents</p><div class="navrow" style="position:static;padding:0;border:none;margin-bottom:14px;justify-content:center;flex-wrap:wrap"><button id="tabAdmin" class="active" onclick="switchLoginTab('admin')">Admin</button><button id="tabStaff" onclick="switchLoginTab('staff')">Staff</button><button id="tabParent" onclick="switchLoginTab('parent')">Parent</button><button id="tabStudent" onclick="switchLoginTab('student')">Student</button></div><div id="loginFormArea"></div></div></div>`;switchLoginTab('admin')};

  /* Restore the secure student profile-code route if the old renderer expects it. */
  window.parentHome=window.parentHome||function(){return loginScreen()};

  /* Boot after the original page has defined all base functions. */
  setTimeout(async()=>{try{const {data:{session}}=await sb.auth.getSession();const s=loadSession();if(session){const p=(await sb.from('rs_staff_profiles').select('*').eq('id',session.user.id).maybeSingle()).data;if(p){if(p.role==='admin'||p.role==='principal'||p.role==='teacher'||p.role==='bursar'){try{await loadStaffActor();adminHome()}catch(e){if((p.role==='admin'||p.role==='principal')&&p.approved!==true){window.v2Actor={...p,role:p.role};saveSession({role:'staff',actor:window.v2Actor});adminHome()}else{clearSession();loginScreen()}}}else loginScreen()}else if(s?.actor?.role==='admin'&&s?.actor?.id===session.user.id){window.v2Actor={...s.actor,role:'admin',approved:true,status:'active'};saveSession({role:'admin',actor:window.v2Actor});adminHome()}else if(s?.role==='student'){studentHome()}else loginScreen()}else if(s?.role==='student'){studentHome()}else loginScreen()}catch(e){console.error('V2 boot',e);loginScreen()}},50);
})();
</script>
