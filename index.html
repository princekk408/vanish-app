<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>School Result & Mock Management System</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#667085;--line:#e4e7ec;--primary:#2457d6;--primary2:#183ea0;--ok:#07845b;--warn:#b54708;--danger:#c43232;--shadow:0 8px 30px rgba(16,24,40,.07);--radius:16px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer}.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:12px 18px}.brand{font-weight:800}.brand small{display:block;color:var(--muted);font-weight:500}.wrap{max-width:1400px;margin:auto;padding:18px}.layout{display:grid;grid-template-columns:240px 1fr;gap:18px}.side{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:10px;height:max-content;position:sticky;top:76px}.side button{display:block;width:100%;border:0;background:transparent;text-align:left;padding:11px 12px;border-radius:10px;margin:2px 0;color:var(--text)}.side button.active,.side button:hover{background:#edf2ff;color:var(--primary);font-weight:700}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);margin-bottom:16px}.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.stat{padding:16px;border:1px solid var(--line);border-radius:14px;background:#fff}.stat b{font-size:26px;display:block}.muted{color:var(--muted)}h1,h2,h3{margin:0 0 8px}.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:700}.primary{background:var(--primary);color:#fff}.secondary{background:#eef2f7;color:var(--text)}.danger{background:#fee4e2;color:#b42318}.ok{background:#dcfae9;color:#067647}.small{font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap}.field label{display:block;font-weight:650;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:10px 11px;border:1px solid #d0d5dd;border-radius:10px;background:#fff}.field textarea{min-height:80px;resize:vertical}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px}.table{width:100%;border-collapse:collapse;min-width:780px}.table th,.table td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}.table th{background:#f8fafc;font-size:12px;color:#475467}.pill{display:inline-flex;align-items:center;padding:4px 8px;border-radius:999px;background:#eef2ff;color:#3448a0;font-size:12px;font-weight:700}.hidden{display:none!important}.toast{position:fixed;right:18px;bottom:18px;z-index:100;background:#101828;color:#fff;padding:12px 16px;border-radius:10px;box-shadow:var(--shadow)}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.loginbox{width:min(560px,100%)}.brandmark{font-size:25px;font-weight:900;margin-bottom:4px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.tab{border:1px solid var(--line);background:#fff;padding:9px 12px;border-radius:9px}.tab.active{background:#edf2ff;color:var(--primary);border-color:#b9c7ff;font-weight:800}.notice{padding:11px 13px;border-radius:10px;background:#fff8e8;color:#7a4a00;border:1px solid #f3d58c}.result-preview{background:#fff;border:1px solid #bbb;padding:25px;color:#111}.result-head{text-align:center;border-bottom:2px solid #111;padding-bottom:10px;margin-bottom:10px}.result-meta{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;font-size:12px}.result-table{width:100%;border-collapse:collapse;font-size:11px}.result-table th,.result-table td{border:1px solid #444;padding:5px;text-align:center}.result-table th:first-child,.result-table td:first-child{text-align:left}.result-footer{display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px;margin-top:35px;font-size:11px}.sig{border-top:1px solid #222;padding-top:5px;text-align:center;min-height:35px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;padding:18px;z-index:50}.modalbox{background:#fff;border-radius:16px;width:min(850px,100%);max-height:90vh;overflow:auto;padding:18px}.close{float:right;border:0;background:#eee;border-radius:8px;padding:5px 9px}.q{border:1px solid var(--line);padding:12px;border-radius:12px;margin:10px 0}.option{display:block;padding:8px;margin-top:5px;border:1px solid var(--line);border-radius:8px}.mobile-only{display:none}
@media(max-width:900px){.layout{grid-template-columns:1fr}.side{position:static;display:flex;overflow:auto;gap:4px}.side button{white-space:nowrap}.g4,.g3{grid-template-columns:repeat(2,minmax(0,1fr))}.mobile-only{display:block}.result-meta{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.wrap{padding:10px}.g2,.g3,.g4{grid-template-columns:1fr}.top{padding:10px}.result-footer{grid-template-columns:1fr}}
@media print{body{background:#fff}.top,.side,#app>div:not(.printable),.no-print{display:none!important}.wrap{max-width:none;padding:0}.layout{display:block}.printable{display:block!important;box-shadow:none;border:0}.result-preview{border:0}.modal{position:static;background:#fff;padding:0}.modalbox{width:100%;max-height:none;box-shadow:none}.modal .no-print{display:none!important}}
</style>
</head>
<body>
<div id="root"></div>
<div id="toast" class="toast hidden"></div>
<script>
/* ===================== SUPABASE CONFIG ===================== */
const SUPABASE_URL='https://ucerqmewibwkxdgtgqvc.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_6rikKD0Zvl5xOtdVG00sWA_-Xv4H8I_';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);

/*
DATABASE EXPECTATION
Tables used by this single-page app are listed in the SETUP tab in Admin.
The anon key is safe to place in a browser only when Supabase RLS policies
are correctly configured. Never put a service_role key in this file.
*/

const A={user:null,profile:null,page:'dashboard',classId:'',termId:'',selectedStudent:null};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>Number(n||0).toLocaleString('en-NG',{minimumFractionDigits:2});
const toast=(m,good=true)=>{let x=document.getElementById('toast');x.textContent=m;x.classList.remove('hidden');x.style.background=good?'#101828':'#b42318';setTimeout(()=>x.classList.add('hidden'),3000)};
const el=id=>document.getElementById(id);
const today=()=>new Date().toISOString().slice(0,10);
// WAEC grading is calculated in JavaScript from the /100 subject total.
// No database query is required when a score is graded.
function grade(s){s=Number(s||0);if(s>=75)return'A1';if(s>=70)return'B2';if(s>=65)return'B3';if(s>=60)return'C4';if(s>=55)return'C5';if(s>=50)return'C6';if(s>=45)return'D7';if(s>=40)return'E8';return'F9'}
function avg(nums){let a=nums.filter(x=>x!==null&&x!==undefined&&!Number.isNaN(Number(x))).map(Number);return a.length?a.reduce((x,y)=>x+y,0)/a.length:0}
function fmtDate(x){return x?new Date(x).toLocaleDateString('en-GB'):''}
function uuid(){return crypto.randomUUID?crypto.randomUUID():Math.random().toString(36).slice(2)}
async function q(table,select='*',filters=[]){let z=sb.from(table).select(select);for(const f of filters)z=z[f.op](f.col,f.val);let {data,error}=await z;if(error)throw error;return data||[]}
async function one(table,select='*',filters=[]){let r=await q(table,select,filters);return r[0]||null}
async function up(table,row){let {data,error}=await sb.from(table).upsert(row).select();if(error)throw error;return data?.[0]}
async function ins(table,row){let {data,error}=await sb.from(table).insert(row).select();if(error)throw error;return data?.[0]}
async function del(table,filters){let z=sb.from(table).delete();for(const f of filters)z=z[f.op](f.col,f.val);let {error}=await z;if(error)throw error}

async function boot(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){return login()}
  A.user=session.user;
  try{A.profile=await one('school_profiles','*',[{op:'eq',col:'id',val:session.user.id}]);}
  catch(e){return fatal(e)}
  if(!A.profile){return firstProfile()}
  if(A.profile.role==='admin')return admin();
  return student();
}
sb.auth.onAuthStateChange((_e,s)=>{if(s&&!A.profile){A.user=s.user;setTimeout(boot,50)}});
function fatal(e){document.getElementById('root').innerHTML='<div class="login"><div class="loginbox card"><h2>Database setup required</h2><p>'+esc(e.message||e)+'</p><p class="muted">Open Admin → Setup after creating the Supabase tables/policies shown there.</p></div></div>'}
function login(){
document.getElementById('root').innerHTML=`<div class="login"><div class="loginbox">
<div class="card"><div class="brandmark">🏫 School Result Manager</div><p class="muted">Results • Mock Tests • Class Ranking • Printing</p>
<div class="tabs">
<button class="tab active" onclick="loginTab('admin')">Admin Login</button>
<button class="tab" onclick="loginTab('student')">Student Login</button>
</div>
<div id="authbox"></div></div></div></div>`;loginTab('signin')}
function loginTab(mode){
  document.querySelectorAll('.tabs .tab').forEach((b,i)=>{
    b.classList.toggle('active',(mode==='admin'?i===0:i===1));
  });

  if(mode==='admin'){
    el('authbox').innerHTML=`
      <div class="grid">
        <div class="field"><label>Admin email</label>
          <input id="admin_email" type="email" value="ogonorprincebright@gmail.com" autocomplete="username">
        </div>
        <div class="field"><label>Admin password</label>
          <input id="admin_pass" type="password" autocomplete="current-password">
        </div>
        <button class="btn primary" onclick="adminLogin()">Login as Admin</button>
      </div>`;
  }else{
    el('authbox').innerHTML=`
      <div class="grid">
        <div class="field"><label>Student name</label>
          <input id="student_name" type="text" placeholder="Enter your full name">
        </div>
        <div class="field"><label>Password</label>
          <input id="student_pass" type="password" autocomplete="current-password">
        </div>
        <button class="btn primary" onclick="studentLogin()">Login as Student</button>
        <div class="notice small">Your administrator will provide your password. Students only see published mocks and released results.</div>
      </div>`;
  }
}

async function adminLogin(){
  try{
    const email=el('admin_email').value.trim();
    const password=el('admin_pass').value;
    if(email!=='ogonorprincebright@gmail.com')
      throw Error('Invalid admin email.');
    const {error}=await sb.auth.signInWithPassword({email,password});
    if(error)throw error;
    location.reload();
  }catch(e){toast(e.message,false)}
}

async function studentLogin(){
  try{
    const name=el('student_name').value.trim();
    const password=el('student_pass').value;
    if(!name||!password)throw Error('Enter your name and password.');

    // Student credentials are managed in school_profiles.
    // The password is checked against the profile's stored password field.
    const profiles=await q('school_profiles','*',[{op:'ilike',col:'name',val:name}]);
    const p=profiles.find(x=>String(x.name||'').toLowerCase()===name.toLowerCase());

    if(!p)throw Error('Student not found.');
    if(p.role==='admin')throw Error('Use the Admin Login.');
    if(String(p.password||'')!==password)throw Error('Incorrect password.');

    A.user={id:p.id,email:p.email||null};
    A.profile=p;
    student();
  }catch(e){toast(e.message,false)}
}

function firstProfile(){
document.getElementById('root').innerHTML=`<div class="login"><div class="loginbox card"><h2>Student profile</h2><p class="muted">Fill this once. Admins can later complete or edit the school details.</p>
${profileForm()}
<button class="btn primary" onclick="saveFirstProfile()">Save profile</button></div></div>`}
function profileForm(p={}){
return `<div class="grid g2">
<div class="field"><label>Full name *</label><input id="f_name" value="${esc(p.name)}"></div>
<div class="field"><label>Class *</label><input id="f_class" value="${esc(p.class_name)}" placeholder="JSS 1"></div>
<div class="field"><label>Sex</label><select id="f_sex"><option value="">Select</option><option ${p.sex==='Male'?'selected':''}>Male</option><option ${p.sex==='Female'?'selected':''}>Female</option></select></div>
<div class="field"><label>Age</label><input id="f_age" type="number" value="${esc(p.age)}"></div>
<div class="field"><label>Parent/Guardian name</label><input id="f_parent" value="${esc(p.parent_name)}"></div>
<div class="field"><label>House</label><input id="f_house" value="${esc(p.house)}"></div>
<div class="field"><label>Class teacher</label><input id="f_teacher" value="${esc(p.class_teacher)}"></div>
<div class="field"><label>Headmistress</label><input id="f_headmistress" value="${esc(p.headmistress)}"></div>
<div class="field"><label>Headmaster/Principal</label><input id="f_headmaster" value="${esc(p.headmaster)}"></div>
<div class="field"><label>Fees payable</label><input id="f_fees" type="number" value="${esc(p.fees_payable)}"></div>
<div class="field"><label>Student ID / admission no.</label><input id="f_adm" value="${esc(p.admission_no)}"></div>
</div>`}
async function saveFirstProfile(){
try{let p={id:A.user.id,email:A.user.email,name:el('f_name').value,class_name:el('f_class').value,sex:el('f_sex').value,age:el('f_age').value,parent_name:el('f_parent').value,house:el('f_house').value,class_teacher:el('f_teacher').value,headmistress:el('f_headmistress').value,headmaster:el('f_headmaster').value,fees_payable:Number(el('f_fees').value||0),admission_no:el('f_adm').value,role:'student'};if(!p.name||!p.class_name)throw Error('Name and class are required');await up('school_profiles',p);A.profile=p;student()}catch(e){toast(e.message,false)}}

function shell(title,subtitle,nav){
document.getElementById('root').innerHTML=`<div class="top"><div><div class="brand">🏫 School Result Manager</div><small class="muted">${esc(A.profile?.name||'')}</small></div><div class="actions"><span class="pill">${A.profile?.role==='admin'?'ADMIN':'STUDENT'}</span><button class="btn secondary" onclick="signout()">Sign out</button></div></div><div class="wrap"><div class="layout"><aside class="side">${nav}</aside><main><div class="card"><h1>${esc(title)}</h1><p class="muted">${esc(subtitle||'')}</p></div><div id="content"></div></main></div></div>`}
async function signout(){await sb.auth.signOut();location.reload()}

async function admin(){
shell('Admin Panel','Manage students, classes, subjects, terms, scores, mocks and published results.',`
<button class="active" onclick="adminPage('dashboard',this)">📊 Dashboard</button>
<button onclick="adminPage('students',this)">👨‍🎓 Students</button>
<button onclick="adminPage('classes',this)">🏷️ Classes & Terms</button>
<button onclick="adminPage('subjects',this)">📚 Subjects</button>
<button onclick="adminPage('scores',this)">🧮 Result Spreadsheet</button>
<button onclick="adminPage('mocks',this)">📝 Mock Tests</button>
<button onclick="adminPage('results',this)">📄 Life Results</button>
<button onclick="adminPage('publish',this)">🔓 Publish Results</button>
<button onclick="adminPage('users',this)">👤 Users</button>
<button onclick="adminPage('setup',this)">⚙️ Setup / Database</button>`);
adminPage('dashboard',document.querySelector('.side button'))}
async function adminPage(p,b){
document.querySelectorAll('.side button').forEach(x=>x.classList.remove('active'));b?.classList.add('active');A.page=p;
try{
if(p==='dashboard')await adminDashboard();
if(p==='students')await studentsPage();
if(p==='classes')await classesPage();
if(p==='subjects')await subjectsPage();
if(p==='scores')await scoresPage();
if(p==='mocks')await mocksPage();
if(p==='results')await resultsPage();
if(p==='publish')await publishPage();
if(p==='users')await usersPage();
if(p==='setup')setupPage();
}catch(e){el('content').innerHTML='<div class="card"><b>Could not load this section.</b><p>'+esc(e.message)+'</p></div>'}}
async function adminDashboard(){
let [students,classes,mocks]=await Promise.all([q('school_profiles','*',[{op:'eq',col:'role',val:'student'}]),q('school_classes'),q('school_mocks')]);
el('content').innerHTML=`<div class="grid g4"><div class="stat"><span class="muted">Students</span><b>${students.length}</b></div><div class="stat"><span class="muted">Classes</span><b>${classes.length}</b></div><div class="stat"><span class="muted">Mocks</span><b>${mocks.length}</b></div><div class="stat"><span class="muted">Published mocks</span><b>${mocks.filter(x=>x.published).length}</b></div></div>
<div class="card"><h3>Workflow</h3><ol><li>Create classes and terms.</li><li>Add subjects.</li><li>Create student accounts/profiles and assign subjects.</li><li>Create mocks and set the destination test slot (Test 1–4).</li><li>Mocks automatically save the student's mark into the selected test slot after submission.</li><li>Enter or import exam marks out of 60.</li><li>Result Spreadsheet computes each subject total/grade, subject positions, average and class rank.</li><li>Publish the term result. Students see it only after publication.</li><li>Print an individual result: stamps and signatures are generated in the print layout.</li></ol></div>`}
async function studentsPage(){
let students=await q('school_profiles','*',[{op:'eq',col:'role',val:'student'}]);
el('content').innerHTML=`<div class="card"><div class="actions"><button class="btn primary" onclick="newStudent()">+ Add student</button><button class="btn secondary" onclick="adminPage('scores')">Open result spreadsheet</button></div></div><div class="table-wrap"><table class="table"><tr><th>Name</th><th>Class</th><th>Sex</th><th>Age</th><th>Parent</th><th>House</th><th>Admission No.</th><th></th></tr>${students.map(s=>`<tr><td>${esc(s.name)}</td><td>${esc(s.class_name)}</td><td>${esc(s.sex)}</td><td>${esc(s.age)}</td><td>${esc(s.parent_name)}</td><td>${esc(s.house)}</td><td>${esc(s.admission_no)}</td><td><button class="btn secondary small" onclick="editStudent('${s.id}')">Edit</button></td></tr>`).join('')}</table></div>`}
function newStudent(){openModal('Add student',profileForm()+`<div class="actions" style="margin-top:12px"><button class="btn primary" onclick="saveStudent(null)">Save</button></div>`)}
async function editStudent(id){let s=await one('school_profiles','*',[{op:'eq',col:'id',val:id}]);openModal('Edit student',profileForm(s)+`<div class="actions" style="margin-top:12px"><button class="btn primary" onclick="saveStudent('${id}')">Save changes</button></div>`)}
async function saveStudent(id){try{let row={id:id||uuid(),name:el('f_name').value,class_name:el('f_class').value,sex:el('f_sex').value,age:el('f_age').value,parent_name:el('f_parent').value,house:el('f_house').value,class_teacher:el('f_teacher').value,headmistress:el('f_headmistress').value,headmaster:el('f_headmaster').value,fees_payable:Number(el('f_fees').value||0),admission_no:el('f_adm').value,role:'student'};await up('school_profiles',row);closeModal();toast('Student saved');studentsPage()}catch(e){toast(e.message,false)}}

async function classesPage(){
let cs=await q('school_classes');let ts=await q('school_terms');
el('content').innerHTML=`<div class="grid g2"><div class="card"><h3>Add class</h3><div class="grid"><div class="field"><label>Class name</label><input id="cname" placeholder="JSS 1"></div><button class="btn primary" onclick="addClass()">Add class</button></div><hr><h3>Classes</h3>${cs.map(c=>`<div class="actions" style="justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line)"><span>${esc(c.name)}</span><span class="pill">${c.id.slice(0,6)}</span></div>`).join('')}</div>
<div class="card"><h3>Add term/session</h3><div class="grid"><div class="field"><label>Term name</label><input id="tname" placeholder="First Term"></div><div class="field"><label>Session</label><input id="tsession" placeholder="2026/2027"></div><div class="field"><label>Class</label><select id="tclass">${cs.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div><button class="btn primary" onclick="addTerm()">Add term</button></div><hr><h3>Terms</h3>${ts.map(t=>`<div style="padding:7px 0;border-bottom:1px solid var(--line)">${esc(t.name)} — ${esc(t.session)}</div>`).join('')}</div></div>`}
async function addClass(){try{await ins('school_classes',{name:el('cname').value});toast('Class added');classesPage()}catch(e){toast(e.message,false)}}
async function addTerm(){try{await ins('school_terms',{name:el('tname').value,session:el('tsession').value,class_id:el('tclass').value});toast('Term added');classesPage()}catch(e){toast(e.message,false)}}

async function subjectsPage(){
let ss=await q('school_subjects');
el('content').innerHTML=`<div class="card"><h3>Add subject</h3><div class="actions"><input id="sname" placeholder="Mathematics" style="flex:1;padding:10px;border:1px solid #d0d5dd;border-radius:10px"><button class="btn primary" onclick="addSubject()">Add</button></div></div><div class="table-wrap"><table class="table"><tr><th>Subject</th><th>ID</th></tr>${ss.map(s=>`<tr><td>${esc(s.name)}</td><td>${s.id}</td></tr>`).join('')}</table></div>`}
async function addSubject(){try{await ins('school_subjects',{name:el('sname').value});toast('Subject added');subjectsPage()}catch(e){toast(e.message,false)}}

async function selectors(){
let [classes,terms,subjects,students]=await Promise.all([q('school_classes'),q('school_terms'),q('school_subjects'),q('school_profiles','*',[{op:'eq',col:'role',val:'student'}])]);
return {classes,terms,subjects,students}}
async function scoresPage(){
let {classes,terms,subjects,students}=await selectors();
el('content').innerHTML=`<div class="card"><div class="grid g4"><div class="field"><label>Class</label><select id="rs_class" onchange="loadScoreGrid()"><option value="">Select</option>${classes.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div><div class="field"><label>Term</label><select id="rs_term" onchange="loadScoreGrid()"><option value="">Select</option>${terms.map(t=>`<option value="${t.id}">${esc(t.name)} — ${esc(t.session)}</option>`).join('')}</select></div><div class="field"><label>Subject</label><select id="rs_subject" onchange="loadScoreGrid()"><option value="">All subjects</option>${subjects.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select></div><div><label>&nbsp;</label><button class="btn secondary" onclick="importScores()">Import CSV-style marks</button></div></div><p class="muted small">Each Test slot is /10. Exam is /60. Total is /100. Enter marks manually here, or let published/scheduled mocks populate Test 1–4 automatically.</p></div><div id="scoreGrid"></div>`}
async function loadScoreGrid(){
let cid=el('rs_class').value,tid=el('rs_term').value,sid=el('rs_subject').value;if(!cid||!tid)return;
let students=await q('school_profiles','*',[{op:'eq',col:'role',val:'student'},{op:'eq',col:'class_name',val:(await one('school_classes','name',[{op:'eq',col:'id',val:cid}]))?.name}]);
let subs=await q('school_subjects');if(sid)subs=subs.filter(x=>x.id===sid);
let scores=await q('school_scores','*',[{op:'eq',col:'class_id',val:cid},{op:'eq',col:'term_id',val:tid}]);

let rows=[];
for(const st of students){for(const su of subs){let x=by[st.id+'_'+su.id]||{student_id:st.id,subject_id:su.id,test1:null,test2:null,test3:null,test4:null,exam:null};rows.push(`<tr><td>${esc(st.name)}</td><td>${esc(su.name)}</td>${['test1','test2','test3','test4','exam'].map(k=>`<td><input type="number" min="0" max="${k==='exam'?60:10}" value="${x[k]??''}" data-score="${st.id}|${su.id}|${k}" style="width:72px"></td>`).join('')}<td>${Number(x.total||0)}</td><td>${x.grade||''}</td></tr>`)}} 
el('scoreGrid').innerHTML=`<div class="card"><div class="actions"><button class="btn primary" onclick="saveGrid()">Save marks & compute</button><button class="btn secondary" onclick="computeAll()">Recompute positions & averages</button></div></div><div class="table-wrap"><table class="table"><tr><th>Student</th><th>Subject</th><th>Test 1 /10</th><th>Test 2 /10</th><th>Test 3 /10</th><th>Test 4 /10</th><th>Exam /60</th><th>Total /100</th><th>Grade</th></tr>${rows.join('')}</table></div>`}
async function saveGrid(){
let cid=el('rs_class').value,tid=el('rs_term').value;let inputs=[...document.querySelectorAll('[data-score]')];let groups={};
inputs.forEach(i=>{let [student_id,subject_id,k]=i.dataset.score;groups[student_id+'_'+subject_id]??={student_id,subject_id,class_id:cid,term_id:tid};groups[student_id+'_'+subject_id][k]=i.value===''?null:Number(i.value)});
try{for(let x of Object.values(groups)){x.total=['test1','test2','test3','test4','exam'].reduce((a,k)=>a+(Number(x[k])||0),0);x.grade=grade(x.total);await up('school_scores',x)}await computeAll();toast('Marks saved and result computed')}catch(e){toast(e.message,false)}}
async function computeAll(){
let cid=el('rs_class').value,tid=el('rs_term').value;if(!cid||!tid)return;
let scores=await q('school_scores','*',[{op:'eq',col:'class_id',val:cid},{op:'eq',col:'term_id',val:tid}]);
let students=[...new Set(scores.map(x=>x.student_id))];
let subjectGroups={};scores.forEach(s=>(subjectGroups[s.subject_id]??=[]).push(s));
for(const sid in subjectGroups){let arr=subjectGroups[sid].sort((a,b)=>(b.total||0)-(a.total||0));for(let i=0;i<arr.length;i++){let pos=i+1;await up('school_scores',{id:arr[i].id,position:pos,grade:grade(arr[i].total),total:Number(arr[i].total||0)})}}
let totals={};scores.forEach(s=>totals[s.student_id]=(totals[s.student_id]||0)+Number(s.total||0));
let rank=Object.entries(totals).sort((a,b)=>b[1]-a[1]);for(let i=0;i<rank.length;i++){await up('school_term_ranks',{student_id:rank[i][0],class_id:cid,term_id:tid,total_score:rank[i][1],average:rank[i][1]/Math.max(1,scores.filter(x=>x.student_id===rank[i][0]).length),position:i+1})}
if(el('scoreGrid'))loadScoreGrid()}

function setupPage(){
el('content').innerHTML=`<div class="card"><h3>Supabase SQL schema</h3><p class="muted">Run this once in Supabase SQL Editor. It creates the tables used by this index.html. After running it, create the first account, then change that user's role to <code>admin</code> directly in the database.</p><textarea readonly style="width:100%;min-height:520px;font-family:ui-monospace">${esc(SQL)}</textarea><div class="notice small" style="margin-top:10px">Important: RLS policies must be tightened before production. The simple policies below are suitable for getting the prototype running, not for a high-security school deployment.</div></div>`}
const SQL=`
create extension if not exists pgcrypto;

create table if not exists public.school_profiles(
 id uuid primary key references auth.users(id) on delete cascade,
 email text, name text not null, class_name text, sex text, age int,
 parent_name text, house text, class_teacher text, headmistress text,
 headmaster text, fees_payable numeric default 0, admission_no text,
 role text default 'student' check(role in ('student','admin')),
 created_at timestamptz default now()
);

create table if not exists public.school_classes(
 id uuid primary key default gen_random_uuid(), name text unique not null,
 created_at timestamptz default now()
);

create table if not exists public.school_terms(
 id uuid primary key default gen_random_uuid(), class_id uuid references public.school_classes(id) on delete cascade,
 name text not null, session text not null, created_at timestamptz default now()
);

create table if not exists public.school_subjects(
 id uuid primary key default gen_random_uuid(), name text unique not null
);

create table if not exists public.school_scores(
 id uuid primary key default gen_random_uuid(),
 student_id uuid references public.school_profiles(id) on delete cascade,
 class_id uuid references public.school_classes(id) on delete cascade,
 term_id uuid references public.school_terms(id) on delete cascade,
 subject_id uuid references public.school_subjects(id) on delete cascade,
 test1 numeric default 0, test2 numeric default 0, test3 numeric default 0, test4 numeric default 0,
 exam numeric default 0, total numeric default 0, grade text, position int,
 unique(student_id,term_id,subject_id)
);

create table if not exists public.school_term_ranks(
 id uuid primary key default gen_random_uuid(), student_id uuid references public.school_profiles(id) on delete cascade,
 class_id uuid references public.school_classes(id) on delete cascade,
 term_id uuid references public.school_terms(id) on delete cascade,
 total_score numeric default 0, average numeric default 0, position int,
 unique(student_id,term_id)
);

create table if not exists public.school_mocks(
 id uuid primary key default gen_random_uuid(), title text not null,
 class_id uuid references public.school_classes(id) on delete cascade,
 term_id uuid references public.school_terms(id) on delete cascade,
 subject_id uuid references public.school_subjects(id) on delete cascade,
 target_test int check(target_test between 1 and 4),
 total_marks numeric default 10, duration_minutes int default 30,
 start_at timestamptz, end_at timestamptz, published boolean default false,
 questions jsonb default '[]'::jsonb, created_by uuid references public.school_profiles(id),
 created_at timestamptz default now()
);

create table if not exists public.school_mock_attempts(
 id uuid primary key default gen_random_uuid(),
 mock_id uuid references public.school_mocks(id) on delete cascade,
 student_id uuid references public.school_profiles(id) on delete cascade,
 score numeric default 0, answers jsonb default '{}'::jsonb,
 submitted_at timestamptz default now(),
 unique(mock_id,student_id)
);

create table if not exists public.school_releases(
 id uuid primary key default gen_random_uuid(),
 class_id uuid references public.school_classes(id) on delete cascade,
 term_id uuid references public.school_terms(id) on delete cascade,
 published boolean default false, published_at timestamptz, published_by uuid references public.school_profiles(id),
 unique(class_id,term_id)
);

alter table public.school_profiles enable row level security;
alter table public.school_classes enable row level security;
alter table public.school_terms enable row level security;
alter table public.school_subjects enable row level security;
alter table public.school_scores enable row level security;
alter table public.school_term_ranks enable row level security;
alter table public.school_mocks enable row level security;
alter table public.school_mock_attempts enable row level security;
alter table public.school_releases enable row level security;

create or replace function public.is_admin() returns boolean language sql stable security definer set search_path=public as $$
 select exists(select 1 from public.school_profiles where id=auth.uid() and role='admin');
$$;

create policy "profiles own or admin" on public.school_profiles for all using(auth.uid()=id or public.is_admin()) with check(auth.uid()=id or public.is_admin());
create policy "classes authenticated" on public.school_classes for select using(auth.role()='authenticated');
create policy "classes admin write" on public.school_classes for all using(public.is_admin()) with check(public.is_admin());
create policy "terms authenticated" on public.school_terms for select using(auth.role()='authenticated');
create policy "terms admin write" on public.school_terms for all using(public.is_admin()) with check(public.is_admin());
create policy "subjects authenticated" on public.school_subjects for select using(auth.role()='authenticated');
create policy "subjects admin write" on public.school_subjects for all using(public.is_admin()) with check(public.is_admin());

create policy "scores own or admin" on public.school_scores for select using(student_id=auth.uid() or public.is_admin());
create policy "scores admin write" on public.school_scores for all using(public.is_admin()) with check(public.is_admin());

create policy "ranks own or admin" on public.school_term_ranks for select using(student_id=auth.uid() or public.is_admin());
create policy "ranks admin write" on public.school_term_ranks for all using(public.is_admin()) with check(public.is_admin());

create policy "published mocks visible" on public.school_mocks for select using(published=true or public.is_admin());
create policy "mocks admin write" on public.school_mocks for all using(public.is_admin()) with check(public.is_admin());

create policy "attempt own or admin" on public.school_mock_attempts for select using(student_id=auth.uid() or public.is_admin());
create policy "attempt own insert" on public.school_mock_attempts for insert with check(student_id=auth.uid());
create policy "attempt admin" on public.school_mock_attempts for all using(public.is_admin()) with check(public.is_admin());

create policy "release visible" on public.school_releases for select using(public.is_admin() or published=true);
create policy "release admin write" on public.school_releases for all using(public.is_admin()) with check(public.is_admin());
`;

function resultHTML(s,t,ss,subs,rank){

function closeModal(){el('modal')?.remove()}
