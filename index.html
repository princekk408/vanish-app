<script>
'use strict';
window.__bootSlowTimer = setTimeout(() => {

}, 8000);

/* ============================================================

/* ============================================================

   ============================================================ */
const $ = id => document.getElementById(id);
const app = $('app');
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function uid(){ return (crypto.randomUUID ? crypto.randomUUID() : 'id-' + Date.now() + '-' + Math.random().toString(16).slice(2)); }
function fmtDate(d){ if(!d) return '—'; return new Date(d).toLocaleDateString('en-GB', {day:'2-digit',month:'short',year:'numeric'}); }
function fmtDateTime(d){ if(!d) return '—'; return new Date(d).toLocaleString('en-GB', {day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}); }
function toast(msg, type){
  const el = document.createElement('div');
  el.className = 'banner ' + (type||'info');
  el.style.cssText = 'position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:2000;max-width:90%;box-shadow:var(--shadow-md)';
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 3200);
}
function ordinal(n){
  if (n == null) return '—';
  const s = ['th','st','nd','rd'], v = n % 100;
  return n + (s[(v-20)%10] || s[v] || s[0]);
}
function competitionRank(arr, key){
  // arr: array of objects with a numeric|null [key]. Ranks descending, ties share rank, next rank skips. Nulls get null rank.
  const sorted = [...arr].filter(x => x[key] != null).sort((a,b) => b[key]-a[key]);
  let rank = 0, lastVal = null, seen = 0;
  const rankMap = new Map();
  sorted.forEach(item => {
    seen++;
    if (item[key] !== lastVal) { rank = seen; lastVal = item[key]; }
    rankMap.set(item, rank);
  });
  return arr.map(x => x[key] == null ? null : (rankMap.get(x) ?? null));
}
/* ============================================================
   SESSION (local)
   ============================================================ */
function saveSession(obj){ localStorage.setItem('rs_session', JSON.stringify(obj)); }
function loadSession(){ try { return JSON.parse(localStorage.getItem('rs_session')); } catch(e){ return null; } }
function clearSession(){ localStorage.removeItem('rs_session'); }

/* ============================================================
   LOGIN
   ============================================================ */
function loginScreen(){
  app.innerHTML = `
    <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;">
      <div class="card" style="width:100%;max-width:400px;">
        <h1 style="text-align:center;font-size:20px;">🏫 De-Trinity Result Portal</h1>
        <p class="muted" style="text-align:center;margin:6px 0 18px;">Termly academic reports & mock system</p>
        <div class="navrow" style="position:static;padding:0;border:none;margin-bottom:14px;justify-content:center;">
          <button id="tabAdmin" class="active" onclick="switchLoginTab('admin')">Admin</button>
          <button id="tabStudent" onclick="switchLoginTab('student')">Student</button>
        </div>
        <div id="loginFormArea"></div>
      </div>
    </div>`;
  switchLoginTab('admin');
}
function switchLoginTab(tab){
  $('tabAdmin')?.classList.toggle('active', tab==='admin');
  $('tabStudent')?.classList.toggle('active', tab==='student');
  const area = $('loginFormArea');
  if (tab === 'admin') {
    area.innerHTML = `
      <div class="field"><label>Admin email</label><input type="email" id="adminEmail" placeholder="Admin email"></div>
      <div class="field"><label>Password</label><input type="password" id="adminPass" placeholder="Enter admin password"></div>
      <button class="btn" style="width:100%" onclick="doAdminLogin()">Login as Admin</button>
      <div id="loginMsg"></div>`;
  } else {
    area.innerHTML = `
      <div class="navrow" style="position:static;padding:0;border:none;margin-bottom:12px;justify-content:center;">
        <button id="stuMethodPass" class="active" onclick="switchStudentMethod('pass')">Name & Password</button>
        <button id="stuMethodCode" onclick="switchStudentMethod('code')">Profile Code</button>
      </div>
      <div id="stuLoginFields"></div>
      <button class="btn" style="width:100%;margin-top:10px;" onclick="doStudentLogin()">Login as Student</button>
      <div id="loginMsg"></div>`;
    switchStudentMethod('pass');
  }
}
function switchStudentMethod(m){
  $('stuMethodPass')?.classList.toggle('active', m==='pass');
  $('stuMethodCode')?.classList.toggle('active', m==='code');
  window._stuLoginMethod = m;
  const f = $('stuLoginFields');
  if (m === 'pass') {
    f.innerHTML = `
      <div class="field"><label>Full name</label><input id="stuName" placeholder="Your full name as registered"></div>
      <div class="field"><label>Password</label><input type="password" id="stuPass" placeholder="Password given by your school"></div>`;
  } else {
    f.innerHTML = `<div class="field"><label>Profile code</label><input id="stuCode" placeholder="10-digit profile code" maxlength="10"></div>`;
  }
}
async function doAdminLogin(){
  const email = $('adminEmail').value.trim(), pass = $('adminPass').value;
  const msg = $('loginMsg');
  if (!email || !pass) { msg.innerHTML = `<div class="banner error">Enter email and password.</div>`; return; }
  msg.innerHTML = `<div class="banner info">Checking…</div>`;
  const { data, error } = await sb.auth.signInWithPassword({ email, password: pass });
  if (error) { msg.innerHTML = `<div class="banner error">${esc(error.message)}</div>`; return; }
  saveSession({ role: 'admin' });
  adminHome();
}
async function doStudentLogin(){
  const msg = $('loginMsg');
  msg.innerHTML = `<div class="banner info">Checking…</div>`;
  let query = sb.from('rs_students').select('*, rs_classes(*)');
  if (window._stuLoginMethod === 'code') {
    const code = $('stuCode').value.trim();
    if (!code) { msg.innerHTML = `<div class="banner error">Enter your profile code.</div>`; return; }
    query = query.eq('profile_code', code);
  } else {
    const name = $('stuName').value.trim(), pass = $('stuPass').value;
    if (!name || !pass) { msg.innerHTML = `<div class="banner error">Enter your name and password.</div>`; return; }
    query = query.ilike('name', name).eq('password', pass);
  }
  const { data, error } = await query.maybeSingle();
  if (error) { msg.innerHTML = `<div class="banner error">${esc(error.message)}</div>`; return; }
  if (!data) { msg.innerHTML = `<div class="banner error">Invalid login details.</div>`; return; }
  saveSession({ role: 'student', id: data.id, name: data.name, classId: data.class_id, className: data.rs_classes?.name });
  studentHome();
}
async function logout(){
  const s = loadSession();
  if (s?.role === 'admin') { try { await sb.auth.signOut(); } catch(e){} }
  clearSession(); loginScreen();
}

async function saveAllScores(subjectId){
  const inputs = document.querySelectorAll('.scoreInput[data-student]');
  const msg = $('scoreSaveMsg');
  msg.innerHTML = `<div class="banner info">Saving…</div>`;
  const rows = [];
  for (const inp of inputs) {
    const raw = inp.value.trim();
    if (raw === '') continue;
    const max = parseFloat(inp.dataset.max);
    const val = parseFloat(raw);
    if (isNaN(val) || val < 0 || val > max) { msg.innerHTML = `<div class="banner error">Invalid score ${esc(raw)} (max ${max}). Fix and retry.</div>`; return; }
    rows.push({ student_id: inp.dataset.student, subject_id: subjectId, component_id: inp.dataset.comp, score: val, source: 'manual' });
  }
  if (rows.length === 0) { msg.innerHTML = `<div class="banner info">Nothing to save.</div>`; return; }
  const { error } = await sb.from('rs_scores').upsert(rows, { onConflict: 'student_id,subject_id,component_id' });
  if (error) { msg.innerHTML = `<div class="banner error">${esc(error.message)}</div>`; return; }
  toast(`Saved ${rows.length} score entries`,'success');
  adminScores(subjectId);
}
async function parseBulkScores(subjectId){
  const msg = $('bulkScoreMsg');
  const text = $('bulkScoreText').value.trim();
  if (!text) { msg.innerHTML = `<div class="banner error">Paste some data first.</div>`; return; }
  msg.innerHTML = `<div class="banner info">Parsing…</div>`;
  const [students, comps] = await Promise.all([fetchStudents(AState.classId), fetchComponents(AState.termId)]);
  const lines = text.split('\n').map(l=>l.trim()).filter(Boolean);
  const rows = []; const errors = [];
  for (const line of lines) {
    const parts = line.split(/[,\t]+/).map(p=>p.trim()).filter(Boolean);
    if (parts.length < 2) { errors.push(`"${line}" — couldn't split into name + scores`); continue; }
    const namePart = parts[0];
    const scoreParts = parts.slice(1);
    const student = students.find(s => s.name.toLowerCase() === namePart.toLowerCase());
    if (!student) { errors.push(`"${namePart}" — no matching student in this class`); continue; }
    if (scoreParts.length !== comps.length) { errors.push(`"${namePart}" — expected ${comps.length} scores, got ${scoreParts.length}`); continue; }
    let lineOk = true;
    const lineRows = comps.map((c, i) => {
      const val = parseFloat(scoreParts[i]);
      if (isNaN(val) || val < 0 || val > c.max_score) { errors.push(`"${namePart}" — invalid score "${scoreParts[i]}" for ${c.name} (max ${c.max_score})`); lineOk = false; }
      return { student_id: student.id, subject_id: subjectId, component_id: c.id, score: val, source: 'manual' };
    });
    if (lineOk) rows.push(...lineRows);
  }
  if (rows.length === 0) { msg.innerHTML = `<div class="banner error">Nothing valid to save.${errors.length?'<br>'+esc(errors.join('<br>')):''}</div>`; return; }
  const { error } = await sb.from('rs_scores').upsert(rows, { onConflict: 'student_id,subject_id,component_id' });
  if (error) { msg.innerHTML = `<div class="banner error">${esc(error.message)}</div>`; return; }
  const studentsCovered = new Set(rows.map(r=>r.student_id)).size;
  msg.innerHTML = `<div class="banner success">Saved scores for ${studentsCovered} student(s).</div>` +
    (errors.length ? `<div class="banner error" style="margin-top:6px;">${errors.length} line(s) skipped:<br>${esc(errors.join('<br>'))}</div>` : '');
  toast(`Bulk saved ${studentsCovered} student(s)`,'success');
  setTimeout(()=>adminScores(subjectId), 1200);
}

/* ---------- BROADSHEET (class + term scoped) ---------- */
// Supabase/PostgREST may cap a single SELECT response at 1,000 rows.
// A full class can easily exceed that (e.g. 24 students × 9 subjects × 5
// components = 1,080 score rows), so the broadsheet must paginate.
async function fetchAllBroadsheetScores(subjectIds, studentIds){
  const PAGE_SIZE = 1000;
  const all = [];
  for (let from = 0; ; from += PAGE_SIZE) {
    const { data, error } = await sb.from('rs_scores').select('*')
      .in('subject_id', subjectIds)
      .in('student_id', studentIds)
      .range(from, from + PAGE_SIZE - 1);
    if (error) throw error;
    const page = data || [];
    all.push(...page);
    if (page.length < PAGE_SIZE) break;
  }
  return all;
}

async function computeBroadsheet(classId, termId){
  const [subjects, students, comps] = await Promise.all([
    fetchSubjects(classId), fetchStudents(classId), fetchComponents(termId)
  ]);
  const maxPerSubject = comps.reduce((sum,c) => sum + Number(c.max_score), 0) || 100;
  let scores = [];
  if (subjects.length && students.length) {
    scores = await fetchAllBroadsheetScores(
      subjects.map(s=>s.id),
      students.map(s=>s.id)
    );
  }
  const scale = (await sb.from('rs_grading_scale').select('*').order('sort_order')).data || [];
  const gradeOf = total => scale.find(r => total >= r.min_score && total <= r.max_score) || { grade:'—', remark:'—' };

  const caComponents = comps.slice(0, -1);
  const examComponent = comps[comps.length - 1];
  const caMax = caComponents.reduce((s,c)=>s+Number(c.max_score),0);
  const examMax = examComponent ? Number(examComponent.max_score) : 0;

  // per-student per-subject totals
  const perStudent = students.map(st => {
    const subjectTotals = subjects.map(sub => {
      const relevant = scores.filter(sc => sc.student_id === st.id && sc.subject_id === sub.id);
      const filled = relevant.length === comps.length && relevant.every(r => r.score != null);
      const total = filled ? relevant.reduce((s,r) => s + Number(r.score), 0) : null;
      const compVals = comps.map(c => {
        const rec = relevant.find(r => r.component_id === c.id);
        return rec && rec.score != null ? Number(rec.score) : null;
      });
      const caTotal = filled ? compVals.slice(0,-1).reduce((s,v)=>s+v,0) : null;
      const examScore = filled ? compVals[compVals.length-1] : null;
      return { subjectId: sub.id, subjectName: sub.name, total, grade: total!=null ? gradeOf(total) : null, compVals, caTotal, examScore };
    });
    const complete = subjects.length > 0 && subjectTotals.every(s => s.total != null);
    const overallTotal = complete ? subjectTotals.reduce((s,x)=>s+x.total,0) : null;
    const average = complete ? overallTotal / subjects.length : null;
    return { student: st, subjectTotals, complete, overallTotal, average };
  });

  // subject position (rank within class, per subject)
  subjects.forEach((sub, idx) => {
    const arr = perStudent.map(p => ({ ref: p, val: p.subjectTotals[idx].total }));
    const ranks = competitionRank(arr.map(a=>({total:a.val})), 'total');
    arr.forEach((a,i) => { a.ref.subjectTotals[idx].position = ranks[i]; });
  });
  // overall position (rank within class)
  const overallRanks = competitionRank(perStudent.map(p=>({total:p.overallTotal})), 'total');
  perStudent.forEach((p,i) => { p.overallPosition = overallRanks[i]; });

  return { subjects, students, comps, maxPerSubject, caMax, examMax, perStudent };
}

function computeColumnAggregates(p, comps){
  const n = p.subjectTotals.length;
  const compSums = comps.map((c,ci) => {
    const vals = p.subjectTotals.map(s => s.compVals[ci]);
    return vals.every(v => v != null) ? vals.reduce((a,b)=>a+b,0) : null;
  });
  const caSum = p.subjectTotals.every(s=>s.caTotal!=null) ? p.subjectTotals.reduce((a,s)=>a+s.caTotal,0) : null;
  const totalSum = p.complete ? p.overallTotal : null;
  return { compSums, caSum, totalSum, n };
}

          <div class="stampBox">Official School Stamp</div>
        </div>
      </div>
    </div>`;

  const fitA4 = () => {
    const sheet = $('printArea'); if (!sheet) return;
    const targetHeightPx = 281 * 96 / 25.4;
    const targetWidthMm = 190;

    // IMPORTANT: use CSS zoom instead of transform. Chrome's print renderer
    // can recalculate/ignore transforms when the native print dialog opens,
    // which was making the printed copy fall back to the small normal layout.
    // CSS zoom is part of the layout used by the print renderer, so the same
    // enlargement is retained on paper/PDF.
    sheet.style.minHeight = '0';
    sheet.style.transform = 'none';
    sheet.style.zoom = '1';
    sheet.style.width = `${targetWidthMm}mm`;

    const naturalHeight = Math.max(sheet.scrollHeight, 1);
    let scale = targetHeightPx / naturalHeight;
    scale = Math.max(0.42, Math.min(1.55, scale));

    sheet.style.setProperty('--print-scale', scale.toFixed(4));
    sheet.style.zoom = scale;
    sheet.style.width = `calc(${targetWidthMm}mm / ${scale})`;
    sheet.style.minHeight = `calc(281mm / ${scale})`;
    sheet.style.transform = 'none';
    sheet.style.margin = '0';
    sheet.dataset.printScale = scale.toFixed(4);
  };
  requestAnimationFrame(()=>{fitA4();setTimeout(fitA4,150);setTimeout(fitA4,500);});
}
function overallRemark(avg){
  if (avg == null) return '';
  if (avg >= 75) return 'Excellent performance. Keep it up!';
  if (avg >= 60) return 'Very good result.';
  if (avg >= 50) return 'Good, but there is room for improvement.';
  if (avg >= 40) return 'Fair. More effort is needed.';
  return 'Poor performance. Needs serious improvement.';
}

function parseBulkQuestions(){
  const msg = $('bulkQMsg');
  const text = $('bulkQuestionText').value.trim();
  if (!text) { msg.innerHTML = `<div class="banner error">Paste some questions first.</div>`; return; }
  const blocks = text.split(/\n\s*\n/).map(b=>b.trim()).filter(Boolean);
  let added = 0; const errors = [];
  blocks.forEach((block, bi) => {
    const lines = block.split('\n').map(l=>l.trim()).filter(Boolean);
    const qLine = lines.find(l => /^q[:.]/i.test(l));
    if (!qLine) { errors.push(`Block ${bi+1}: no "Q:" line found`); return; }
    const qText = qLine.replace(/^q[:.]\s*/i, '');
    const options = ['','','',''];
    let correct = null, marks = 1, explanation = '';
    lines.forEach(l => {
      const optMatch = l.match(/^([A-D])[).:]\s*(.*)$/i);
      if (optMatch) { options[optMatch[1].toUpperCase().charCodeAt(0)-65] = optMatch[2].trim(); return; }
      const ansMatch = l.match(/^answer[:.]\s*([A-D])/i);
      if (ansMatch) { correct = ansMatch[1].toUpperCase().charCodeAt(0)-65; return; }
      const marksMatch = l.match(/^marks?[:.]\s*(\d+(\.\d+)?)/i);
      if (marksMatch) { marks = parseFloat(marksMatch[1]); return; }
      const expMatch = l.match(/^explanation[:.]\s*(.*)$/i);
      if (expMatch) { explanation = expMatch[1].trim(); return; }
    });
    if (!qText || options.some(o=>!o) || correct == null) {
      errors.push(`Block ${bi+1}: missing question, an option (A-D), or Answer: line`); return;
    }
    window._mockDraftQuestions.push({ id: uid(), q: qText, options, correct, marks, explanation });
    added++;
  });
  renderMockQuestionDrafts();
  msg.innerHTML = `<div class="banner ${added>0?'success':'error'}">Added ${added} question(s).${errors.length ? '<br>'+esc(errors.join('<br>')) : ''}</div>`;
  if (added>0) $('bulkQuestionText').value = '';
}

  toast('Scheduled','success'); adminMocks();

function shuffleArray(arr){
  const a = [...arr];
  for (let i = a.length-1; i>0; i--) { const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; }
  return a;
}
function shuffleQuestionSet(questions){
  const shuffledQs = shuffleArray(questions);
  return shuffledQs.map(q => {
    const order = shuffleArray([0,1,2,3]);
    const newOptions = order.map(oi => q.options[oi]);
    const newCorrect = order.indexOf(q.correct);
    return { q: q.q, options: newOptions, correct: newCorrect, marks: q.marks||1, explanation: q.explanation||'' };
  });
}
async function studentTakeMock(mockId){
  const s = loadSession();
  const { data: mock } = await sb.from('rs_mocks').select('*').eq('id', mockId).maybeSingle();

  window._mockAnswers = new Array(window._activeQuestions.length).fill(null);

function mockTimerTick(){

function toggleMockCalculator(show){

    div.innerHTML = `

        ${['7','8','9','/','4','5','6','*','1','2','3','-','0','.','C','+'].map(b=>`<button class="btn sm" style="padding:8px 0;" onclick="calcPress('${b}')">${b}</button>`).join('')}

function calcPress(b){
  const disp = $('calcDisplay');
  if (!disp) return;
  if (b === 'C') { disp.value = ''; return; }
  if (b === '=') {
    if (!/^[0-9+\-*/.\s]+$/.test(disp.value)) { disp.value = 'Error'; return; }
    try { disp.value = Function('"use strict";return ('+disp.value+')')(); } catch(e) { disp.value = 'Error'; }
    return;
  }
  disp.value += b;
}
function renderMockQuestion(idx){

  app.innerHTML = `
    <div class="topbar">

      <span id="mockTimerDisplay" style="font-family:'Space Mono',monospace;font-weight:700;font-size:16px;">${m}:${String(sec).padStart(2,'0')}</span>
    </div>
    <div class="content" style="max-width:640px;">
      <div class="flex" style="overflow-x:auto;padding:10px 0;gap:6px;">
        ${questions.map((qq,i) => `
          <button onclick="renderMockQuestion(${i})" style="min-width:34px;height:34px;border-radius:50%;border:2px solid ${i===idx?'var(--accent)':'var(--border)'};background:${window._mockAnswers[i]!=null?'var(--primary)':'#fff'};color:${window._mockAnswers[i]!=null?'#fff':'var(--ink)'};font-weight:700;font-size:12.5px;flex-shrink:0;">${i+1}</button>`).join('')}
      </div>
      <div class="card">
        <div class="top"><span class="pill gold">Question ${idx+1} of ${questions.length}</span><span class="pill">${answeredCount}/${questions.length} answered</span></div>
        <h3 style="margin:10px 0 14px;line-height:1.4;">${esc(q.q)}</h3>
        <div style="display:flex;flex-direction:column;gap:8px;">
        ${q.options.map((opt,oi) => `
          <div onclick="selectMockAnswer(${idx},${oi})" style="display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;border:1.5px solid ${window._mockAnswers[idx]===oi?'var(--primary)':'var(--border)'};background:${window._mockAnswers[idx]===oi?'var(--surface-2)':'#fff'};cursor:pointer;">
            <span style="width:26px;height:26px;border-radius:50%;background:${window._mockAnswers[idx]===oi?'var(--primary)':'var(--surface-2)'};color:${window._mockAnswers[idx]===oi?'#fff':'var(--ink)'};display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12.5px;flex-shrink:0;">${String.fromCharCode(65+oi)}</span>
            <span>${esc(opt)}</span>
          </div>`).join('')}
        </div>
        <div class="flex" style="margin-top:18px;justify-content:space-between;">
          ${idx>0 ? `<button class="btn outline" onclick="renderMockQuestion(${idx-1})">← Previous</button>` : `<span></span>`}
          ${idx < questions.length-1
            ? `<button class="btn" onclick="renderMockQuestion(${idx+1})">Next →</button>`
            : `<button class="btn gold" onclick="confirmSubmitMock()">✅ Submit</button>`}
        </div>
        ${idx===questions.length-1 ? '' : `<button class="btn sm outline" style="width:100%;margin-top:10px;" onclick="confirmSubmitMock()">Submit now</button>`}
      </div>
    </div>
    ${mock.show_calculator ? `<button class="btn gold" style="position:fixed;bottom:16px;right:16px;border-radius:50%;width:52px;height:52px;font-size:20px;z-index:400;" onclick="toggleMockCalculator(true)">🧮</button>` : ''}
  `;

  const fitA4 = () => {
    const sheet = $('printArea');
    if (!sheet) return;
    // Printable A4 area with the 8mm @page margins. Keep the border itself
    // at the full printable height when the content is short. If content is
    // long (many subjects), scale the whole sheet down just enough to fit.
    const targetHeightPx = 281 * 96 / 25.4;
    const naturalHeight = Math.max(sheet.scrollHeight, 1);
    let fitScale = naturalHeight > targetHeightPx ? targetHeightPx / naturalHeight : 1;
    fitScale = Math.max(0.42, Math.min(1.0, fitScale));
    sheet.style.transform = `scale(${fitScale})`;
    sheet.style.width = `calc(190mm / ${fitScale})`;
    sheet.style.minHeight = '281mm';
    sheet.style.margin = '0';
    sheet.dataset.printScale = fitScale.toFixed(4);
  };
  requestAnimationFrame(() => {
    fitA4();
    // Re-fit after fonts/images settle so the printed sheet remains one-page A4.
    setTimeout(fitA4, 150);
    setTimeout(fitA4, 500);
  });
}

function confirmSubmitMock(){
  const unanswered = window._mockAnswers.filter(a=>a==null).length;

async function submitMock(){
  clearInterval(window._mockTimerHandle);
  toggleMockCalculator(false);
  const mock = window._activeMock;
  const questions = window._activeQuestions;
  const s = loadSession();
  const answers = window._mockAnswers;
  let marksEarned = 0;
  const marksPossible = questions.reduce((sum,q)=>sum+(q.marks||1),0);
  questions.forEach((q,i) => { if (answers[i] === q.correct) marksEarned += (q.marks||1); });
  const { data: comp } = await sb.from('rs_components').select('*').eq('id', mock.component_id).maybeSingle();
  const scaledScore = comp ? Math.round((marksEarned/marksPossible) * comp.max_score * 10) / 10 : marksEarned;
  const { error: e1 } = await sb.from('rs_mock_attempts').insert({
    mock_id: mock.id, student_id: s.id, score: scaledScore, total_questions: questions.length,
    answers, shuffled_questions: questions, marks_earned: marksEarned, marks_possible: marksPossible
  });
  if (e1) { toast(e1.message,'error'); return; }
  await sb.from('rs_scores').upsert({
    student_id: s.id, subject_id: mock.subject_id, component_id: mock.component_id,
    score: scaledScore, source: 'mock', mock_id: mock.id
  }, { onConflict: 'student_id,subject_id,component_id' });

  if (mock.show_result) {
    app.innerHTML = `
      <div class="content" style="max-width:500px;text-align:center;padding-top:60px;">
        <div class="card">
          <h2>✅ ${mock.kind==='exam'?'Exam':'Test'} Submitted!</h2>
          <p style="font-size:34px;font-weight:800;margin:14px 0;color:var(--primary);">${marksEarned}/${marksPossible}</p>
          <p class="muted">Score has been recorded for ${esc(mock.title)}.</p>
          <button class="btn" style="margin-top:16px;" onclick="studentHome()">Back to Home</button>
        </div>
      </div>`;
  } else {
    app.innerHTML = `
      <div class="content" style="max-width:500px;text-align:center;padding-top:60px;">
        <div class="card">
          <h2>✅ Exam Completed!</h2>
          <p class="muted" style="margin-top:10px;">Your result has been recorded. ${mock.result_release_at ? `It will be available for review on ${fmtDateTime(mock.result_release_at)}.` : `Your teacher will let you know when it's released.`}</p>
          <button class="btn" style="margin-top:16px;" onclick="studentHome()">Back to Home</button>
        </div>
      </div>`;
  }
}

async function studentHome(){

  // Exams the student has completed AND whose review has been released

      </div>
      ${releasedExams.length > 0 ? `
      <div class="card">
        <h2>📖 Exam Reviews</h2>

          <div class="list-item">

          </div>`).join('')}

    </div>`;
}

(async function boot(){

    clearTimeout(window.__bootSlowTimer);
    const bl = document.getElementById('bootLoader');
    if (bl) {
      bl.classList.add('slow');
      document.getElementById('bootLoaderMsg').textContent = 'Something went wrong while starting the app. Please retry.';
    }
    console.error('Boot error:', e);
  }
})();

<script>

let currentActor = null;
let _assignedClassIds = new Set(), _assignedSubjectIds = new Set();

];

  if(!currentActor) return false;

  if(tab==='dashboard'||tab==='students'||tab==='scores'||tab==='broadsheet'||tab==='attendance'||tab==='remarks') return p[tab]!==false;

}
function hashHex(s){return crypto.subtle.digest('SHA-256',new TextEncoder().encode(String(s))).then(b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join(''))}

  const {data:{user}}=await sb.auth.getUser();

  const {data,error}=await sb.from('rs_staff_profiles').select('*').eq('id',user.id).maybeSingle();
  if(error) throw error;
  if(!data) throw new Error('Staff profile not found. Run the professional upgrade SQL first.');

function showBulkStudentImport(){const a=$('bulkStudentArea');a.innerHTML='<div class="card" style="background:var(--surface-2)"><h3>Bulk Student Import</h3><p class="muted" style="margin:5px 0 9px">One student per line: <strong>Name, Sex, Age, House, Parent Name, Password</strong>. Header row is optional.</p><textarea id="bulkStudentsText" rows="9" placeholder="John Okafor, Male, 15, Red House, Mrs Okafor, Welcome123\nMary Bright, Female, 14, Blue House, Mr Bright, Welcome456"></textarea><button class="btn sm" style="margin-top:8px" onclick="importStudentsBulk()">⚡ Import Students</button><div id="bulkStudentsMsg"></div></div>'}
async function createStudent(){const name=$('stName')?.value.trim(),pass=$('stPass')?.value.trim()||Math.random().toString(36).slice(2,10);if(!name)return toast('Enter student name','error');const payload={class_id:AState.classId,name,sex:$('stSex').value,age:$('stAge').value?parseInt($('stAge').value):null,house:$('stHouse').value.trim()||null,parent_name:$('stParent').value.trim()||null,profile_code:genProfileCode()};const {data,error}=await sb.from('rs_students').insert(payload).select('id').single();if(error)return toast(error.message,'error');try{await setStudentPassword(data.id,pass)}catch(e){await sb.from('rs_students').delete().eq('id',data.id);return toast(e.message,'error')}toast('Student added. Password stored with bcrypt.','success');adminStudents()}
async function importStudentsBulk(){const msg=$('bulkStudentsMsg'),text=$('bulkStudentsText').value.trim();if(!text)return toast('Paste student rows first','error');msg.innerHTML='<div class="banner info">Importing securely…</div>';const rows=[];const errors=[];for(const [i,line] of text.split(/\r?\n/).map(x=>x.trim()).filter(Boolean).entries()){const p=line.split(/[\t,]+/).map(x=>x.trim());if(/^name$/i.test(p[0]))continue;if(p.length<6){errors.push('Line '+(i+1)+': expected 6 fields');continue}rows.push({class_id:AState.classId,name:p[0],sex:p[1]||null,age:p[2]?parseInt(p[2]):null,house:p[3]||null,parent_name:p[4]||null,profile_code:genProfileCode(),_plain_password:p[5]||Math.random().toString(36).slice(2,10)})}if(!rows.length){msg.innerHTML='<div class="banner error">No valid rows.</div>';return}const clean=rows.map(({_plain_password,...r})=>r);const {data:created,error}=await sb.from('rs_students').insert(clean).select('id');if(error){msg.innerHTML='<div class="banner error">'+esc(error.message)+'</div>';return}for(let i=0;i<(created||[]).length;i++){try{await setStudentPassword(created[i].id,rows[i]._plain_password)}catch(e){errors.push('Password setup failed for '+rows[i].name)}}msg.innerHTML='<div class="banner success">Imported '+(created||[]).length+' students with secure passwords.'+(errors.length?' '+errors.length+' issue(s).':'')+'</div>';setTimeout(adminStudents,1000)}

  const {data:staff}=await sb.from('rs_staff_profiles').select('*').order('created_at',{ascending:false});const classes=AState.termId?await fetchClasses(AState.termId):[];const subjects=AState.classId?await fetchSubjects(AState.classId):[];

async function createStaffAccount(){if(!actorIs('admin','principal'))return toast('Only admin/principal can create staff','error');const email=$('staffNewEmail').value.trim(),pass=$('staffNewPass').value,name=$('staffNewName').value.trim(),role=$('staffNewRole').value;if(!email||!pass||!name)return toast('Fill all staff fields','error');const authClient=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:false,autoRefreshToken:false,storageKey:'rs_staff_creation'}});const {data,error}=await authClient.auth.signUp({email,password:pass});if(error)return toast(error.message,'error');const id=data.user?.id;if(!id)return toast('Account created; complete email confirmation then create the profile.','info');const {error:pe}=await sb.from('rs_staff_profiles').insert({id,email,full_name:name,role,status:'active',approved:false,permissions:{}});if(pe)return toast(pe.message,'error');toast('Staff account created and sent for approval','success');adminStaff()}

async function manageStaffAssignments(id){const a=$('staffAssignmentArea');const {data:staff}=await sb.from('rs_staff_profiles').select('*').eq('id',id).maybeSingle();const {data:as}=await sb.from('rs_staff_assignments').select('*').eq('staff_id',id);const classes=AState.termId?await fetchClasses(AState.termId):[];const subjects=AState.classId?await fetchSubjects(AState.classId):[];a.innerHTML='<div class="card"><h3>Assignments — '+esc(staff?.full_name||'')+'</h3><p class="muted">Select the exact classes and subjects this teacher can access. Database RLS must also be enabled by the included SQL migration.</p><div class="permGrid" style="margin-top:10px">'+classes.map(c=>'<div class="checkCard"><label><input type="checkbox" class="assignClass" value="'+c.id+'" '+((as||[]).some(x=>x.class_id===c.id)?'checked':'')+'> '+esc(c.name)+'</label></div>').join('')+'</div><div class="permGrid" style="margin-top:10px">'+subjects.map(s=>'<div class="checkCard"><label><input type="checkbox" class="assignSubject" value="'+s.id+'" '+((as||[]).some(x=>x.subject_id===s.id)?'checked':'')+'> '+esc(s.name)+'</label></div>').join('')+'</div><button class="btn" style="margin-top:12px" onclick="saveStaffAssignments(\''+id+'\')">Save Assignments</button></div>'}
async function saveStaffAssignments(id){await sb.from('rs_staff_assignments').delete().eq('staff_id',id);const cs=[...document.querySelectorAll('.assignClass:checked')].map(x=>({staff_id:id,class_id:x.value}));const ss=[...document.querySelectorAll('.assignSubject:checked')].map(x=>({staff_id:id,subject_id:x.value}));if(cs.length){const {error}=await sb.from('rs_staff_assignments').insert(cs);if(error)return toast(error.message,'error')}if(ss.length){const {error}=await sb.from('rs_staff_assignments').insert(ss);if(error)return toast(error.message,'error')}toast('Assignments saved','success');adminStaff()}

async function adminAttendance(){if(!AState.classId||!AState.termId){adminShell('<div class="card"><div class="banner info">Select a class in Setup first.</div></div>','attendance');return}const students=await fetchStudents(AState.classId),today=new Date().toISOString().slice(0,10);const {data:rows}=await sb.from('rs_attendance').select('*').eq('term_id',AState.termId).eq('date',today).in('student_id',students.map(s=>s.id));const m={};(rows||[]).forEach(r=>m[r.student_id]=r.status);adminShell('<div class="card"><div class="sectionKicker">Daily Attendance</div><div class="top"><h2>Attendance — '+today+'</h2><input id="attendanceDate" type="date" value="'+today+'" onchange="adminAttendanceForDate(this.value)" style="max-width:180px"></div><p class="muted">Mark Present, Absent, Late or Excused. Daily records are stored per term.</p><div class="tableWrap" style="margin-top:10px"><table><thead><tr><th>Student</th><th>Status</th></tr></thead><tbody>'+students.map(s=>'<tr><td><strong>'+esc(s.name)+'</strong></td><td><select class="attSel" data-sid="'+s.id+'"><option value="present" '+(m[s.id]==='present'?'selected':'')+'>Present</option><option value="absent" '+(m[s.id]==='absent'?'selected':'')+'>Absent</option><option value="late" '+(m[s.id]==='late'?'selected':'')+'>Late</option><option value="excused" '+(m[s.id]==='excused'?'selected':'')+'>Excused</option></select></td></tr>').join('')+'</tbody></table></div><button class="btn" style="margin-top:12px" onclick="saveAttendance()">💾 Save Attendance</button></div>','attendance')}

async function saveAttendance(){const date=window._attendanceDate||$('attendanceDate')?.value||new Date().toISOString().slice(0,10),user=(await sb.auth.getUser()).data.user?.id;const rows=[...document.querySelectorAll('.attSel')].map(x=>({student_id:x.dataset.sid,term_id:AState.termId,date,status:x.value,marked_by:user}));const {error}=await sb.from('rs_attendance').upsert(rows,{onConflict:'student_id,term_id,date'});if(error)return toast(error.message,'error');for(const r of rows){const {data:all}=await sb.from('rs_attendance').select('status').eq('student_id',r.student_id).eq('term_id',AState.termId);const total=(all||[]).length,present=(all||[]).filter(x=>x.status==='present'||x.status==='late').length;await sb.from('rs_remarks').upsert({student_id:r.student_id,term_id:AState.termId,total_days:total,days_present:present},{onConflict:'student_id,term_id'})}toast('Attendance saved and summary updated','success')}

async function adminFees(){if(!AState.classId||!AState.termId){adminShell('<div class="card"><div class="banner info">Select a class in Setup first.</div></div>','fees');return}const students=await fetchStudents(AState.classId);const {data:fees}=await sb.from('rs_fees').select('*').eq('term_id',AState.termId).in('student_id',students.map(s=>s.id)).order('created_at',{ascending:false});const total=(fees||[]).reduce((a,x)=>a+Number(x.amount||0),0),paid=(fees||[]).reduce((a,x)=>a+Number(x.paid_amount||0),0);adminShell('<div class="card"><div class="sectionKicker">Finance</div><h2>Fees & Payment Management</h2><div class="profGrid"><div class="profStat"><div class="num">₦'+total.toLocaleString()+'</div><div class="lbl">Billed</div></div><div class="profStat"><div class="num">₦'+paid.toLocaleString()+'</div><div class="lbl">Collected</div></div><div class="profStat"><div class="num">₦'+(total-paid).toLocaleString()+'</div><div class="lbl">Outstanding</div></div><div class="profStat"><div class="num">'+(fees||[]).length+'</div><div class="lbl">Transactions</div></div></div><div class="grid2"><div class="field"><label>Student</label><select id="feeStudent">'+students.map(s=>'<option value="'+s.id+'">'+esc(s.name)+'</option>').join('')+'</select></div><div class="field"><label>Fee item</label><input id="feeItem" placeholder="Tuition / Transport / Uniform"></div><div class="field"><label>Amount billed</label><input id="feeAmount" type="number" min="0"></div><div class="field"><label>Amount paid</label><input id="feePaid" type="number" min="0"></div><div class="field"><label>Due date</label><input id="feeDue" type="date"></div><div class="field"><label>Payment reference</label><input id="feeRef" placeholder="Receipt / transfer reference"></div></div><button class="btn" onclick="saveFee()">💾 Save Fee / Payment</button></div><div class="card"><h3>Recent transactions</h3><div class="tableWrap" style="margin-top:10px"><table><thead><tr><th>Student</th><th>Item</th><th>Billed</th><th>Paid</th><th>Balance</th><th>Status</th><th>Reference</th></tr></thead><tbody>'+(fees||[]).map(f=>'<tr><td>'+esc(students.find(s=>s.id===f.student_id)?.name||'—')+'</td><td>'+esc(f.item||'—')+'</td><td>₦'+Number(f.amount||0).toLocaleString()+'</td><td>₦'+Number(f.paid_amount||0).toLocaleString()+'</td><td>₦'+Math.max(0,Number(f.amount||0)-Number(f.paid_amount||0)).toLocaleString()+'</td><td>'+esc(f.status||'—')+'</td><td>'+esc(f.reference||'—')+'</td></tr>').join('')+'</tbody></table></div></div>','fees')}
async function saveFee(){const amount=Number($('feeAmount').value||0),paid=Number($('feePaid').value||0);const payload={student_id:$('feeStudent').value,term_id:AState.termId,item:$('feeItem').value.trim(),amount,paid_amount:paid,due_date:$('feeDue').value||null,reference:$('feeRef').value.trim()||null,status:paid>=amount?'paid':paid>0?'partial':'unpaid'};if(!payload.item||amount<0)return toast('Enter a fee item and valid amount','error');const {error}=await sb.from('rs_fees').insert(payload);if(error)return toast(error.message,'error');toast('Payment record saved','success');adminFees()}

async function adminAnalytics(){const students=AState.classId?await fetchStudents(AState.classId):[];let avg=0,complete=0;try{if(AState.classId&&AState.termId){const b=await computeBroadsheet(AState.classId,AState.termId);const vals=b.perStudent.map(x=>x.average).filter(v=>v!=null);avg=vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:0;complete=b.perStudent.filter(x=>x.complete).length}}catch(e){}const attendance=students.length&&AState.termId?(await sb.from('rs_attendance').select('status').eq('term_id',AState.termId).in('student_id',students.map(s=>s.id))).data||[]:[];const present=attendance.filter(x=>x.status==='present').length;adminShell('<div class="card"><div class="sectionKicker">Management Intelligence</div><h2>Report Analytics</h2><p class="muted">Quick academic, completion and attendance indicators for the selected class/term.</p></div><div class="profGrid"><div class="profStat"><div class="num">'+avg.toFixed(1)+'%</div><div class="lbl">Class average</div></div><div class="profStat"><div class="num">'+complete+'/'+students.length+'</div><div class="lbl">Complete results</div></div><div class="profStat"><div class="num">'+(attendance.length?Math.round(present/attendance.length*100):0)+'%</div><div class="lbl">Attendance present</div></div><div class="profStat"><div class="num">'+students.length+'</div><div class="lbl">Students analysed</div></div></div><div class="card"><h3>What this dashboard helps you see</h3><div class="permGrid" style="margin-top:10px"><div class="checkCard">📈 Class performance and averages</div><div class="checkCard">🎯 Complete vs incomplete results</div><div class="checkCard">🗓️ Attendance patterns</div><div class="checkCard">💳 Fee collection and balances</div><div class="checkCard">🏆 Ranking and subject performance</div><div class="checkCard">🔐 Access / approval control</div></div></div>','analytics')}
