.banner{padding:12px 14px;border-radius:var(--radius-sm);font-size:13.5px;font-weight:600;margin:10px 0}
.banner.success{background:var(--success-bg);color:var(--success)}

table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:9px 8px;border-bottom:1px solid var(--border);text-align:left;white-space:nowrap}
th{background:var(--surface-2);font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted)}
.topbar{position:sticky;top:0;z-index:50;background:var(--primary);color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;box-shadow:var(--shadow-md)}
.topbar .brand{font-weight:800;font-size:15px}
.navrow{display:flex;gap:6px;overflow-x:auto;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:52px;z-index:49}

.list-item:last-child{border-bottom:none}
.scoreInput{width:64px;padding:6px;text-align:center}

.resultSheet{background:#fff;color:#111;padding:24px;border:2px solid #333;max-width:720px;margin:0 auto}
.resultSheet h1{font-size:19px;text-align:center}

.resultSheet .infoGrid{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px;font-size:13px;margin:12px 0}
.resultSheet table{font-size:12.5px}
.resultSheet th,.resultSheet td{border:1px solid #333;padding:5px 6px}
.sigline{margin-top:26px;border-top:1px solid #333;padding-top:4px;font-size:11.5px}
.stampBox{border:1.5px dashed #999;height:70px;display:flex;align-items:center;justify-content:center;color:#999;font-size:11px;margin-top:8px}
@media print{
  body *{visibility:hidden}
  #printArea,#printArea *{visibility:visible}
  #printArea{position:absolute;left:0;top:0;width:100%}

window.__bootSlowTimer = setTimeout(() => {

/* ============================================================
   HELPERS
   ============================================================ */
const $ = id => document.getElementById(id);
const app = $('app');
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function uid(){ return (crypto.randomUUID ? crypto.randomUUID() : 'id-' + Date.now() + '-' + Math.random().toString(16).slice(2)); }
function fmtDate(d){ if(!d) return '—'; return new Date(d).toLocaleDateString('en-GB', {day:'2-digit',month:'short',year:'numeric'}); }
function fmtDateTime(d){ if(!d) return '—'; return new Date(d).toLocaleString('en-GB', {day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}); }
function toast(msg, type){
  const el = document.createElement('div');
  el.className = 'banner ' + (type||'info');
  el.style.cssText = 'position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:2000;max-width:90%;box-shadow:var(--shadow-md)';
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 3200);
}
function ordinal(n){
  if (n == null) return '—';
  const s = ['th','st','nd','rd'], v = n % 100;
  return n + (s[(v-20)%10] || s[v] || s[0]);
}
function competitionRank(arr, key){
  // arr: array of objects with a numeric|null [key]. Ranks descending, ties share rank, next rank skips. Nulls get null rank.
  const sorted = [...arr].filter(x => x[key] != null).sort((a,b) => b[key]-a[key]);
  let rank = 0, lastVal = null, seen = 0;
  const rankMap = new Map();
  sorted.forEach(item => {
    seen++;
    if (item[key] !== lastVal) { rank = seen; lastVal = item[key]; }
    rankMap.set(item, rank);
  });
  return arr.map(x => x[key] == null ? null : (rankMap.get(x) ?? null));
}
/* ============================================================
   SESSION (local)
   ============================================================ */
function saveSession(obj){ localStorage.setItem('rs_session', JSON.stringify(obj)); }
function loadSession(){ try { return JSON.parse(localStorage.getItem('rs_session')); } catch(e){ return null; } }
function clearSession(){ localStorage.removeItem('rs_session'); }

/* ============================================================
   LOGIN
   ============================================================ */
function loginScreen(){
  app.innerHTML = `
    <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;">
      <div class="card" style="width:100%;max-width:400px;">
        <h1 style="text-align:center;font-size:20px;">🏫 De-Trinity Result Portal</h1>
        <p class="muted" style="text-align:center;margin:6px 0 18px;">Termly academic reports & mock system</p>
        <div class="navrow" style="position:static;padding:0;border:none;margin-bottom:14px;justify-content:center;">
          <button id="tabAdmin" class="active" onclick="switchLoginTab('admin')">Admin</button>
          <button id="tabStudent" onclick="switchLoginTab('student')">Student</button>
        </div>
        <div id="loginFormArea"></div>
      </div>
    </div>`;
  switchLoginTab('admin');
}
function switchLoginTab(tab){
  $('tabAdmin')?.classList.toggle('active', tab==='admin');
  $('tabStudent')?.classList.toggle('active', tab==='student');
  const area = $('loginFormArea');
  if (tab === 'admin') {
    area.innerHTML = `
      <div class="field"><label>Admin email</label><input type="email" id="adminEmail" placeholder="Admin email"></div>
      <div class="field"><label>Password</label><input type="password" id="adminPass" placeholder="Enter admin password"></div>
      <button class="btn" style="width:100%" onclick="doAdminLogin()">Login as Admin</button>
      <div id="loginMsg"></div>`;
  } else {
    area.innerHTML = `
      <div class="navrow" style="position:static;padding:0;border:none;margin-bottom:12px;justify-content:center;">
        <button id="stuMethodPass" class="active" onclick="switchStudentMethod('pass')">Name & Password</button>
        <button id="stuMethodCode" onclick="switchStudentMethod('code')">Profile Code</button>
      </div>
      <div id="stuLoginFields"></div>
      <button class="btn" style="width:100%;margin-top:10px;" onclick="doStudentLogin()">Login as Student</button>
      <div id="loginMsg"></div>`;
    switchStudentMethod('pass');
  }
}
function switchStudentMethod(m){
  $('stuMethodPass')?.classList.toggle('active', m==='pass');
  $('stuMethodCode')?.classList.toggle('active', m==='code');
  window._stuLoginMethod = m;
  const f = $('stuLoginFields');
  if (m === 'pass') {
    f.innerHTML = `
      <div class="field"><label>Full name</label><input id="stuName" placeholder="Your full name as registered"></div>
      <div class="field"><label>Password</label><input type="password" id="stuPass" placeholder="Password given by your school"></div>`;
  } else {
    f.innerHTML = `<div class="field"><label>Profile code</label><input id="stuCode" placeholder="10-digit profile code" maxlength="10"></div>`;
  }
}
async function doAdminLogin(){
  const email = $('adminEmail').value.trim(), pass = $('adminPass').value;
  const msg = $('loginMsg');
  if (!email || !pass) { msg.innerHTML = `<div class="banner error">Enter email and password.</div>`; return; }
  msg.innerHTML = `<div class="banner info">Checking…</div>`;
  const { data, error } = await sb.auth.signInWithPassword({ email, password: pass });
  if (error) { msg.innerHTML = `<div class="banner error">${esc(error.message)}</div>`; return; }
  saveSession({ role: 'admin' });
  adminHome();
}
async function doStudentLogin(){
  const msg = $('loginMsg');
  msg.innerHTML = `<div class="banner info">Checking…</div>`;
  let query = sb.from('rs_students').select('*, rs_classes(*)');
  if (window._stuLoginMethod === 'code') {
    const code = $('stuCode').value.trim();
    if (!code) { msg.innerHTML = `<div class="banner error">Enter your profile code.</div>`; return; }
    query = query.eq('profile_code', code);
  } else {
    const name = $('stuName').value.trim(), pass = $('stuPass').value;
    if (!name || !pass) { msg.innerHTML = `<div class="banner error">Enter your name and password.</div>`; return; }
    query = query.ilike('name', name).eq('password', pass);
  }
  const { data, error } = await query.maybeSingle();
  if (error) { msg.innerHTML = `<div class="banner error">${esc(error.message)}</div>`; return; }
  if (!data) { msg.innerHTML = `<div class="banner error">Invalid login details.</div>`; return; }
  saveSession({ role: 'student', id: data.id, name: data.name, classId: data.class_id, className: data.rs_classes?.name });
  studentHome();
}
async function logout(){
  const s = loadSession();
  if (s?.role === 'admin') { try { await sb.auth.signOut(); } catch(e){} }
  clearSession(); loginScreen();
}

/* ============================================================
   ADMIN SHELL
   ============================================================ */
const ADMIN_TABS = [
  ['setup','🏗️ Setup'], ['students','🧑‍🎓 Students'], ['subjects','📚 Subjects'],
  ['scores','✍️ Score Entry'], ['broadsheet','📊 Broadsheet'], ['mocks','📝 Mocks'],
  ['publish','📢 Publish'], ['lifetime','📁 Lifetime Result'], ['settings','⚙️ Settings']
];
function adminShell(bodyHtml, active){
  app.innerHTML = `
    <div class="topbar">
      <span class="brand">🏫 De-Trinity Admin</span>
      <button class="btn sm outline" style="color:#fff;border-color:rgba(255,255,255,.4)" onclick="logout()">Logout</button>
    </div>
    <div class="navrow">
      ${ADMIN_TABS.map(([id,label]) => `<button class="${active===id?'active':''}" onclick="adminNav('${id}')">${label}</button>`).join('')}
    </div>
    <div class="content" id="content">${bodyHtml}</div>`;
}
function adminNav(id){
  const fns = { setup: adminSetup, students: adminStudents, subjects: adminSubjects, scores: adminScores,
    broadsheet: adminBroadsheet, mocks: adminMocks, publish: adminPublish, lifetime: adminLifetime, settings: adminSettings };
  (fns[id] || adminSetup)();
}
function adminHome(){ adminSetup(); }

/* ============================================================
   STATE (currently selected session/term/class, shared across tabs)
   ============================================================ */
const AState = { sessionId: null, termId: null, classId: null };

async function fetchSessions(){ const {data} = await sb.from('rs_sessions').select('*').order('created_at',{ascending:false}); return data||[]; }
async function fetchTerms(sessionId){ const {data} = await sb.from('rs_terms').select('*').eq('session_id', sessionId).order('created_at'); return data||[]; }
async function fetchClasses(termId){ const {data} = await sb.from('rs_classes').select('*').eq('term_id', termId).order('name'); return data||[]; }
async function fetchSubjects(classId){ const {data} = await sb.from('rs_subjects').select('*').eq('class_id', classId).order('name'); return data||[]; }
async function fetchComponents(termId){ const {data} = await sb.from('rs_components').select('*').eq('term_id', termId).order('sort_order'); return data||[]; }
async function fetchStudents(classId){ const {data} = await sb.from('rs_students').select('*').eq('class_id', classId).order('name'); return data||[]; }

async function seedComponents(termId){
  const defaults = [
    {name:'Test 1', max_score:10, sort_order:1},{name:'Test 2', max_score:10, sort_order:2},
    {name:'Test 3', max_score:10, sort_order:3},{name:'Test 4', max_score:10, sort_order:4},
    {name:'Exam', max_score:60, sort_order:5}
  ];
  await sb.from('rs_components').insert(defaults.map(d => ({...d, term_id: termId})));
}
async function seedGradingScaleIfEmpty(){
  const { data } = await sb.from('rs_grading_scale').select('id').limit(1);
  if (data && data.length) return;
  const scale = [
    {min_score:75,max_score:100,grade:'A1',remark:'Excellent',sort_order:1},
    {min_score:70,max_score:74,grade:'B2',remark:'Very Good',sort_order:2},
    {min_score:65,max_score:69,grade:'B3',remark:'Good',sort_order:3},
    {min_score:60,max_score:64,grade:'C4',remark:'Credit',sort_order:4},
    {min_score:55,max_score:59,grade:'C5',remark:'Credit',sort_order:5},
    {min_score:50,max_score:54,grade:'C6',remark:'Credit',sort_order:6},
    {min_score:45,max_score:49,grade:'D7',remark:'Pass',sort_order:7},
    {min_score:40,max_score:44,grade:'E8',remark:'Pass',sort_order:8},
    {min_score:0,max_score:39,grade:'F9',remark:'Fail',sort_order:9},
  ];
  await sb.from('rs_grading_scale').insert(scale);
}
async function gradeFor(total){
  const { data } = await sb.from('rs_grading_scale').select('*').order('sort_order');
  const row = (data||[]).find(r => total >= r.min_score && total <= r.max_score);
  return row || { grade:'—', remark:'—' };
}

/* ---------- SETUP TAB ---------- */
async function adminSetup(){
  await seedGradingScaleIfEmpty();
  adminShell(`<div class="card"><p class="muted">Loading…</p></div>`, 'setup');
  const sessions = await fetchSessions();
  if (!AState.sessionId && sessions[0]) AState.sessionId = sessions[0].id;
  const terms = AState.sessionId ? await fetchTerms(AState.sessionId) : [];
  if (!AState.termId && terms[0]) AState.termId = terms[0].id;
  const classes = AState.termId ? await fetchClasses(AState.termId) : [];

  const body = `
    <div class="card">
      <div class="top"><h2>🏗️ Sessions & Terms</h2></div>
      <p class="muted">A session (e.g. 2026/2027) contains terms (First/Second/Third), which contain classes.</p>
      <div class="grid2" style="margin-top:12px;">
        <div>
          <label>Session</label>
          <select id="selSession" onchange="onSelectSession(this.value)">
            <option value="">— select —</option>
            ${sessions.map(s => `<option value="${s.id}" ${s.id===AState.sessionId?'selected':''}>${esc(s.name)}</option>`).join('')}
          </select>
          <div class="flex" style="margin-top:8px;">
            <input id="newSessionName" placeholder="e.g. 2026/2027" style="flex:1;min-width:140px;">
            <button class="btn sm" onclick="createSession()">+ Add Session</button>
          </div>
        </div>
        <div>
          <label>Term</label>
          <select id="selTerm" onchange="onSelectTerm(this.value)" ${!AState.sessionId?'disabled':''}>
            <option value="">— select —</option>
            ${terms.map(t => `<option value="${t.id}" ${t.id===AState.termId?'selected':''}>${esc(t.name)}</option>`).join('')}
          </select>
          <div class="flex" style="margin-top:8px;">
            <select id="newTermName" style="flex:1;">
              <option>First Term</option><option>Second Term</option><option>Third Term</option>
            </select>
            <button class="btn sm" onclick="createTerm()" ${!AState.sessionId?'disabled':''}>+ Add Term</button>
          </div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="top"><h2>🏫 Classes</h2></div>
      ${!AState.termId ? `<p class="muted">Select a session and term first.</p>` : `
      <div class="flex">
        <input id="newClassName" placeholder="e.g. SS2A" style="flex:1;min-width:140px;">
        <button class="btn sm" onclick="createClass()">+ Add Class</button>
      </div>
      <div style="margin-top:12px;">
        ${classes.length === 0 ? `<p class="muted">No classes yet for this term.</p>` : classes.map(c => `
          <div class="list-item">
            <span><strong>${esc(c.name)}</strong> ${AState.classId===c.id?'<span class=\"pill gold\">selected</span>':''}</span>
            <div class="flex">
              <button class="btn sm outline" onclick="selectClass('${c.id}')">Select</button>
              <button class="btn sm danger" onclick="deleteClass('${c.id}')">Delete</button>
            </div>
          </div>`).join('')}
      </div>`}
    </div>
    <div class="banner info">Selected class is used across Students, Subjects, Score Entry, Broadsheet, Mocks and Publish tabs.</div>
  `;
  adminShell(body, 'setup');
}
async function onSelectSession(id){ AState.sessionId = id || null; AState.termId = null; AState.classId = null; adminSetup(); }
async function onSelectTerm(id){ AState.termId = id || null; AState.classId = null; adminSetup(); }
async function createSession(){
  const name = $('newSessionName').value.trim();
  if (!name) return toast('Enter a session name','error');
  const { error } = await sb.from('rs_sessions').insert({ name });
  if (error) return toast(error.message,'error');
  toast('Session created','success'); adminSetup();
}
async function createTerm(){
  const name = $('newTermName').value;
  const { data, error } = await sb.from('rs_terms').insert({ session_id: AState.sessionId, name }).select().single();
  if (error) return toast(error.message,'error');
  await seedComponents(data.id);
  toast('Term created with default assessment components (Test 1-4 @10, Exam @60)','success');
  AState.termId = data.id; adminSetup();
}
async function createClass(){
  const name = $('newClassName').value.trim();
  if (!name) return toast('Enter a class name','error');
  const { error } = await sb.from('rs_classes').insert({ term_id: AState.termId, name });
  if (error) return toast(error.message,'error');
  toast('Class created','success'); adminSetup();
}

async function deleteClass(id){

async function adminScores(subjectId){
  if (!AState.classId || !AState.termId) {
    adminShell(`<div class="card"><div class="banner info">Select a class in the Setup tab first.</div></div>`, 'scores');
    return;
  }
  adminShell(`<div class="card"><p class="muted">Loading…</p></div>`, 'scores');
  const [subjects, students, comps] = await Promise.all([
    fetchSubjects(AState.classId), fetchStudents(AState.classId), fetchComponents(AState.termId)
  ]);
  if (!subjectId && subjects[0]) subjectId = subjects[0].id;
  let scoresMap = {};
  if (subjectId && students.length && comps.length) {
    const { data } = await sb.from('rs_scores').select('*').eq('subject_id', subjectId).in('student_id', students.map(s=>s.id));
    (data||[]).forEach(sc => { scoresMap[sc.student_id+'_'+sc.component_id] = sc; });
  }
  const body = `
    <div class="card">
      <div class="top"><h2>✍️ Score Entry</h2></div>
      <div class="field"><label>Subject</label>
        <select id="scoreSubjectSel" onchange="adminScores(this.value)">
          ${subjects.length===0 ? `<option value="">No subjects yet</option>` : subjects.map(s => `<option value="${s.id}" ${s.id===subjectId?'selected':''}>${esc(s.name)}</option>`).join('')}
        </select>
      </div>
      ${(!subjectId || students.length===0 || comps.length===0) ? `<p class="muted">Add subjects, students, and components first.</p>` : `
      <div style="overflow:auto;">
      <table>
        <thead><tr><th>Student</th>${comps.map(c=>`<th>${esc(c.name)}<br><span class="muted" style="text-transform:none;">/${c.max_score}</span></th>`).join('')}<th>Total</th></tr></thead>
        <tbody>
        ${students.map(st => {
          let total = 0, allFilled = true;
          const cells = comps.map(c => {
            const rec = scoresMap[st.id+'_'+c.id];
            const val = rec ? rec.score : '';
            if (val === '' || val == null) allFilled = false; else total += Number(val);
            return `<td><input class="scoreInput" data-student="${st.id}" data-comp="${c.id}" data-max="${c.max_score}" value="${val}"></td>`;
          }).join('');
          return `<tr><td><strong>${esc(st.name)}</strong></td>${cells}<td><strong>${allFilled ? total.toFixed(1) : '—'}</strong></td></tr>`;
        }).join('')}
        </tbody>
      </table>
      </div>
      <button class="btn" style="margin-top:14px;" onclick="saveAllScores('${subjectId}')">💾 Save All Scores</button>
      <div id="scoreSaveMsg"></div>`}
    </div>`;
  adminShell(body, 'scores');
}
async function saveAllScores(subjectId){
  const inputs = document.querySelectorAll('.scoreInput[data-student]');
  const msg = $('scoreSaveMsg');
  msg.innerHTML = `<div class="banner info">Saving…</div>`;
  const rows = [];
  for (const inp of inputs) {
    const raw = inp.value.trim();
    if (raw === '') continue;
    const max = parseFloat(inp.dataset.max);
    const val = parseFloat(raw);
    if (isNaN(val) || val < 0 || val > max) { msg.innerHTML = `<div class="banner error">Invalid score ${esc(raw)} (max ${max}). Fix and retry.</div>`; return; }
    rows.push({ student_id: inp.dataset.student, subject_id: subjectId, component_id: inp.dataset.comp, score: val, source: 'manual' });
  }
  if (rows.length === 0) { msg.innerHTML = `<div class="banner info">Nothing to save.</div>`; return; }
  const { error } = await sb.from('rs_scores').upsert(rows, { onConflict: 'student_id,subject_id,component_id' });
  if (error) { msg.innerHTML = `<div class="banner error">${esc(error.message)}</div>`; return; }
  toast('Scores saved','success');
  adminScores(subjectId);
}

/* ---------- BROADSHEET (class + term scoped) ---------- */
async function computeBroadsheet(classId, termId){
  const [subjects, students, comps] = await Promise.all([
    fetchSubjects(classId), fetchStudents(classId), fetchComponents(termId)
  ]);
  const maxPerSubject = comps.reduce((sum,c) => sum + Number(c.max_score), 0) || 100;
  let scores = [];
  if (subjects.length && students.length) {
    const { data } = await sb.from('rs_scores').select('*')
      .in('subject_id', subjects.map(s=>s.id)).in('student_id', students.map(s=>s.id));
    scores = data || [];
  }
  const scale = (await sb.from('rs_grading_scale').select('*').order('sort_order')).data || [];
  const gradeOf = total => scale.find(r => total >= r.min_score && total <= r.max_score) || { grade:'—', remark:'—' };

  const caComponents = comps.slice(0, -1);
  const examComponent = comps[comps.length - 1];
  const caMax = caComponents.reduce((s,c)=>s+Number(c.max_score),0);
  const examMax = examComponent ? Number(examComponent.max_score) : 0;

  // per-student per-subject totals
  const perStudent = students.map(st => {
    const subjectTotals = subjects.map(sub => {
      const relevant = scores.filter(sc => sc.student_id === st.id && sc.subject_id === sub.id);
      const filled = relevant.length === comps.length && relevant.every(r => r.score != null);
      const total = filled ? relevant.reduce((s,r) => s + Number(r.score), 0) : null;
      const compVals = comps.map(c => {
        const rec = relevant.find(r => r.component_id === c.id);
        return rec && rec.score != null ? Number(rec.score) : null;
      });
      const caTotal = filled ? compVals.slice(0,-1).reduce((s,v)=>s+v,0) : null;
      const examScore = filled ? compVals[compVals.length-1] : null;
      return { subjectId: sub.id, subjectName: sub.name, total, grade: total!=null ? gradeOf(total) : null, compVals, caTotal, examScore };
    });
    const complete = subjects.length > 0 && subjectTotals.every(s => s.total != null);
    const overallTotal = complete ? subjectTotals.reduce((s,x)=>s+x.total,0) : null;
    const average = complete ? overallTotal / subjects.length : null;
    return { student: st, subjectTotals, complete, overallTotal, average };
  });

  // subject position (rank within class, per subject)
  subjects.forEach((sub, idx) => {
    const arr = perStudent.map(p => ({ ref: p, val: p.subjectTotals[idx].total }));
    const ranks = competitionRank(arr.map(a=>({total:a.val})), 'total');
    arr.forEach((a,i) => { a.ref.subjectTotals[idx].position = ranks[i]; });
  });
  // overall position (rank within class)
  const overallRanks = competitionRank(perStudent.map(p=>({total:p.overallTotal})), 'total');
  perStudent.forEach((p,i) => { p.overallPosition = overallRanks[i]; });

  return { subjects, students, comps, maxPerSubject, caMax, examMax, perStudent };
}

async function adminBroadsheet(){
  if (!AState.classId || !AState.termId) {
    adminShell(`<div class="card"><div class="banner info">Select a class in the Setup tab first.</div></div>`, 'broadsheet');
    return;
  }
  adminShell(`<div class="card"><p class="muted">Computing broadsheet…</p></div>`, 'broadsheet');
  const cls = (await sb.from('rs_classes').select('*').eq('id', AState.classId).maybeSingle()).data;
  const { subjects, perStudent, maxPerSubject } = await computeBroadsheet(AState.classId, AState.termId);
  const classMax = maxPerSubject * subjects.length;

  const body = `
    <div class="card">
      <div class="top"><h2>📊 Broadsheet — ${esc(cls?.name||'')}</h2><span class="pill gold">${perStudent.length} student(s)</span></div>
      <p class="muted">Ranking is scoped to this class only. A student's result is complete only when every subject has all components filled.</p>
      ${subjects.length===0 || perStudent.length===0 ? `<p class="muted">Add subjects and students first.</p>` : `
      <div style="overflow:auto;">
      <table>
        <thead><tr><th>Student</th>${subjects.map(s=>`<th>${esc(s.name)}</th>`).join('')}<th>Total</th><th>Average</th><th>Position</th><th></th></tr></thead>
        <tbody>
        ${perStudent.sort((a,b) => (a.overallPosition||999)-(b.overallPosition||999)).map(p => `
          <tr>
            <td><strong>${esc(p.student.name)}</strong></td>
            ${p.subjectTotals.map(s => `<td>${s.total!=null ? '<strong>'+s.total.toFixed(1)+'</strong> ('+s.grade.grade+') — <strong>'+ordinal(s.position)+'</strong>' : '—'}</td>`).join('')}
            <td><strong>${p.overallTotal!=null ? p.overallTotal.toFixed(1)+'/'+classMax : '—'}</strong></td>
            <td><strong>${p.average!=null ? p.average.toFixed(1)+'%' : '—'}</strong></td>
            <td><strong>${p.overallPosition ? ordinal(p.overallPosition) : (p.complete ? '—' : '<span class="pill red">Incomplete</span>')}</strong></td>
            <td><button class="btn sm outline" onclick="adminPrintResult('${p.student.id}')">🖨️ Print</button></td>
          </tr>`).join('')}
        </tbody>
      </table>
      </div>`}
    </div>`;
  adminShell(body, 'broadsheet');
}

function overallRemark(avg){
  if (avg == null) return '—';
  if (avg >= 75) return 'Excellent performance. Keep it up!';
  if (avg >= 60) return 'Very good result.';
  if (avg >= 50) return 'Good, but there is room for improvement.';
  if (avg >= 40) return 'Fair. More effort is needed.';
  return 'Poor performance. Needs serious improvement.';
}

      ${mocks.length===0 ? `<p class="muted">None yet.</p>` : mocks.map(m => `
        <div class="list-item" style="align-items:flex-start;">
          <div>
            <strong>${esc(m.title)}</strong><br>
            <span class="muted">${fmtDateTime(m.start_time)} → ${fmtDateTime(m.end_time)} · ${m.duration_minutes} min</span>
          </div>
          <div class="flex">
            <button class="btn sm outline" onclick="viewMockAttempts('${m.id}')">Attempts</button>
            <button class="btn sm danger" onclick="deleteMock('${m.id}')">Delete</button>
          </div>
        </div>`).join('')}
      <div id="mockAttemptsArea"></div>
    </div>`;
  adminShell(body, 'mocks');
  window._mockDraftQuestions = [];
  renderMockQuestionDrafts();
}
function addMockQuestionDraft(){
  window._mockDraftQuestions.push({ id: uid(), q:'', options:['','','',''], correct:0 });
  renderMockQuestionDrafts();
}
function renderMockQuestionDrafts(){
  const area = $('mockQuestionsArea');
  if (!area) return;
  area.innerHTML = window._mockDraftQuestions.map((q,i) => `
    <div class="qbox">
      <div class="field"><label>Question ${i+1}</label><input value="${esc(q.q)}" onchange="updateDraftQ('${q.id}','q',this.value)"></div>
      <div class="grid2">
        ${q.options.map((opt,oi) => `
          <div class="field">
            <label><input type="radio" name="correct_${q.id}" ${q.correct===oi?'checked':''} onchange="updateDraftQ('${q.id}','correct',${oi})"> Option ${oi+1} ${q.correct===oi?'(correct)':''}</label>
            <input value="${esc(opt)}" onchange="updateDraftOpt('${q.id}',${oi},this.value)">
          </div>`).join('')}
      </div>
      <button class="btn sm danger" onclick="removeDraftQ('${q.id}')">Remove question</button>
    </div>`).join('') || `<p class="muted">No questions added yet.</p>`;
}
function updateDraftQ(id, field, val){ const q = window._mockDraftQuestions.find(x=>x.id===id); if (q) q[field] = val; }
function updateDraftOpt(id, idx, val){ const q = window._mockDraftQuestions.find(x=>x.id===id); if (q) q.options[idx] = val; }
function removeDraftQ(id){ window._mockDraftQuestions = window._mockDraftQuestions.filter(x=>x.id!==id); renderMockQuestionDrafts(); }
async function createMock(){
  const msg = $('mockCreateMsg');
  const title = $('mockTitle').value.trim();
  const start = $('mockStart').value, end = $('mockEnd').value;
  if (!title || !start || !end) { msg.innerHTML = `<div class="banner error">Fill title, opens-at and closes-at.</div>`; return; }
  const qs = window._mockDraftQuestions.filter(q => q.q.trim() && q.options.every(o=>o.trim()));
  if (qs.length === 0) { msg.innerHTML = `<div class="banner error">Add at least one complete question.</div>`; return; }
  const payload = {
    class_id: AState.classId, subject_id: $('mockSubject').value, component_id: $('mockComponent').value,
    title, questions: qs, start_time: new Date(start).toISOString(), end_time: new Date(end).toISOString(),
    duration_minutes: parseInt($('mockDuration').value) || 30
  };
  const { error } = await sb.from('rs_mocks').insert(payload);
  if (error) { msg.innerHTML = `<div class="banner error">${esc(error.message)}</div>`; return; }
  toast('Mock scheduled','success'); adminMocks();
}
async function deleteMock(id){
  if (!confirm('Delete this mock and its attempts?')) return;
  await sb.from('rs_mocks').delete().eq('id', id);
  adminMocks();
}
async function viewMockAttempts(mockId){
  const area = $('mockAttemptsArea');
  area.innerHTML = `<p class="muted">Loading attempts…</p>`;
  const { data } = await sb.from('rs_mock_attempts').select('*, rs_students(name)').eq('mock_id', mockId);
  area.innerHTML = `
    <div class="card" style="margin-top:10px;background:var(--surface-2);">
      <h3>Attempts</h3>
      ${(!data || data.length===0) ? `<p class="muted">No attempts yet.</p>` : `
      <table><thead><tr><th>Student</th><th>Score</th><th>Completed</th></tr></thead>
      <tbody>${data.map(a=>`<tr><td>${esc(a.rs_students?.name||'—')}</td><td>${a.score}</td><td>${fmtDateTime(a.completed_at)}</td></tr>`).join('')}</tbody></table>`}
    </div>`;
}

/* ---------- STUDENT: take a mock ---------- */
async function studentAvailableMocks(classId){
  const { data } = await sb.from('rs_mocks').select('*').eq('class_id', classId);
  const now = new Date();
  return (data||[]).filter(m => new Date(m.start_time) <= now && now <= new Date(m.end_time));
}
async function studentTakeMock(mockId){
  const s = loadSession();
  const { data: mock } = await sb.from('rs_mocks').select('*').eq('id', mockId).maybeSingle();
  if (!mock) { toast('Mock not found','error'); return; }
  const { data: existing } = await sb.from('rs_mock_attempts').select('*').eq('mock_id', mockId).eq('student_id', s.id).maybeSingle();
  if (existing) { toast('You already attempted this mock.','error'); studentHome(); return; }
  window._activeMock = mock;
  window._mockAnswers = new Array(mock.questions.length).fill(null);
  renderMockQuestion(0);
}
function renderMockQuestion(idx){
  const mock = window._activeMock;
  const q = mock.questions[idx];
  app.innerHTML = `
    <div class="content" style="max-width:600px;">
      <div class="card">
        <div class="top"><h2>📝 ${esc(mock.title)}</h2><span class="pill gold">Q${idx+1}/${mock.questions.length}</span></div>
        <h3 style="margin-bottom:12px;">${esc(q.q)}</h3>
        ${q.options.map((opt,oi) => `
          <label class="list-item" style="cursor:pointer;">
            <span><input type="radio" name="mockAns" ${window._mockAnswers[idx]===oi?'checked':''} onchange="window._mockAnswers[${idx}]=${oi}"> ${esc(opt)}</span>
          </label>`).join('')}
        <div class="flex" style="margin-top:16px;justify-content:space-between;">
          ${idx>0 ? `<button class="btn outline" onclick="renderMockQuestion(${idx-1})">← Previous</button>` : `<span></span>`}
          ${idx < mock.questions.length-1
            ? `<button class="btn" onclick="renderMockQuestion(${idx+1})">Next →</button>`
            : `<button class="btn gold" onclick="submitMock()">✅ Submit Mock</button>`}
        </div>
      </div>
    </div>`;
}
async function submitMock(){
  const mock = window._activeMock;
  const s = loadSession();
  const answers = window._mockAnswers;
  let correct = 0;
  mock.questions.forEach((q,i) => { if (answers[i] === q.correct) correct++; });
  const pct = correct / mock.questions.length;
  const { data: comp } = await sb.from('rs_components').select('*').eq('id', mock.component_id).maybeSingle();
  const scaledScore = comp ? Math.round(pct * comp.max_score * 10) / 10 : correct;
  const { error: e1 } = await sb.from('rs_mock_attempts').insert({ mock_id: mock.id, student_id: s.id, score: scaledScore, total_questions: mock.questions.length });
  if (e1) { toast(e1.message,'error'); return; }
  await sb.from('rs_scores').upsert({
    student_id: s.id, subject_id: mock.subject_id, component_id: mock.component_id,
    score: scaledScore, source: 'mock', mock_id: mock.id
  }, { onConflict: 'student_id,subject_id,component_id' });
  toast(`Mock submitted! Score auto-filled into your record.`, 'success');
  studentHome();
}

/* ============================================================
   PUBLISH TAB
   ============================================================ */
async function adminPublish(){
  if (!AState.classId || !AState.termId) {
    adminShell(`<div class="card"><div class="banner info">Select a class in the Setup tab first.</div></div>`, 'publish');
    return;
  }
  const cls = (await sb.from('rs_classes').select('*').eq('id', AState.classId).maybeSingle()).data;
  const term = (await sb.from('rs_terms').select('*').eq('id', AState.termId).maybeSingle()).data;
  const { data: pub } = await sb.from('rs_publish').select('*').eq('class_id', AState.classId).eq('term_id', AState.termId).maybeSingle();
  const isPublished = pub?.published || false;
  const body = `
    <div class="card">
      <div class="top"><h2>📢 Publish Results</h2></div>
      <p class="muted">Students in <strong>${esc(cls?.name||'')}</strong> (${esc(term?.name||'')}) will only see their result after you publish. Before that, they only see mocks assigned to them.</p>
      <div class="banner ${isPublished?'success':'info'}" style="margin:14px 0;">
        Status: ${isPublished ? `✅ Published${pub.published_at ? ' on '+fmtDateTime(pub.published_at) : ''}` : '🔒 Not published yet'}
      </div>
      ${isPublished
        ? `<button class="btn danger" onclick="togglePublish(false)">Unpublish</button>`
        : `<button class="btn gold" onclick="togglePublish(true)">📢 Publish Result Now</button>`}
    </div>`;
  adminShell(body, 'publish');
}
async function togglePublish(pub){
  const payload = { class_id: AState.classId, term_id: AState.termId, published: pub, published_at: pub ? new Date().toISOString() : null };
  const { error } = await sb.from('rs_publish').upsert(payload, { onConflict: 'class_id,term_id' });
  if (error) return toast(error.message,'error');
  toast(pub ? 'Result published!' : 'Result unpublished', 'success');
  adminPublish();
}

/* ============================================================
   LIFETIME RESULT (admin: search a student's full history)
   ============================================================ */
async function adminLifetime(query){
  adminShell(`
    <div class="card">
      <div class="top"><h2>📁 Student Lifetime Result</h2></div>
      <div class="flex">
        <input id="lifetimeSearch" placeholder="Type student name…" value="${esc(query||'')}" style="flex:1;min-width:180px;">
        <button class="btn" onclick="adminLifetime($('lifetimeSearch').value)">Search</button>
      </div>
      <div id="lifetimeResults" style="margin-top:14px;">${query ? '<p class="muted">Searching…</p>' : '<p class="muted">Search by name to see every term/session result a student has ever had.</p>'}</div>
    </div>`, 'lifetime');
  if (!query) return;
  const { data: students } = await sb.from('rs_students').select('*, rs_classes(*, rs_terms(*, rs_sessions(*)))').ilike('name', `%${query}%`);
  const area = $('lifetimeResults');
  if (!students || students.length === 0) { area.innerHTML = `<p class="muted">No student found matching "${esc(query)}".</p>`; return; }
  let html = '';
  for (const st of students) {
    const term = st.rs_classes?.rs_terms, session = term?.rs_sessions;
    html += `
      <div class="list-item">
        <span><strong>${esc(st.name)}</strong> — ${esc(st.rs_classes?.name||'')} · ${esc(term?.name||'')} · ${esc(session?.name||'')}</span>
        <button class="btn sm outline" onclick="showPrintPage('${st.id}','${st.class_id}','${term?.id}','adminLifetime')">View / Print</button>
      </div>`;
  }
  area.innerHTML = html;
}

/* ============================================================
   STUDENT PORTAL
   ============================================================ */
async function studentHome(){
  const s = loadSession();
  app.innerHTML = `<div class="content"><p class="muted">Loading…</p></div>`;
  const mocks = await studentAvailableMocks(s.classId);
  const attempted = (await sb.from('rs_mock_attempts').select('mock_id').eq('student_id', s.id)).data || [];
  const attemptedIds = new Set(attempted.map(a=>a.mock_id));
  const { data: publishedTerms } = await sb.from('rs_publish').select('*, rs_terms(*, rs_sessions(*))').eq('class_id', s.classId).eq('published', true);

  app.innerHTML = `
    <div class="topbar">
      <span class="brand">🏫 ${esc(s.name)} — ${esc(s.className||'')}</span>
      <button class="btn sm outline" style="color:#fff;border-color:rgba(255,255,255,.4)" onclick="logout()">Logout</button>
    </div>
    <div class="content">
      <div class="card">
        <h2>📝 Available Mocks</h2>
        ${mocks.length===0 ? `<p class="muted">No mocks open right now.</p>` : mocks.map(m => `
          <div class="list-item">
            <span><strong>${esc(m.title)}</strong><br><span class="muted">Closes ${fmtDateTime(m.end_time)} · ${m.duration_minutes} min</span></span>
            ${attemptedIds.has(m.id) ? `<span class="pill green">Completed</span>` : `<button class="btn sm" onclick="studentTakeMock('${m.id}')">Take Mock</button>`}
          </div>`).join('')}
      </div>
      <div class="card">
        <h2>📄 Your Results</h2>
        ${(!publishedTerms || publishedTerms.length===0) ? `<p class="muted">No results have been published yet.</p>` : publishedTerms.map(p => `
          <div class="list-item">
            <span>${esc(p.rs_terms?.name||'')} · ${esc(p.rs_terms?.rs_sessions?.name||'')}</span>
            <button class="btn sm outline" onclick="showPrintPage('${s.id}','${s.classId}','${p.term_id}','studentHome')">View Result</button>
          </div>`).join('')}
      </div>
    </div>`;
}

/* ============================================================
   BOOT
   ============================================================ */
(async function boot(){
  try {
    const { data: { session: authSession } } = await sb.auth.getSession();
    const local = loadSession();
    if (authSession) {
      saveSession({ role: 'admin' });
      adminHome();
    } else if (local?.role === 'student') {
      studentHome();
    } else {
      clearSession();
      loginScreen();
    }
    clearTimeout(window.__bootSlowTimer);
    const bl = document.getElementById('bootLoader');
    if (bl) bl.remove();
  } catch (e) {
    clearTimeout(window.__bootSlowTimer);
    const bl = document.getElementById('bootLoader');
    if (bl) {
      bl.classList.add('slow');
      document.getElementById('bootLoaderMsg').textContent = 'Something went wrong while starting the app. Please retry.';
    }
    console.error('Boot error:', e);
  }
})();
</script>
