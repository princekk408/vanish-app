<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#667085;--line:#e4e7ec;--primary:#2457d6;--primary2:#183ea0;--ok:#07845b;--warn:#b54708;--danger:#c43232;--shadow:0 8px 30px rgba(16,24,40,.07);--radius:16px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer}.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:12px 18px}.brand{font-weight:800}.brand small{display:block;color:var(--muted);font-weight:500}.wrap{max-width:1400px;margin:auto;padding:18px}.layout{display:grid;grid-template-columns:240px 1fr;gap:18px}.side{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:10px;height:max-content;position:sticky;top:76px}.side button{display:block;width:100%;border:0;background:transparent;text-align:left;padding:11px 12px;border-radius:10px;margin:2px 0;color:var(--text)}.side button.active,.side button:hover{background:#edf2ff;color:var(--primary);font-weight:700}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);margin-bottom:16px}.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.stat{padding:16px;border:1px solid var(--line);border-radius:14px;background:#fff}.stat b{font-size:26px;display:block}.muted{color:var(--muted)}h1,h2,h3{margin:0 0 8px}.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:700}.primary{background:var(--primary);color:#fff}.secondary{background:#eef2f7;color:var(--text)}.danger{background:#fee4e2;color:#b42318}.ok{background:#dcfae9;color:#067647}.small{font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap}.field label{display:block;font-weight:650;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:10px 11px;border:1px solid #d0d5dd;border-radius:10px;background:#fff}.field textarea{min-height:80px;resize:vertical}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px}.table{width:100%;border-collapse:collapse;min-width:780px}.table th,.table td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}.table th{background:#f8fafc;font-size:12px;color:#475467}.pill{display:inline-flex;align-items:center;padding:4px 8px;border-radius:999px;background:#eef2ff;color:#3448a0;font-size:12px;font-weight:700}.hidden{display:none!important}.toast{position:fixed;right:18px;bottom:18px;z-index:100;background:#101828;color:#fff;padding:12px 16px;border-radius:10px;box-shadow:var(--shadow)}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.loginbox{width:min(560px,100%)}.brandmark{font-size:25px;font-weight:900;margin-bottom:4px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.tab{border:1px solid var(--line);background:#fff;padding:9px 12px;border-radius:9px}.tab.active{background:#edf2ff;color:var(--primary);border-color:#b9c7ff;font-weight:800}.notice{padding:11px 13px;border-radius:10px;background:#fff8e8;color:#7a4a00;border:1px solid #f3d58c}.result-preview{background:#fff;border:1px solid #bbb;padding:25px;color:#111}.result-head{text-align:center;border-bottom:2px solid #111;padding-bottom:10px;margin-bottom:10px}.result-meta{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;font-size:12px}.result-table{width:100%;border-collapse:collapse;font-size:11px}.result-table th,.result-table td{border:1px solid #444;padding:5px;text-align:center}.result-table th:first-child,.result-table td:first-child{text-align:left}.result-footer{display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px;margin-top:35px;font-size:11px}.sig{border-top:1px solid #222;padding-top:5px;text-align:center;min-height:35px}.profile-check{padding:12px;border:1px solid var(--line);border-radius:12px;background:#f8fafc;margin-top:12px}.profile-check.good{background:#ecfdf3;border-color:#abefc6}.profile-check.warn{background:#fffaeb;border-color:#fedf89}.profile-progress{height:8px;background:#e4e7ec;border-radius:999px;overflow:hidden;margin:8px 0}.profile-progress>span{display:block;height:100%;background:var(--primary);border-radius:999px}.preview-note{font-size:12px;color:var(--muted);margin-top:6px}.live-preview{border:1px dashed #98a2b3;border-radius:12px;padding:12px;background:#f8fafc}.missing-list{margin:6px 0 0 18px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;padding:18px;z-index:50}.modalbox{background:#fff;border-radius:16px;width:min(850px,100%);max-height:90vh;overflow:auto;padding:18px}.close{float:right;border:0;background:#eee;border-radius:8px;padding:5px 9px}.q{border:1px solid var(--line);padding:12px;border-radius:12px;margin:10px 0}.option{display:block;padding:8px;margin-top:5px;border:1px solid var(--line);border-radius:8px}.mobile-only{display:none}.subject-picker{border:1px solid var(--line);border-radius:12px;padding:12px;background:#f8fafc}.subject-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:8px}.subject-check{display:flex;align-items:center;gap:8px;padding:8px;border:1px solid var(--line);border-radius:9px;background:#fff}.result-status{padding:8px 10px;border-radius:9px;background:#fff8e8;color:#7a4a00;border:1px solid #f3d58c;font-size:12px}.result-status.ok{background:#ecfdf3;color:#067647;border-color:#abefc6}
@media(max-width:900px){.layout{grid-template-columns:1fr}.side{position:static;display:flex;overflow:auto;gap:4px}.side button{white-space:nowrap}.g4,.g3{grid-template-columns:repeat(2,minmax(0,1fr))}.mobile-only{display:block}.result-meta{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.wrap{padding:10px}.g2,.g3,.g4{grid-template-columns:1fr}.top{padding:10px}.result-footer{grid-template-columns:1fr}}
@media print{body{background:#fff}.top,.side,#app>div:not(.printable),.no-print{display:none!important}.wrap{max-width:none;padding:0}.layout{display:block}.printable{display:block!important;box-shadow:none;border:0}.result-preview{border:0}.modal{position:static;background:#fff;padding:0}.modalbox{width:100%;max-height:none;box-shadow:none}.modal .no-print{display:none!important}}
</style>
</head>
<body>
<div id="root"></div>
<div id="toast" class="toast hidden"></div>
<script>
/* ===================== SUPABASE CONFIG ===================== */
const SUPABASE_URL='https://ucerqmewibwkxdgtgqvc.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_6rikKD0Zvl5xOtdVG00sWA_-Xv4H8I_';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);

/*
DATABASE EXPECTATION
Tables used by this single-page app are listed in the SETUP tab in Admin.
The anon key is safe to place in a browser only when Supabase RLS policies
are correctly configured. Never put a service_role key in this file.
*/

const A={user:null,profile:null,page:'dashboard',classId:'',termId:'',selectedStudent:null};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>Number(n||0).toLocaleString('en-NG',{minimumFractionDigits:2});
const toast=(m,good=true)=>{let x=document.getElementById('toast');x.textContent=m;x.classList.remove('hidden');x.style.background=good?'#101828':'#b42318';setTimeout(()=>x.classList.add('hidden'),3000)};
const el=id=>document.getElementById(id);
const today=()=>new Date().toISOString().slice(0,10);
// WAEC grading is calculated in JavaScript from the /100 subject total.
// No database query is required when a score is graded.
function grade(s){s=Number(s||0);if(s>=75)return'A1';if(s>=70)return'B2';if(s>=65)return'B3';if(s>=60)return'C4';if(s>=55)return'C5';if(s>=50)return'C6';if(s>=45)return'D7';if(s>=40)return'E8';return'F9'}
function avg(nums){let a=nums.filter(x=>x!==null&&x!==undefined&&!Number.isNaN(Number(x))).map(Number);return a.length?a.reduce((x,y)=>x+y,0)/a.length:0}
function fmtDate(x){return x?new Date(x).toLocaleDateString('en-GB'):''}
function uuid(){return crypto.randomUUID?crypto.randomUUID():Math.random().toString(36).slice(2)}
async function q(table,select='*',filters=[]){let z=sb.from(table).select(select);for(const f of filters)z=z[f.op](f.col,f.val);let {data,error}=await z;if(error)throw error;return data||[]}
async function one(table,select='*',filters=[]){let r=await q(table,select,filters);return r[0]||null}
async function up(table,row){let {data,error}=await sb.from(table).upsert(row).select();if(error)throw error;return data?.[0]}
async function ins(table,row){let {data,error}=await sb.from(table).insert(row).select();if(error)throw error;return data?.[0]}
async function del(table,filters){let z=sb.from(table).delete();for(const f of filters)z=z[f.op](f.col,f.val);let {error}=await z;if(error)throw error}

async function boot(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){return login()}
  A.user=session.user;
  try{A.profile=await one('school_profiles','*',[{op:'eq',col:'id',val:session.user.id}]);}
  catch(e){return fatal(e)}
  if(!A.profile){return firstProfile()}
  if(A.profile.role==='admin')return admin();
  return student();
}
sb.auth.onAuthStateChange((_e,s)=>{if(s&&!A.profile){A.user=s.user;setTimeout(boot,50)}});
function fatal(e){document.getElementById('root').innerHTML='<div class="login"><div class="loginbox card"><h2>Database setup required</h2><p>'+esc(e.message||e)+'</p><p class="muted">Open Admin → Setup after creating the Supabase tables/policies shown there.</p></div></div>'}
function login(){
document.getElementById('root').innerHTML=`<div class="login"><div class="loginbox">
<div class="card"><div class="brandmark">🏫 School Result Manager</div><p class="muted">Results • Mock Tests • Class Ranking • Printing</p>
<div class="tabs">
<button class="tab active" onclick="loginTab('admin')">Admin Login</button>
<button class="tab" onclick="loginTab('student')">Student Login</button>
</div>
<div id="authbox"></div></div></div></div>`;loginTab('signin')}
function loginTab(mode){
  document.querySelectorAll('.tabs .tab').forEach((b,i)=>{
    b.classList.toggle('active',(mode==='admin'?i===0:i===1));
  });

  if(mode==='admin'){
    el('authbox').innerHTML=`
      <div class="grid">
        <div class="field"><label>Admin email</label>
          <input id="admin_email" type="email" value="ogonorprincebright@gmail.com" autocomplete="username">
        </div>
        <div class="field"><label>Admin password</label>
          <input id="admin_pass" type="password" autocomplete="current-password">
        </div>
        <button class="btn primary" onclick="adminLogin()">Login as Admin</button>
      </div>`;
  }else{
    el('authbox').innerHTML=`
      <div class="grid">
        <div class="field"><label>Student name</label>
          <input id="student_name" type="text" placeholder="Enter your full name">
        </div>
        <div class="field"><label>Password</label>
          <input id="student_pass" type="password" autocomplete="current-password">
        </div>
        <button class="btn primary" onclick="studentLogin()">Login as Student</button>
        <div class="notice small">Your administrator will provide your password. Students only see published mocks and released results.</div>
      </div>`;
  }
}

async function adminLogin(){
  try{
    const email=el('admin_email').value.trim();
    const password=el('admin_pass').value;
    if(email!=='ogonorprincebright@gmail.com')
      throw Error('Invalid admin email.');
    const {error}=await sb.auth.signInWithPassword({email,password});
    if(error)throw error;
    location.reload();
  }catch(e){toast(e.message,false)}
}

async function studentLogin(){
  try{
    const name=el('student_name').value.trim();
    const password=el('student_pass').value;
    if(!name||!password)throw Error('Enter your name and password.');

    // Student credentials are managed in school_profiles.
    // The password is checked against the profile's stored password field.
    const profiles=await q('school_profiles','*',[{op:'ilike',col:'name',val:name}]);
    const p=profiles.find(x=>String(x.name||'').toLowerCase()===name.toLowerCase());

    if(!p)throw Error('Student not found.');
    if(p.role==='admin')throw Error('Use the Admin Login.');
    if(String(p.password||'')!==password)throw Error('Incorrect password.');

    A.user={id:p.id,email:p.email||null};
    A.profile=p;
    student();
  }catch(e){toast(e.message,false)}
}

function firstProfile(){
document.getElementById('root').innerHTML=`<div class="login"><div class="loginbox card"><h2>Student profile</h2><p class="muted">Fill this once. Admins can later complete or edit the school details.</p>
${profileForm()}
<button class="btn primary" onclick="saveFirstProfile()">Save profile</button></div></div>`}
function profileForm(p={}){
return `<div class="grid g2">
<div class="field"><label>Full name *</label><input id="f_name" value="${esc(p.name)}" oninput="updateStudentLivePreview()"></div>
<div class="field"><label>Class *</label><input id="f_class" value="${esc(p.class_name)}" placeholder="JSS 1" oninput="updateStudentLivePreview()"></div>
<div class="field"><label>Sex *</label><select id="f_sex" onchange="updateStudentLivePreview()"><option value="">Select</option><option ${p.sex==='Male'?'selected':''}>Male</option><option ${p.sex==='Female'?'selected':''}>Female</option></select></div>
<div class="field"><label>Age *</label><input id="f_age" type="number" value="${esc(p.age)}" oninput="updateStudentLivePreview()"></div>
<div class="field"><label>Parent/Guardian name *</label><input id="f_parent" value="${esc(p.parent_name)}" oninput="updateStudentLivePreview()"></div>
<div class="field"><label>House</label><input id="f_house" value="${esc(p.house)}" oninput="updateStudentLivePreview()"></div>
<div class="field"><label>Class teacher *</label><input id="f_teacher" value="${esc(p.class_teacher)}" oninput="updateStudentLivePreview()"></div>
<div class="field"><label>Headmistress *</label><input id="f_headmistress" value="${esc(p.headmistress)}" oninput="updateStudentLivePreview()"></div>
<div class="field"><label>Headmaster/Principal *</label><input id="f_headmaster" value="${esc(p.headmaster)}" oninput="updateStudentLivePreview()"></div>
<div class="field"><label>Fees payable</label><input id="f_fees" type="number" value="${esc(p.fees_payable)}" oninput="updateStudentLivePreview()"></div>
<div class="field"><label>Student ID / admission no. *</label><input id="f_adm" value="${esc(p.admission_no)}" oninput="updateStudentLivePreview()"></div><div class="field"><label>Student password</label><input id="f_password" type="text" value="${esc(p.password)}" placeholder="Optional student login password"></div>
</div>
<div class="subject-picker" style="margin-top:12px"><b>Subjects this student will offer *</b><div class="preview-note">Select only the subjects this particular student takes. These are the subjects that will appear on the student's full result.</div><div id="studentSubjectsBox" class="subject-list"><span class="muted small">Loading subjects…</span></div></div>
<div id="studentProfileCheck"></div>
<div class="live-preview" style="margin-top:12px"><b>Live result header preview</b><div class="preview-note">This updates as you type, so you can confirm the student's name and other report details before saving.</div><div id="studentLivePreview" style="margin-top:10px"></div></div>`}
function studentFormValues(){return {name:el('f_name')?.value.trim()||'',class_name:el('f_class')?.value.trim()||'',sex:el('f_sex')?.value||'',age:el('f_age')?.value||'',parent_name:el('f_parent')?.value.trim()||'',house:el('f_house')?.value.trim()||'',class_teacher:el('f_teacher')?.value.trim()||'',headmistress:el('f_headmistress')?.value.trim()||'',headmaster:el('f_headmaster')?.value.trim()||'',fees_payable:el('f_fees')?.value||'',admission_no:el('f_adm')?.value.trim()||'',password:el('f_password')?.value||''}}
function profileCompleteness(p){let required=[['Full name','name'],['Class','class_name'],['Sex','sex'],['Age','age'],['Parent/Guardian name','parent_name'],['Class teacher','class_teacher'],['Headmistress','headmistress'],['Headmaster/Principal','headmaster'],['Student ID / admission no.','admission_no']];let missing=required.filter(x=>!String(p[x[1]]??'').trim()).map(x=>x[0]);return {missing,done:required.length-missing.length,total:required.length,pct:Math.round((required.length-missing.length)/required.length*100)}}
function updateStudentLivePreview(){let p=studentFormValues(),c=profileCompleteness(p),box=el('studentProfileCheck'),pv=el('studentLivePreview');if(!box||!pv)return;let selected=[...document.querySelectorAll('input[data-student-subject]:checked')].length;let subjectNote=selected?`<div style="margin-top:5px">Subjects selected: <b>${selected}</b></div>`:'<div style="margin-top:5px;color:#b42318"><b>No subjects selected yet.</b></div>';box.innerHTML=`<div class="profile-check ${c.missing.length?'warn':'good'}"><b>Profile completeness: ${c.pct}%</b><div class="profile-progress"><span style="width:${c.pct}%"></span></div><div>${c.missing.length?`Missing: ${esc(c.missing.join(', '))}`:'All report header fields are complete.'}</div>${subjectNote}</div>`;pv.innerHTML=`<div class="result-preview" style="padding:14px"><div class="result-head"><h2>DE-TRINITY MONTESSORI EDUCATION CENTER</h2><div>TERMINAL ACADEMIC REPORT</div><small>First Term • 2026/2027</small></div><div class="result-meta"><div><b>Name:</b> ${esc(p.name)||'—'}</div><div><b>Class:</b> ${esc(p.class_name)||'—'}</div><div><b>Sex:</b> ${esc(p.sex)||'—'}</div><div><b>Age:</b> ${esc(p.age)||'—'}</div><div><b>Parent:</b> ${esc(p.parent_name)||'—'}</div><div><b>House:</b> ${esc(p.house)||'—'}</div><div><b>Fees payable:</b> ₦${money(p.fees_payable)}</div><div><b>Admission No.:</b> ${esc(p.admission_no)||'—'}</div></div></div>`}
async function saveFirstProfile(){
try{let p={id:A.user.id,email:A.user.email,name:el('f_name').value,class_name:el('f_class').value,sex:el('f_sex').value,age:el('f_age').value,parent_name:el('f_parent').value,house:el('f_house').value,class_teacher:el('f_teacher').value,headmistress:el('f_headmistress').value,headmaster:el('f_headmaster').value,fees_payable:Number(el('f_fees').value||0),admission_no:el('f_adm').value,role:'student'};if(!p.name||!p.class_name)throw Error('Name and class are required');await up('school_profiles',p);A.profile=p;student()}catch(e){toast(e.message,false)}}

function shell(title,subtitle,nav){
document.getElementById('root').innerHTML=`<div class="top"><div><div class="brand">🏫 School Result Manager</div><small class="muted">${esc(A.profile?.name||'')}</small></div><div class="actions"><span class="pill">${A.profile?.role==='admin'?'ADMIN':'STUDENT'}</span><button class="btn secondary" onclick="signout()">Sign out</button></div></div><div class="wrap"><div class="layout"><aside class="side">${nav}</aside><main><div class="card"><h1>${esc(title)}</h1><p class="muted">${esc(subtitle||'')}</p></div><div id="content"></div></main></div></div>`}
async function signout(){await sb.auth.signOut();location.reload()}

async function admin(){
shell('Admin Panel','Manage students, classes, subjects, terms, scores, mocks and published results.',`
<button class="active" onclick="adminPage('dashboard',this)">📊 Dashboard</button>
<button onclick="adminPage('students',this)">👨‍🎓 Students</button>
<button onclick="adminPage('classes',this)">🏷️ Classes & Terms</button>
<button onclick="adminPage('subjects',this)">📚 Subjects</button>
<button onclick="adminPage('scores',this)">🧮 Result Spreadsheet</button>
<button onclick="adminPage('mocks',this)">📝 Mock Tests</button>
<button onclick="adminPage('results',this)">📄 Full Results</button>
<button onclick="adminPage('publish',this)">🔓 Publish Results</button>
<button onclick="adminPage('users',this)">👤 Users</button>
<button onclick="adminPage('setup',this)">⚙️ Setup / Database</button>`);
adminPage('dashboard',document.querySelector('.side button'))}
async function adminPage(p,b){
document.querySelectorAll('.side button').forEach(x=>x.classList.remove('active'));b?.classList.add('active');A.page=p;
try{
if(p==='dashboard')await adminDashboard();
if(p==='students')await studentsPage();
if(p==='classes')await classesPage();
if(p==='subjects')await subjectsPage();
if(p==='scores')await scoresPage();
if(p==='mocks')await mocksPage();
if(p==='results')await resultsPage();
if(p==='publish')await publishPage();
if(p==='users')await usersPage();
if(p==='setup')setupPage();
}catch(e){el('content').innerHTML='<div class="card"><b>Could not load this section.</b><p>'+esc(e.message)+'</p></div>'}}
async function adminDashboard(){
let [students,classes,mocks]=await Promise.all([q('school_profiles','*',[{op:'eq',col:'role',val:'student'}]),q('school_classes'),q('school_mocks')]);
el('content').innerHTML=`<div class="grid g4"><div class="stat"><span class="muted">Students</span><b>${students.length}</b></div><div class="stat"><span class="muted">Classes</span><b>${classes.length}</b></div><div class="stat"><span class="muted">Mocks</span><b>${mocks.length}</b></div><div class="stat"><span class="muted">Published mocks</span><b>${mocks.filter(x=>x.published).length}</b></div></div>
<div class="card"><h3>Workflow</h3><ol><li>Create classes and terms.</li><li>Add subjects.</li><li>Create student accounts/profiles and assign subjects.</li><li>Create mocks and set the destination test slot (Test 1–4).</li><li>Mocks automatically save the student's mark into the selected test slot after submission.</li><li>Enter or import exam marks out of 60.</li><li>Result Spreadsheet computes each subject total/grade, subject positions, average and class rank.</li><li>Publish the term result. Students see it only after publication.</li><li>Print an individual result: stamps and signatures are generated in the print layout.</li></ol></div>`}
async function studentsPage(){

let mockQuestions=[];
function questionTemplate(){return {question:'',A:'',B:'',C:'',D:'',answer:'A',explanation:'',mark:1}}
function normalizeQuestion(q){
  q=q||{};
  const get=(...keys)=>{for(const k of keys){if(q[k]!==undefined&&q[k]!==null)return String(q[k]).trim()}return ''};
  let ans=get('answer','correct_answer','correctAnswer').toUpperCase().replace(/[^ABCD]/g,'').slice(0,1);
  return {question:get('question','Question','q'),A:get('A','a','option_a','optionA'),B:get('B','b','option_b','optionB'),C:get('C','c','option_c','optionC'),D:get('D','d','option_d','optionD'),answer:ans||'A',explanation:get('explanation','Explanation','reason'),mark:Number(q.mark||q.marks||1)||1};
}
function parseBulkQuestions(text){
  text=String(text||'').trim();
  if(!text)return [];
  // JSON is supported for users who already have questions in JSON format.
  try{
    const j=JSON.parse(text);
    if(Array.isArray(j))return j.map(normalizeQuestion);
    if(Array.isArray(j.questions))return j.questions.map(normalizeQuestion);
  }catch(e){}
  const lines=text.replace(/\r/g,'').split('\n');
  const out=[];let cur=null;
  const startQuestion=(v)=>{if(cur&&cur.question)out.push(normalizeQuestion(cur));cur=questionTemplate();cur.question=v.trim()};
  for(let raw of lines){
    let line=raw.trim();
    if(!line){continue}
    let m=line.match(/^(?:Q(?:uestion)?\s*\d*\s*[:.)-]?|\d+\s*[.)-])\s*(.+)$/i);
    if(m){startQuestion(m[1]);continue}
    m=line.match(/^question\s*[:.)-]\s*(.+)$/i);if(m){startQuestion(m[1]);continue}
    m=line.match(/^([ABCD])\s*[.)\:-]\s*(.+)$/i);if(m&&cur){cur[m[1].toUpperCase()]=m[2].trim();continue}
    m=line.match(/^(?:answer|correct\s*answer)\s*[:=\-]\s*([ABCD])/i);if(m&&cur){cur.answer=m[1].toUpperCase();continue}
    m=line.match(/^(?:explanation|solution|reason)\s*[:=\-]\s*(.*)$/i);if(m&&cur){cur.explanation=m[1].trim();continue}
    m=line.match(/^(?:mark|marks)\s*[:=\-]\s*(\d+(?:\.\d+)?)/i);if(m&&cur){cur.mark=Number(m[1]);continue}
    // If a question has not started, treat the first free-text line as its question.
    if(!cur)startQuestion(line);
    else if(!cur.A&&!cur.B&&!cur.C&&!cur.D)cur.question=(cur.question+' '+line).trim();
    else if(cur.explanation)cur.explanation=(cur.explanation+' '+line).trim();
  }
  if(cur&&cur.question)out.push(normalizeQuestion(cur));
  return out;
}
function renderQuestionPreview(){
  const box=el('questionPreview');if(!box)return;
  if(!mockQuestions.length){box.innerHTML='<div class="muted small">No questions added yet.</div>';return}
  box.innerHTML=mockQuestions.map((q,i)=>`<div class="q"><div class="actions" style="justify-content:space-between"><b>${i+1}. ${esc(q.question)}</b><button class="btn danger small" onclick="removeMockQuestion(${i})">Remove</button></div><div class="small muted">A. ${esc(q.A)} &nbsp; B. ${esc(q.B)} &nbsp; C. ${esc(q.C)} &nbsp; D. ${esc(q.D)}</div><div class="small"><b>Answer:</b> ${esc(q.answer)} &nbsp; <b>Mark:</b> ${esc(q.mark)}${q.explanation?` &nbsp; <b>Explanation:</b> ${esc(q.explanation)}`:''}</div></div>`).join('');
  el('m_questions').value=JSON.stringify(mockQuestions);
}
function addSingleQuestion(){
  const q=normalizeQuestion({question:el('sq_question').value,A:el('sq_A').value,B:el('sq_B').value,C:el('sq_C').value,D:el('sq_D').value,answer:el('sq_answer').value,explanation:el('sq_explanation').value,mark:el('sq_mark').value});
  if(!q.question||!q.A||!q.B||!q.C||!q.D){toast('Fill the question and all four options',false);return}
  mockQuestions.push(q);['sq_question','sq_A','sq_B','sq_C','sq_D','sq_explanation'].forEach(id=>el(id).value='');el('sq_answer').value='A';el('sq_mark').value='1';renderQuestionPreview();toast('Question added')
}
function parseAndAddBulk(){
  try{
    const qs=parseBulkQuestions(el('bulk_questions').value);
    if(!qs.length)throw new Error('No questions were detected. Use the format shown below.');
    const bad=qs.findIndex(q=>!q.question||!q.A||!q.B||!q.C||!q.D||!['A','B','C','D'].includes(q.answer));
    if(bad>=0)throw new Error('Question '+(bad+1)+' is incomplete. Every question needs the question, A-D options and an answer.');
    mockQuestions.push(...qs);el('bulk_questions').value='';renderQuestionPreview();toast(qs.length+' question'+(qs.length===1?'':'s')+' added')
  }catch(e){toast(e.message,false)}
}
function removeMockQuestion(i){mockQuestions.splice(i,1);renderQuestionPreview()}
function clearMockQuestions(){mockQuestions=[];renderQuestionPreview()}

e <code>[{"question":"...","A":"...","B":"...","C":"...","D":"...","answer":"B","explanation":"...","mark":1}]</code></p><button class="btn primary" onclick="parseAndAddBulk()">Parse & add questions</button></div><div id="questionPreview" style="margin-top:14px"></div><input type="hidden" id="m_questions"></div>
<div class="card"><div class="actions"><button class="btn primary" onclick="createMock()">Create mock</button><button class="btn secondary" onclick="clearMockQuestions()">Clear questions</button></div><p class="muted small">The mock is normalized/capped to the selected Test slot's 10 marks. On submission the student's best/selected score is written into Test 1–4.</p></div>
<div class="table-wrap"><table class="table"><tr><th>Title</th><th>Subject</th><th>Slot</th><th>Schedule</th><th>Published</th><th></th></tr>${mocks.map(m=>`<tr><td>${esc(m.title)}</td><td>${esc(m.subject_name||m.subject_id)}</td><td>Test ${m.target_test}</td><td>${fmtDate(m.start_at)}</td><td>${m.published?'Yes':'No'}</td><td><button class="btn ${m.published?'danger':'ok'} small" onclick="toggleMock('${m.id}',${!m.published})">${m.published?'Unpublish':'Publish'}</button></td></tr>`).join('')}</table></div>`}
function questionTab(mode){
  const single=mode==='single';el('singleQuestionBox').classList.toggle('hidden',!single);el('bulkQuestionBox').classList.toggle('hidden',single);el('singleQTab').classList.toggle('active',single);el('bulkQTab').classList.toggle('active',!single)
}
async function createMock(){try{if(!mockQuestions.length)throw new Error('Add at least one question before creating the mock.');await ins('school_mocks',{title:el('m_title').value,class_id:el('m_class').value,term_id:el('m_term').value,subject_id:el('m_subject').value,target_test:+el('m_slot').value,total_marks:10,duration_minutes:+el('m_duration').value,start_at:el('m_start').value||null,end_at:el('m_end').value||null,questions:mockQuestions,published:false,created_by:A.user.id});toast('Mock created with '+mockQuestions.length+' questions');mocksPage()}catch(e){toast(e.message,false)}}
async function toggleMock(id,v){try{await up('school_mocks',{id,published:v});toast(v?'Mock published':'Mock unpublished');mocksPage()}catch(e){toast(e.message,false)}}

async function publishPage(){
let {classes,terms}=await selectors();
el('content').innerHTML=`<div class="card"><h3>Publish final result</h3><p class="muted">Students cannot see result details until this switch is on for their class/term.</p><div class="grid g2"><div class="field"><label>Class</label><select id="p_class">${classes.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div><div class="field"><label>Term</label><select id="p_term">${terms.map(t=>`<option value="${t.id}">${esc(t.name)} — ${esc(t.session)}</option>`).join('')}</select></div></div><button class="btn primary" onclick="publishResult()">Publish result</button></div>`}
async function publishResult(){try{await up('school_releases',{class_id:el('p_class').value,term_id:el('p_term').value,published:true,published_at:new Date().toISOString(),published_by:A.user.id});toast('Result published')}catch(e){toast(e.message,false)}}

async function resultsPage(){
let students=await q('school_profiles','*',[{op:'eq',col:'role',val:'student'}]);
el('content').innerHTML=`<div class="card"><h3>Full result tracker</h3><p class="muted">Open any student to see the complete report card, every assigned subject, all Test 1–4 and Exam marks, grades, subject positions, total, average and class position. Blank cells show what still needs to be uploaded.</p></div><div class="table-wrap"><table class="table"><tr><th>Student</th><th>Class</th><th>Parent</th><th>Profile</th><th>Result status</th><th></th></tr>${students.map(s=>{let c=profileCompleteness(s);return `<tr><td>${esc(s.name)}</td><td>${esc(s.class_name)}</td><td>${esc(s.parent_name)}</td><td><span class="pill">${c.pct}% complete</span></td><td><button class="btn secondary small" onclick="lifeResult('${s.id}')">Check full result</button></td><td><button class="btn primary small" onclick="editStudent('${s.id}')">Edit student</button></td></tr>`}).join('')}</table></div>`}
async function lifeResult(id){let s=await one('school_profiles','*',[{op:'eq',col:'id',val:id}]);let scores=await q('school_scores','*',[{op:'eq',col:'student_id',val:id}]);let allSubjects=await q('school_subjects');let assigned=await q('school_student_subjects','*',[{op:'eq',col:'student_id',val:id},{op:'eq',col:'active',val:true}]);let assignedIds=new Set(assigned.map(x=>x.subject_id));let subjects=allSubjects.filter(x=>assignedIds.has(x.id));let terms=await q('school_terms');let completeness=profileCompleteness(s);let body=`<div class="profile-check ${completeness.missing.length?'warn':'good'}"><b>Profile completeness: ${completeness.pct}%</b><div class="profile-progress"><span style="width:${completeness.pct}%"></span></div>${completeness.missing.length?`Missing: ${esc(completeness.missing.join(', '))}`:'All report header fields are complete.'}</div><div class="notice ${subjects.length?'ok':''}" style="margin-top:10px">${subjects.length?`<b>${subjects.length} subject(s) assigned:</b> ${esc(subjects.map(x=>x.name).join(', '))}`:'No subjects assigned yet — edit the student and select the subjects they offer.'}</div>`;for(const t of terms){let ss=scores.filter(x=>x.term_id===t.id);let hasRelevant=ss.length||subjects.length;if(hasRelevant){let total=ss.reduce((a,x)=>a+Number(x.total||0),0);let possible=subjects.length*100;let average=subjects.length?total/subjects.length:0;let rank=await one('school_term_ranks','*',[{op:'eq',col:'student_id',val:id},{op:'eq',col:'term_id',val:t.id}]);body+=`<div class="card" style="margin-top:12px"><h3>${esc(t.name)} — ${esc(t.session)}</h3><p class="muted">Uploaded score records: ${ss.length} / ${subjects.length} subjects • Total: ${total} / ${possible} • Average: ${average.toFixed(2)}% • Class position: ${rank?.position||'—'}</p>${resultHTML(s,t,ss,subjects,rank)}</div>`}}openModal('Full result — '+s.name,body)}
async function usersPage(){
let users=await q('school_profiles');
el('content').innerHTML=`<div class="card"><h3>Roles</h3><p class="muted">Use role <b>admin</b> only for trusted school staff. Do not make a normal student an admin.</p></div><div class="table-wrap"><table class="table"><tr><th>Name</th><th>Email</th><th>Role</th><th></th></tr>${users.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.email)}</td><td><select onchange="changeRole('${u.id}',this.value)"><option ${u.role==='student'?'selected':''}>student</option><option ${u.role==='admin'?'selected':''}>admin</option></select></td><td>${u.id===A.user.id?'Current user':''}</td></tr>`).join('')}</table></div>`}
async function changeRole(id,role){try{await up('school_profiles',{id,role});toast('Role updated')}catch(e){toast(e.message,false)}}

function setupPage(){
el('content').innerHTML=`<div class="card"><h3>Supabase SQL schema</h3><p class="muted">Run this once in Supabase SQL Editor. It creates the tables used by this index.html. After running it, create the first account, then change that user's role to <code>admin</code> directly in the database.</p><textarea readonly style="width:100%;min-height:520px;font-family:ui-monospace">${esc(SQL)}</textarea><div class="notice small" style="margin-top:10px">Important: RLS policies must be tightened before production. The simple policies below are suitable for getting the prototype running, not for a high-security school deployment.</div></div>`}
const SQL=`
create extension if not exists pgcrypto;

create table if not exists public.school_profiles(
 id uuid primary key,
 email text, name text not null, class_name text, sex text, age int,
 parent_name text, house text, class_teacher text, headmistress text, password text,
 headmaster text, fees_payable numeric default 0, admission_no text,
 role text default 'student' check(role in ('student','admin')),
 created_at timestamptz default now()
);

create table if not exists public.school_classes(
 id uuid primary key default gen_random_uuid(), name text unique not null,
 created_at timestamptz default now()
);

create table if not exists public.school_terms(
 id uuid primary key default gen_random_uuid(), class_id uuid references public.school_classes(id) on delete cascade,
 name text not null, session text not null, created_at timestamptz default now()
);

create table if not exists public.school_subjects(
 id uuid primary key default gen_random_uuid(), name text unique not null
);

create table if not exists public.school_student_subjects(
 id uuid primary key default gen_random_uuid(),
 student_id uuid not null references public.school_profiles(id) on delete cascade,
 subject_id uuid not null references public.school_subjects(id) on delete cascade,
 active boolean default true,
 created_at timestamptz default now(),
 unique(student_id,subject_id)
);

create table if not exists public.school_scores(
 id uuid primary key default gen_random_uuid(),
 student_id uuid references public.school_profiles(id) on delete cascade,
 class_id uuid references public.school_classes(id) on delete cascade,
 term_id uuid references public.school_terms(id) on delete cascade,
 subject_id uuid references public.school_subjects(id) on delete cascade,
 test1 numeric default 0, test2 numeric default 0, test3 numeric default 0, test4 numeric default 0,
 exam numeric default 0, total numeric default 0, grade text, position int,
 unique(student_id,term_id,subject_id)
);

create table if not exists public.school_term_ranks(
 id uuid primary key default gen_random_uuid(), student_id uuid references public.school_profiles(id) on delete cascade,
 class_id uuid references public.school_classes(id) on delete cascade,
 term_id uuid references public.school_terms(id) on delete cascade,
 total_score numeric default 0, average numeric default 0, position int,
 unique(student_id,term_id)
);

create table if not exists public.school_mocks(
 id uuid primary key default gen_random_uuid(), title text not null,
 class_id uuid references public.school_classes(id) on delete cascade,
 term_id uuid references public.school_terms(id) on delete cascade,
 subject_id uuid references public.school_subjects(id) on delete cascade,
 target_test int check(target_test between 1 and 4),
 total_marks numeric default 10, duration_minutes int default 30,
 start_at timestamptz, end_at timestamptz, published boolean default false,
 questions jsonb default '[]'::jsonb, created_by uuid references public.school_profiles(id),
 created_at timestamptz default now()
);

create table if not exists public.school_mock_attempts(
 id uuid primary key default gen_random_uuid(),
 mock_id uuid references public.school_mocks(id) on delete cascade,
 student_id uuid references public.school_profiles(id) on delete cascade,
 score numeric default 0, answers jsonb default '{}'::jsonb,
 submitted_at timestamptz default now(),
 unique(mock_id,student_id)
);

create table if not exists public.school_releases(
 id uuid primary key default gen_random_uuid(),
 class_id uuid references public.school_classes(id) on delete cascade,
 term_id uuid references public.school_terms(id) on delete cascade,
 published boolean default false, published_at timestamptz, published_by uuid references public.school_profiles(id),
 unique(class_id,term_id)
);

alter table public.school_profiles enable row level security;
alter table public.school_classes enable row level security;
alter table public.school_terms enable row level security;
alter table public.school_subjects enable row level security;
alter table public.school_student_subjects enable row level security;
alter table public.school_scores enable row level security;
alter table public.school_term_ranks enable row level security;
alter table public.school_mocks enable row level security;
alter table public.school_mock_attempts enable row level security;
alter table public.school_releases enable row level security;

create or replace function public.is_admin() returns boolean language sql stable security definer set search_path=public as $$
 select exists(select 1 from public.school_profiles where id=auth.uid() and role='admin');
$$;

create policy "profiles own or admin" on public.school_profiles for all using(auth.uid()=id or public.is_admin()) with check(auth.uid()=id or public.is_admin());
create policy "classes authenticated" on public.school_classes for select using(auth.role()='authenticated');
create policy "classes admin write" on public.school_classes for all using(public.is_admin()) with check(public.is_admin());
create policy "terms authenticated" on public.school_terms for select using(auth.role()='authenticated');
create policy "terms admin write" on public.school_terms for all using(public.is_admin()) with check(public.is_admin());
create policy "subjects authenticated" on public.school_subjects for select using(auth.role()='authenticated');
create policy "subjects admin write" on public.school_subjects for all using(public.is_admin()) with check(public.is_admin());

create policy "student subjects admin" on public.school_student_subjects for all using(public.is_admin()) with check(public.is_admin());

create policy "scores own or admin" on public.school_scores for select using(student_id=auth.uid() or public.is_admin());
create policy "scores admin write" on public.school_scores for all using(public.is_admin()) with check(public.is_admin());

create policy "ranks own or admin" on public.school_term_ranks for select using(student_id=auth.uid() or public.is_admin());
create policy "ranks admin write" on public.school_term_ranks for all using(public.is_admin()) with check(public.is_admin());

create policy "published mocks visible" on public.school_mocks for select using(published=true or public.is_admin());
create policy "mocks admin write" on public.school_mocks for all using(public.is_admin()) with check(public.is_admin());

create policy "attempt own or admin" on public.school_mock_attempts for select using(student_id=auth.uid() or public.is_admin());
create policy "attempt own insert" on public.school_mock_attempts for insert with check(student_id=auth.uid());
create policy "attempt admin" on public.school_mock_attempts for all using(public.is_admin()) with check(public.is_admin());

create policy "release visible" on public.school_releases for select using(public.is_admin() or published=true);
create policy "release admin write" on public.school_releases for all using(public.is_admin()) with check(public.is_admin());
`;

async function student(){
shell('Student Portal','Only published mocks and published results are visible to students.',`
<button class="active" onclick="studentPage('home',this)">🏠 Home</button>
<button onclick="studentPage('mocks',this)">📝 My Mocks</button>
<button onclick="studentPage('result',this)">📄 My Result</button>
<button onclick="studentPage('profile',this)">👤 Profile</button>`);
studentPage('home',document.querySelector('.side button'))}
async function studentPage(p,b){
document.querySelectorAll('.side button').forEach(x=>x.classList.remove('active'));b?.classList.add('active');
try{if(p==='home')studentHome();if(p==='mocks')studentMocks();if(p==='result')studentResult();if(p==='profile')studentProfile()}catch(e){el('content').innerHTML='<div class="card">'+esc(e.message)+'</div>'}}
async function studentHome(){let mocks=await q('school_mocks');el('content').innerHTML=`<div class="grid g3"><div class="stat"><span class="muted">Published mocks</span><b>${mocks.length}</b></div><div class="stat"><span class="muted">Class</span><b style="font-size:20px">${esc(A.profile.class_name)}</b></div><div class="stat"><span class="muted">Result</span><b style="font-size:20px">Locked until published</b></div></div><div class="card"><h3>What you can access</h3><p>You can take only mocks the school has published. Your full result, grades, positions and average remain hidden until the admin publishes the result.</p></div>`}
async function studentMocks(){
let mocks=await q('school_mocks','*',[{op:'eq',col:'published',val:true}]);let attempts=await q('school_mock_attempts','*',[{op:'eq',col:'student_id',val:A.user.id}]);
el('content').innerHTML=`<div class="table-wrap"><table class="table"><tr><th>Mock</th><th>Subject</th><th>Test slot</th><th>Schedule</th><th>Status</th><th></th></tr>${mocks.map(m=>{let a=attempts.find(x=>x.mock_id===m.id);return `<tr><td>${esc(m.title)}</td><td>${esc(m.subject_id)}</td><td>Test ${m.target_test}</td><td>${fmtDate(m.start_at)}</td><td>${a?'Completed':'Available'}</td><td>${a?'<span class="pill">Submitted</span>':`<button class="btn primary small" onclick="takeMock('${m.id}')">Take mock</button>`}</td></tr>`}).join('')}</table></div>`}
async function takeMock(id){
let m=await one('school_mocks','*',[{op:'eq',col:'id',val:id}]);if(!m)return;let qs=Array.isArray(m.questions)?m.questions:[];
openModal(m.title,`<div id="mockbody">${qs.map((q,i)=>`<div class="q"><b>${i+1}. ${esc(q.question)}</b>${['A','B','C','D'].map(L=>`<label class="option"><input type="radio" name="q${i}" value="${L}"> ${L}. ${esc(q[L])}</label>`).join('')}</div>`).join('')}<div class="actions"><button class="btn primary" onclick="submitMock('${m.id}',${JSON.stringify(qs).replace(/</g,'\\u003c')})">Submit mock</button></div></div>`)}
async function submitMock(id,qs){
try{let score=0;qs.forEach((q,i)=>{let a=document.querySelector(`input[name="q${i}"]:checked`)?.value;if(a&&a===q.answer)score+=Number(q.mark||1)});let rawMax=qs.reduce((a,q)=>a+Number(q.mark||1),0);let normalized=rawMax?Math.min(10,score/rawMax*10):0;let m=await one('school_mocks','*',[{op:'eq',col:'id',val:id}]);await up('school_mock_attempts',{mock_id:id,student_id:A.user.id,score:normalized,answers:{},submitted_at:new Date().toISOString()});
let existing=await one('school_scores','*',[{op:'eq',col:'student_id',val:A.user.id},{op:'eq',col:'term_id',val:m.term_id},{op:'eq',col:'subject_id',val:m.subject_id}]);
let slot='test'+m.target_test;let row=existing||{student_id:A.user.id,class_id:m.class_id,term_id:m.term_id,subject_id:m.subject_id};row[slot]=Math.round(normalized*100)/100;row.total=['test1','test2','test3','test4','exam'].reduce((a,k)=>a+(Number(row[k])||0),0);row.grade=grade(row.total);await up('school_scores',row);closeModal();toast('Mock submitted. Your score has been recorded.');studentMocks()}catch(e){toast(e.message,false)}}
async function studentResult(){
let terms=await q('school_terms');let scores=await q('school_scores','*',[{op:'eq',col:'student_id',val:A.user.id}]);let releases=await q('school_releases');let subjects=await q('school_subjects');let releasedTerms=terms.filter(t=>releases.some(r=>r.term_id===t.id&&r.published));
el('content').innerHTML=releasedTerms.length?releasedTerms.map(t=>{let ss=scores.filter(x=>x.term_id===t.id);return `<div class="card"><h3>${esc(t.name)} — ${esc(t.session)}</h3><div class="table-wrap"><table class="table"><tr><th>Subject</th><th>T1</th><th>T2</th><th>T3</th><th>T4</th><th>Exam</th><th>Total</th><th>Grade</th><th>Subject Pos.</th></tr>${ss.map(x=>{let su=subjects.find(y=>y.id===x.subject_id);return `<tr><td>${esc(su?.name)}</td><td>${x.test1||0}</td><td>${x.test2||0}</td><td>${x.test3||0}</td><td>${x.test4||0}</td><td>${x.exam||0}</td><td>${x.total||0}</td><td>${x.grade||''}</td><td>${x.position||''}</td></tr>`}).join('')}</table></div><button class="btn primary" onclick="printStudentResult('${t.id}')">Print result</button></div>`}).join(''):`<div class="card"><h3>No published result</h3><p>Your result will appear here only when the school administrator publishes it.</p></div>`}
async function printStudentResult(termId){
let t=await one('school_terms','*',[{op:'eq',col:'id',val:termId}]);let ss=await q('school_scores','*',[{op:'eq',col:'student_id',val:A.user.id},{op:'eq',col:'term_id',val:termId}]);let subs=await q('school_subjects');let ranks=await one('school_term_ranks','*',[{op:'eq',col:'student_id',val:A.user.id},{op:'eq',col:'term_id',val:termId}]);openModal('Print result',resultHTML(A.profile,t,ss,subs,ranks));setTimeout(()=>window.print(),300)}
function resultHTML(s,t,ss,subs,rank){
let total=ss.reduce((a,x)=>a+Number(x.total||0),0),average=subs.length?total/subs.length:0,bySubject={};ss.forEach(x=>bySubject[x.subject_id]=x);
let rows=subs.map((su,i)=>{let x=bySubject[su.id]||{};let vals=['test1','test2','test3','test4','exam'].map(k=>x[k]===null||x[k]===undefined||x[k]===''?'':x[k]);let complete=vals.every(v=>v!=='');return `<tr><td>${i+1}</td><td>${esc(su.name)}</td><td>${vals[0]}</td><td>${vals[1]}</td><td>${vals[2]}</td><td>${vals[3]}</td><td>${vals[4]}</td><td>${x.total??''}</td><td>${x.grade||''}</td><td>${x.position||''}</td></tr>`}).join('');
let uploaded=ss.filter(x=>subs.some(su=>su.id===x.subject_id)).length;
return `<div class="result-preview printable"><div class="result-head"><h2>DE-TRINITY MONTESSORI EDUCATION CENTER</h2><div>TERMINAL ACADEMIC REPORT</div><small>${esc(t?.name||'')} • ${esc(t?.session||'')}</small></div>
<div class="result-meta"><div><b>Name:</b> ${esc(s.name)}</div><div><b>Class:</b> ${esc(s.class_name)}</div><div><b>Sex:</b> ${esc(s.sex)}</div><div><b>Age:</b> ${esc(s.age)}</div><div><b>Parent:</b> ${esc(s.parent_name)}</div><div><b>House:</b> ${esc(s.house)}</div><div><b>Fees payable:</b> ₦${money(s.fees_payable)}</div><div><b>Admission No.:</b> ${esc(s.admission_no)}</div></div>
<div class="result-status ${uploaded===subs.length&&subs.length?'ok':''}" style="margin:10px 0">${subs.length?`Result upload status: <b>${uploaded}/${subs.length} subjects</b> have score records for this term.`:'No subjects assigned to this student.'}</div>
<table class="result-table"><tr><th>S/N</th><th>SUBJECT</th><th>Test 1<br>/10</th><th>Test 2<br>/10</th><th>Test 3<br>/10</th><th>Test 4<br>/10</th><th>Exam<br>/60</th><th>Total<br>/100</th><th>Grade</th><th>Subj. Pos.</th></tr>${rows}
<tr><th colspan="7">TOTAL / AVERAGE</th><th>${total}</th><th colspan="2">${average.toFixed(2)}%</th></tr></table>
<div class="result-footer"><div><div class="sig">Class Teacher<br>${esc(s.class_teacher||'Class Teacher')}</div></div><div><div class="sig">Headmistress<br>${esc(s.headmistress||'Headmistress')}</div></div><div><div class="sig">Principal/Headmaster<br>${esc(s.headmaster||'Headmaster')}</div></div></div>
<div style="display:flex;justify-content:space-between;margin-top:20px;font-size:10px"><span>Official School Stamp: AUTO-GENERATED ON PRINT</span><span>Signature: AUTO-GENERATED ON PRINT</span><span>Printed: ${new Date().toLocaleString('en-GB')}</span></div></div><div class="actions no-print" style="margin-top:12px"><button class="btn primary" onclick="window.print()">🖨 Print full result</button></div>`}
async function studentProfile(){el('content').innerHTML=`<div class="card">${profileForm(A.profile)}<button class="btn primary" onclick="updateOwnProfile()">Save changes</button></div>`}
async function updateOwnProfile(){try{let p={id:A.user.id,name:el('f_name').value,class_name:el('f_class').value,sex:el('f_sex').value,age:el('f_age').value,parent_name:el('f_parent').value,house:el('f_house').value,class_teacher:el('f_teacher').value,headmistress:el('f_headmistress').value,headmaster:el('f_headmaster').value,fees_payable:Number(el('f_fees').value||0),admission_no:el('f_adm').value};await up('school_profiles',p);Object.assign(A.profile,p);toast('Profile updated')}catch(e){toast(e.message,false)}}

function openModal(title,body){let m=document.createElement('div');m.className='modal';m.id='modal';m.innerHTML=`<div class="modalbox"><button class="close no-print" onclick="closeModal()">✕</button><h2 class="no-print">${esc(title)}</h2><div>${body}</div></div>`;document.body.appendChild(m)}
function closeModal(){el('modal')?.remove()}
boot();
</script>
